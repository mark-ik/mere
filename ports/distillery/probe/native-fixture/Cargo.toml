[package]
name = "distillery-native-fixture"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Native numerical control for Distillery's browser model matrix."

[workspace]

[dependencies]
burn = { version = "0.22.0-pre.2", default-features = false, features = ["ndarray", "std"] }
esp = { path = "../../../../crates/intel/esp", features = ["bert", "decoder"] }
serde_json = "1"

[[bin]]
name = "distillery-decoder-native-fixture"
path = "src/bin/decoder.rs"
