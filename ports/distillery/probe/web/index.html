<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Distillery browser model probe</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body data-probe-state="idle">
    <main>
      <header>
        <p class="eyebrow">Distillery · D2 evidence surface</p>
        <h1>Browser model corridor</h1>
        <p>Cold store, worker termination, warm reopen, and WGPU execution across a pinned model matrix.</p>
      </header>

      <form id="probe-controls">
        <label>Configured model
          <select id="model-selection" disabled>
            <option>Loading model matrix…</option>
          </select>
        </label>
        <p id="model-metadata">Loading pinned artifact metadata.</p>
        <label>Model base URL
          <input id="model-base-url" value="/models/all-MiniLM-L6-v2">
        </label>
        <label>Model identity
          <input id="model-id" value="sentence-transformers/all-MiniLM-L6-v2">
        </label>
        <label>Fixed input
          <textarea id="probe-input">This is a sample sentence.</textarea>
        </label>
        <div class="row">
          <label>Executions
            <input id="run-count" type="number" min="1" max="20" value="3">
          </label>
          <label>Idle sample, ms
            <input id="idle-ms" type="number" min="250" value="1500">
          </label>
          <label>Frame bound, ms
            <input id="frame-bound" type="number" min="1" step="0.1" value="33.4">
          </label>
        </div>
        <label class="check">
          <input id="request-persistence" type="checkbox" checked>
          Ask the browser for persistent storage and record its answer
        </label>
        <div class="actions">
          <button id="run-suite" type="submit">Run selected row</button>
          <button id="run-matrix" type="button" disabled>Run configured matrix</button>
          <button id="run-decoder" type="button" disabled>Run decoder row</button>
          <button id="cancel-active" type="button">Terminate active worker</button>
          <button id="download-receipt" type="button" disabled>Download JSON</button>
        </div>
      </form>

      <section aria-live="polite">
        <h2>State</h2>
        <p id="status">Idle.</p>
        <ol id="state-log"></ol>
      </section>

      <section>
        <h2>Receipt</h2>
        <pre id="receipt">No run yet.</pre>
      </section>
    </main>
    <script type="module" src="./probe.js"></script>
  </body>
</html>
