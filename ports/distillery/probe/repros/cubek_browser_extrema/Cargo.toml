[package]
name = "cubek-browser-extrema-repro"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Minimal headed WebGPU reproducer for Cubek extrema identities."

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std", "wgpu"] }
getrandom = { version = "0.4", features = ["wasm_js"] }
js-sys = "=0.3.99"
wasm-bindgen = "=0.2.122"
wasm-bindgen-futures = "=0.4.72"
web-sys = "=0.3.99"

[patch.crates-io]
cubecl-runtime = { path = "../../../../../support/patches/cubecl-runtime" }
cubek-reduce = { path = "../../../../../support/patches/cubek-reduce" }
