[package]
name = "distillery"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The model-works port of the Mere platform: a host for mesh-supervised inference, embedding, and training jobs."
readme = "README.md"
keywords = ["inference", "embedding", "mesh", "harness", "compute"]
categories = ["concurrency"]

[dependencies]
mesh.workspace = true
mesh-host.workspace = true
mere-resident.workspace = true
muniment.workspace = true
personae.workspace = true
pandect.workspace = true
cambium.workspace = true
eidetic = { workspace = true, optional = true }
esp = { workspace = true, features = ["decoder-lora"], optional = true }
pollster = { version = "0.4", optional = true }
genet-host-api = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "sync", "time"] }
transport.workspace = true
burn-backend = { version = "=0.22.0-pre.2", optional = true }
burn-ir = { version = "=0.22.0-pre.2", optional = true }
burn-remote = { version = "=0.22.0-pre.2", default-features = false, features = ["client", "server", "iroh"], optional = true }
iroh = { version = "1.0.3", optional = true }

[features]
default = []
remote = ["dep:burn-backend", "dep:burn-ir", "dep:burn-remote", "dep:iroh"]
trainer = ["dep:esp", "dep:eidetic", "dep:pollster", "tokio/rt"]

[dev-dependencies]
burn-flex = { version = "=0.22.0-pre.2", features = ["default"] }
safetensors = "0.4"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
tempfile = "3"
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", version = "=0.1.0" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", version = "=0.1.0" }
