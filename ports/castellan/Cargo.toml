[package]
name = "castellan"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Name reservation. Castellan is the credential-keeper port of the Mere platform: the officer of the gate who holds your chatelaine (secrets: passwords, 2FA seeds, tokens) and presents your emblems (graded proofs of identity), in trust for your personae. Hosts embed views; only the castellan touches secrets, and every release is a gate petition."
readme = "README.md"
keywords = ["credentials", "identity", "vault", "agent", "persona"]
categories = ["authentication"]

[features]
# The SitedStationGrant adapter uses Mere's host-side wallet store to issue and
# check the existing signed RemoteAuth envelope. Keep the credential and OTP
# library halves usable without that application-storage dependency.
station-grants = ["dep:session-runtime"]

[dependencies]
# HMAC + the three hashes RFC 6238 allows. RustCrypto, and sha2 is already a
# workspace pin, so this adds one lineage rather than three.
hmac = "0.13"
personae.workspace = true
sha1 = "0.11"
sha2.workspace = true
session-runtime = { workspace = true, optional = true }
zeroize = "1"
