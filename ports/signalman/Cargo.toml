[workspace]
resolver = "2"

[package]
name = "mere-signalman"
version = "0.0.1"
edition = "2024"
rust-version = "1.96"
license = "MPL-2.0"
repository = "https://github.com/merely-made/mere"
publish = false
description = "Private Mere port for commissioning and operating Retinue stations through Castellan."

[dependencies]
blake3 = "1.5"
castellan = { path = "../castellan", features = ["station-grants"] }
personae = { path = "../../crates/dramatis/personae" }
p2panda-core = "0.7.0"
# This port is consumed from mere.git, where a sibling Retinue checkout does
# not exist. Signalman's desktop workspace patches this exact source back to
# its local Retinue crates so Cargo still builds one type-bearing family.
outrider = { version = "=0.1.1", git = "https://github.com/merely-made/retinue.git", rev = "655336dd966ec87d64b8121ec7df9093c089e4e7" }
postilion = { version = "=0.1.0", git = "https://github.com/merely-made/retinue.git", rev = "655336dd966ec87d64b8121ec7df9093c089e4e7" }
retinue = { version = "=0.1.1", git = "https://github.com/merely-made/retinue.git", rev = "655336dd966ec87d64b8121ec7df9093c089e4e7", features = ["tulle-radio"] }
serde = { version = "1", features = ["derive"] }
pandect = { path = "../../crates/system/pandect" }
tokio = { version = "1", features = ["rt", "sync", "time"] }
zeroize = "1"

[dev-dependencies]
tempfile = "3"
