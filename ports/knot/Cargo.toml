[package]
name = "knot-editor"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Knot Editor, Mere's files-in-place local-first Djot editor."

[[bin]]
name = "knot_endpoint"
path = "src/bin/knot_endpoint.rs"

[[bin]]
name = "knot_sync_host"
path = "src/bin/knot_sync_host.rs"

[dependencies]
base64.workspace = true
blake3.workspace = true
chartulary.workspace = true
eidetic = { workspace = true, features = ["json-schema"] }
fetch.workspace = true
fleece.workspace = true
graphshell-endpoint.workspace = true
chirograph.workspace = true
graphshell-stdio.workspace = true
inker.workspace = true
jotdown = "0.10"
knot-document = { workspace = true, features = ["engine"] }
muniment = { workspace = true, features = ["redb"] }
mora.workspace = true
mora-cmudict.workspace = true
# `endpoint.rs` names `nematic::HtmlFragmentEngine`, which is behind nematic's
# `html-fragment` feature. The workspace pin is `default-features = false`, so
# until 2026-09-03 this compiled only because knot-editor-host resolved from
# genet.git and pulled nematic's defaults in through genet's own workspace
# table. knot-editor-host is a member here now, so the feature is named where
# it is used.
nematic = { workspace = true, features = ["html-fragment"] }
notify = "8"
notochord = { workspace = true, features = ["tokio"] }
personae.workspace = true
p2panda-core = "0.7.0"
# Every p2panda-net feature except `sqlite`. The address book runs on
# stickleback's muniment-backed store, so p2panda-store's bundled SQLite
# backend (and sqlx with it) stays out of the graph entirely. Feature
# unification means EVERY consumer has to opt out, not just one.
p2panda-net = { package = "mere-p2panda-net", version = "=0.7.2", default-features = false, features = [
  "address_book",
  "iroh_endpoint",
  "iroh_mdns",
  "discovery",
  "gossip",
  "sync",
] }
p2panda-store = { version = "0.7.0", default-features = false }
pollster = "0.4"
postcard = { version = "1", features = ["alloc"] }
proofs.workspace = true
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sceno.workspace = true
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "2.7"
script-rhai.workspace = true
servitor.workspace = true
pandect.workspace = true
esp.workspace = true
stickleback.workspace = true
thiserror = "1"
transport = { workspace = true, features = ["noise", "notochord"] }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
gemot.workspace = true
genet-probe = { workspace = true }
graphshell = { path = "../graphshell" }
graphshell-local.workspace = true
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
