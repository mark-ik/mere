[package]
name = "knot"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Files-in-place authoring endpoint for Mere."

[[bin]]
name = "knot_endpoint"
path = "src/bin/knot_endpoint.rs"

[[bin]]
name = "knot_sync_host"
path = "src/bin/knot_sync_host.rs"

[dependencies]
base64.workspace = true
blake3.workspace = true
cambium.workspace = true
chartulary.workspace = true
eidetic = { workspace = true, features = ["json-schema"] }
fetch.workspace = true
graphshell-endpoint.workspace = true
chirograph.workspace = true
graphshell-stdio.workspace = true
inker.workspace = true
illume.workspace = true
knot-editor-host.workspace = true
muniment = { workspace = true, features = ["redb"] }
nematic.workspace = true
notify = "8"
notochord = { workspace = true, features = ["tokio"] }
personae.workspace = true
p2panda-core = "0.7.0"
# Every p2panda-net feature except `sqlite`. The address book runs on
# stickleback's muniment-backed store, so p2panda-store's bundled SQLite
# backend (and sqlx with it) stays out of the graph entirely. Feature
# unification means EVERY consumer has to opt out, not just one.
p2panda-net = { version = "0.7.0", default-features = false, features = [
  "address_book",
  "iroh_endpoint",
  "iroh_mdns",
  "discovery",
  "gossip",
  "sync",
] }
p2panda-store = { version = "0.7.0", default-features = false }
pollster = "0.4"
postcard = { version = "1", features = ["alloc"] }
proofs.workspace = true
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
sceno.workspace = true
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
similar = "2.7"
script-rhai.workspace = true
servitor.workspace = true
pandect.workspace = true
esp.workspace = true
stickleback.workspace = true
thiserror = "1"
transport = { workspace = true, features = ["noise", "notochord"] }
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url = "2"
uuid.workspace = true
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
graphshell = { path = "../graphshell" }
rcgen = "0.14"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
transport.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
] }

[lints]
workspace = true
