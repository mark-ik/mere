[package]
name = "knot-document"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
cambium.workspace = true
mere-surface-api = { workspace = true }
illume = { workspace = true, optional = true }
knot-editor-host = { workspace = true }
inker = { workspace = true, optional = true }
nematic = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"
genet-scripted-dom = { workspace = true }
layout-dom-api = { workspace = true }

[lints]
workspace = true
