[package]
name = "knot-document"
version = "0.0.1"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Djot-first local document authority and reusable Knot surface."

[features]
default = []
# Broad Knot conversion, preview, and canonicalization. The ordinary document
# surface intentionally retains only the lightweight editor readout.
engine = [
    "knot-editor-host/preview",
    "dep:illume",
    "dep:inker",
    "dep:nematic",
    "dep:serde_json",
]

[dependencies]
cambium.workspace = true
genet-host-api = { version = "0.1.0", git = "https://github.com/merely-made/genet.git", branch = "main" }
illume = { workspace = true, optional = true }
knot-editor-host = { git = "https://github.com/merely-made/genet.git", branch = "main", default-features = false }
inker = { workspace = true, optional = true }
nematic = { git = "https://github.com/merely-made/genet.git", branch = "main", optional = true, default-features = false }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
