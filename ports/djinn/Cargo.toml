[package]
name = "djinn"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first desktop resident composition for the Mere stack: identity, local sessions, personal sync, Knot, credential custody, and endpoint ownership."
readme = "README.md"
keywords = ["local-first", "p2p", "resident", "identity", "djot"]
categories = ["command-line-utilities", "authentication"]

[features]
default = ["personal-sync"]
personal-sync = []

[dependencies]
blake3.workspace = true
castellan = { workspace = true, features = ["keeper"] }
chirograph.workspace = true
graphshell = { path = "../graphshell", features = ["personal-sync"] }
knot-editor = { version = "0.0.2", path = "../knot" }
mere-resident.workspace = true
muniment.workspace = true
pandect.workspace = true
personae = { workspace = true, features = ["agent"] }
sceno.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
ssh-agent-lib = "0.6"
thiserror = "1"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
transport = { workspace = true, features = ["notochord"] }
uuid = { workspace = true, features = ["v5"] }
zeroize = "1"

[[bin]]
name = "djinn"
path = "src/bin/djinn.rs"
required-features = ["personal-sync"]

[dev-dependencies]
graphshell-endpoint.workspace = true
p2panda-core = "0.7.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
