[package]
name = "djinn"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Local-first desktop resident composition for the Mere stack: identity, local sessions, personal sync, Knot, credential custody, and endpoint ownership."
readme = "README.md"
keywords = ["local-first", "p2p", "resident", "identity", "djot"]
categories = ["command-line-utilities", "authentication"]

[features]
default = ["personal-sync"]
personal-sync = []

[dependencies]
blake3.workspace = true
castellan = { workspace = true, features = ["keeper"] }
chirograph.workspace = true
# The operational works composed as this resident's fourth lane
# (`src/resident_distillery.rs`). Default features only: `remote` and `trainer`
# would pull the burn stack into the desktop resident.
distillery.workspace = true
graphshell = { version = "0.0.2", path = "../graphshell", features = ["personal-sync"] }
knot-editor = { version = "0.0.3", path = "../knot" }
mere-resident.workspace = true
# The policy vocabulary the device sensor fills in (`DeviceConditions`), and
# the `ConditionSource` seam it plugs into. `mere-mesh` refuses to touch the
# OS; `src/conditions.rs` is the Windows-facing half that seam expects.
mesh.workspace = true
mesh-host.workspace = true
muniment.workspace = true
pandect.workspace = true
personae = { workspace = true, features = ["agent"] }
sceno.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
ssh-agent-lib = "0.6"
thiserror = "1"
# "signal" is what lets the run loop stop the mesh works deliberately on Ctrl-C
# rather than being killed mid-lease.
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing.workspace = true
tracing-subscriber.workspace = true
transport = { workspace = true, features = ["notochord"] }
uuid = { workspace = true, features = ["v5"] }
zeroize = "1"

# Device condition sensing (`src/conditions.rs`). Win32 only — no COM, no WMI,
# no WinRT, so the resident never pays for a COM apartment to read a battery.
# `Win32_NetworkManagement_Ndis` and `Win32_Networking_WinSock` are not called
# directly; `IP_ADAPTER_ADDRESSES_LH` is cfg-gated on both.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  "Win32_System_Power",
  "Win32_System_SystemInformation",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[[bin]]
name = "djinn"
path = "src/bin/djinn.rs"
required-features = ["personal-sync"]

[dev-dependencies]
graphshell-endpoint.workspace = true
p2panda-core = "0.7.0"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
