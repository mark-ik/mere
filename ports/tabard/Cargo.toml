[package]
name = "tabard"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
# Landed in mere 2026-09-03 (platform boundary plan, P3).
repository = "https://github.com/merely-made/mere"
description = "Theme-authoring port for Genet: Tinct seeds in, typed DTCG design tokens and Livery CSS custom-property stylesheets out."
readme = "README.md"
keywords = ["theme", "design-tokens", "oklch", "palette", "icons"]
categories = ["gui", "graphics"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
tinct = { workspace = true }

[dev-dependencies]
# Formerly relative paths into genet's components; now the workspace git pins.
genet-livery = { workspace = true }
genet-static-dom = { workspace = true }
layout-dom-api = { workspace = true }
livery = { workspace = true }
