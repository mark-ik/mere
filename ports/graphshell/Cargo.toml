[package]
name = "graphshell"
version = "0.0.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graphshell presentation host and loopback acceptance view."
autobins = false

[features]
default = ["native"]
# Existing admitted sessions, transports, Personae composition, and receipt
# binaries. This remains the default so current native callers keep working.
native = [
    "webrtc-join",
    "dep:blake3",
    "dep:graphshell-network",
    "dep:graphshell-stdio",
    "dep:light-file-dialog",
    "dep:notochord",
    "dep:castellan",
    "dep:personae",
    "personae/agent",
    "dep:rand_core",
    "dep:serde",
    "dep:pandect",
    "dep:signature",
    "dep:ssh-agent-lib",
    "dep:ssh-key",
    "dep:thiserror",
    "dep:tokio",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:transport",
    "dep:uuid",
    "dep:webrtc-carrier",
    "dep:zeroize",
]
# The live WebRTC lane: the join sequence over a real carrier and the pump
# that presents its frames as the session stream. Separate from `native`
# because it is what pulls str0m and the carrier's own tokio driver into the
# build — every native Graphshell that is not yet serving browser joins keeps
# not paying for them. The C4a fixture and its tests require this feature.
webrtc-session = ["native", "webrtc-join", "webrtc-carrier/native"]

# The joining side of the WebRTC door, buildable for `wasm32-unknown-unknown`:
# the peer sequence, the wire both sides share, and the door's client
# functions. No runtime, no transport, no carrier beyond its Wasm-clean core.
# `webrtc-session` implies it. A wasm build also needs
# `--cfg getrandom_backend="wasm_js"` in the target's rustflags — see
# `crates/dramatis/personae/Cargo.toml` for why that cannot live here.
# The browser's glue over the join: a `BrowserInitiator` as the join's frame
# channel and the NDJSON session over its frames. wasm32 only in effect — the
# carrier's `browser` adapter declares its JS bindings for that target alone,
# so enabling this natively activates nothing, and the module is gated to the
# target as well.
webrtc-browser = ["webrtc-join", "webrtc-carrier/browser"]

webrtc-join = [
    "dep:getrandom",
    "dep:notochord",
    "dep:personae",
    "dep:serde",
    "dep:thiserror",
    "dep:webrtc-carrier",
]

# C4a's composition receipt: the join, admission, pump, serve loop and the
# event-driven client over one real loopback WebRTC pair. `required-features`
# rather than a cfg inside, so a default `cargo test` never reaches the file.


# The browser reference-host cone. H0 proves the dependency boundary; H1 adds
# the local Mere host adapter on top of this selected graph + canvas surface.
#
# Holds no browser API of its own. The wasm presenter that consumes this cone
# is the separate `graphshell-web` crate (`web/Cargo.toml`, whose `[lib] path`
# is `src/web.rs`), and it names its own JS bindings; the IndexedDB backend it
# stores through belongs to muniment, beside the redb and zip realizations.
web = [
    "dep:async-trait",
    "dep:chartulary",
    "dep:eidetic",
    "dep:mere",
    "dep:muniment",
    "dep:serde",
    "dep:sha2",
    "dep:uuid",
    "dep:url",
]
# Native device-agent composition for H7 personal graph synchronization. The
# browser/PWA reaches this authority through its admitted device session.
personal-sync = [
    "native",
    "web",
    "muniment/redb",
    "dep:p2panda-core",
    "dep:p2panda-store",
    "dep:stickleback",
]

[dependencies]
async-trait = { version = "0.1", optional = true }
base64.workspace = true
chartulary = { workspace = true, optional = true }
eidetic = { workspace = true, optional = true }
graphshell-client = { version = "0.0.2", path = "../../crates/graphshell/graphshell-client" }
graphshell-endpoint = { version = "0.0.2", path = "../../crates/graphshell/graphshell-endpoint" }
chirograph.workspace = true
mere = { path = "../../crates/mere", default-features = false, features = ["graph", "canvas"], optional = true }
muniment = { workspace = true, optional = true }
sceno.workspace = true
scenotime.workspace = true
serde = { version = "1", features = ["derive"], optional = true }
serde_json.workspace = true
sha2 = { workspace = true, optional = true }
uuid = { workspace = true, features = ["v5"], optional = true }
url = { version = "2", optional = true }


# Wasm-clean, and declared here rather than in the native-only table below so
# the browser build can reach them: the identity core (`personae` without
# `agent`), Notochord's decision core, the carrier's Wasm-clean core, and the
# join's own two small deps. `rand_core` and `transport` stay native-only —
# one would drag a third `getrandom` major into the wasm graph, the other is
# iroh and tokio.
notochord = { workspace = true, features = ["tokio"], optional = true }
# Declared without `agent`: that feature is the ssh-agent lane (tokio,
# gethostname) and only the native cone wants it, so `native` enables it and a
# wasm feature enabling this dependency gets the identity core alone.
personae = { workspace = true, optional = true }
thiserror = { version = "1", optional = true }
# The join's nonces. See `webrtc_join`'s module doc for why not `rand_core`.
getrandom = { version = "0.3", optional = true }
webrtc-carrier = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
blake3 = { workspace = true, optional = true }
graphshell-network = { version = "0.0.1", path = "../../crates/graphshell/graphshell-network", optional = true }
graphshell-stdio = { version = "0.0.2", path = "../../crates/graphshell/graphshell-stdio", optional = true }
light-file-dialog = { version = "3.21.3", optional = true }
# The application composes Personae: the profile Graphshell speaks as. The
# protocol and client crates deliberately do not depend on it.
# The identity keeper: view, projection, authority. Graphshell composes it
# and re-exports it at the pre-founding paths (identity, identity_projection,
# native::personae_host).
castellan = { workspace = true, features = ["keeper"], optional = true }
p2panda-core = { version = "0.7.0", optional = true }
p2panda-store = { version = "0.7.0", default-features = false, optional = true }
rand_core = { version = "0.6", features = ["getrandom"], optional = true }
pandect = { workspace = true, optional = true }
signature = { version = "2", optional = true }
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.6", features = ["ed25519", "encryption"], optional = true }
stickleback = { workspace = true, optional = true }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "sync", "time"], optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
# G5d: the projection carrier. `notochord` brings in the one audited
# `AcceptedSession -> SessionFacts` adapter (Notochord N1) so this port does
# not hand-build carrier facts of its own.
transport = { workspace = true, features = ["notochord"], optional = true }
# C2: the WebRTC door's core types — `InviteV1`, `LinkChallenge`, and the three
# signing-byte domains the host and browser both compute over. Default
# features only: the door is sans-I/O and wants the Wasm-clean core, not the
# `native` str0m adapter, which the dev-dependency below turns on for the
# loopback integration test alone.
zeroize = { version = "1", optional = true }

[target.'cfg(all(windows, not(target_arch = "wasm32")))'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[[bin]]
name = "g1_receipt"
path = "src/bin/g1_receipt.rs"
required-features = ["native"]

[[bin]]
name = "g4_sessions"
path = "src/bin/g4_sessions.rs"
required-features = ["native"]

[[bin]]
name = "g5_peer"
path = "src/bin/g5_peer/main.rs"
required-features = ["native"]

[[bin]]
name = "h6_transfer_peer"
path = "src/bin/h6_transfer_peer/main.rs"
required-features = ["native", "web"]

[[bin]]
name = "h7_sync_peer"
path = "src/bin/h7_sync_peer.rs"
required-features = ["personal-sync"]

[[bin]]
name = "n4_policy_receipt"
path = "src/bin/n4_policy_receipt.rs"
required-features = ["native"]

[[bin]]
name = "h4_identity_receipt"
path = "src/bin/h4_identity_receipt.rs"
required-features = ["native"]

[[bin]]
name = "persona_switch_receipt"
path = "src/bin/persona_switch_receipt.rs"
required-features = ["native"]

[[bin]]
name = "graphshell_native_host"
path = "src/bin/graphshell_native_host.rs"
required-features = ["native"]

[[bin]]
name = "receipt_ingest"
path = "src/bin/receipt_ingest.rs"
# Needs the personal-graph event vocabulary and muniment's redb backend, both
# of which arrive with personal-sync.
required-features = ["personal-sync"]

[[bin]]
name = "h4d_browser_receipt_host"
path = "src/bin/h4d_browser_receipt_host.rs"
required-features = ["native"]

[[bin]]
name = "h4e_browser_import_receipt_host"
path = "src/bin/h4e_browser_import_receipt_host.rs"
required-features = ["native"]

[[bin]]
name = "h4f_agent_probe"
path = "src/bin/h4f_agent_probe.rs"
required-features = ["native"]

[dev-dependencies]
# The C0 acceptance fixture derives its shared link the way the real carrier
# does rather than pasting a constant, so a change to the transcript encoding
# fails that test too. C2 adds the `native` feature on top: the door's own
# integration test drives a real str0m loopback so the link challenge binds
# fingerprints from a DTLS handshake that actually ran, not fabricated ones.
webrtc-carrier = { workspace = true, features = ["native"] }
pollster = "0.4"
tempfile = "3"
# `process` is the C4a signaling receipt: it spawns the fixture *binary* and
# reads its stdout, because "the pieces compose in-process" and "the binary a
# headed run launches works" are different claims.
tokio = { version = "1", features = [
    "io-util",
    "macros",
    "net",
    "process",
    "rt",
    "rt-multi-thread",
    "time",
] }

[[bin]]
name = "c4_webrtc_host"
path = "src/bin/c4_webrtc_host.rs"
required-features = ["webrtc-session"]

[[test]]
name = "webrtc_join_loopback"
required-features = ["webrtc-session"]

# The fixture binary driven through its own HTTP signaling: what an in-process
# composition cannot claim about the binary a headed run actually launches.
[[test]]
name = "c4_host_signaling"
required-features = ["webrtc-session"]

# The browser build's entropy: the same-named entry merges its feature into
# the one above, the way `personae` does it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"], optional = true }
