<!doctype html>
<html lang="en" class="full-page">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Graphshell H3</title>
    <link rel="stylesheet" href="./styles.css?h3=1">
  </head>
  <body class="full-page">
    <!-- The full-page surface: the component fills the body and owns the
         title. The same element embedded beside other content is the other
         surface (embed.html); both run the same bundle and the same host. -->
    <graphshell-view id="graphshell" data-owns-title data-ready="false"></graphshell-view>

    <!-- The scenario lane's output. Page-level, outside the component, and
         hidden from the accessibility tree: a receipt must not change the
         surface it measures. -->
    <section id="scenario-host" aria-hidden="true" hidden>
      <pre id="scenario-log"></pre>
      <pre id="scenario-result"></pre>
      <div id="scenario-captures"></div>
    </section>

    <script type="module" src="./loader.js"></script>
  </body>
</html>
