[package]
name = "graphshell-web"
version = "0.1.0"
edition = "2024"
publish = false

# Stands on its own, outside the mere workspace. The root manifest lists this
# path under `exclude`, but that entry cannot fire by itself: cargo only
# excludes a path that is not already an explicit member, and `ports/graphshell`
# directly above this one IS an explicit member, so the exclude is inert and
# cargo reports "current package believes it's in a workspace when it's not".
# This table is what actually keeps it out. Standing alone also means nothing is
# inherited: the dependency versions below are spelled out rather than taken
# from `workspace.dependencies`, and any `[patch]` the root manifest carries has
# to be restated at the bottom of this file.
[workspace]

[lib]
name = "graphshell_web"
crate-type = ["cdylib"]
path = "../src/web.rs"

[dependencies]
graphshell = { path = "..", default-features = false, features = ["web"] }
mere = { path = "../../../crates/mere", default-features = false, features = ["graph", "canvas"] }
# `indexeddb` supplies the browser realization of muniment's byte-store seam,
# which this crate hands to `GraphshellApp` as its backend. It lived here until
# the duplicate showed up; muniment owns the backend family, so it owns this.
muniment = { path = "../../../crates/eidetic/muniment", features = ["indexeddb"] }
graphshell-client = { path = "../../../crates/graphshell/graphshell-client" }
sceno = { path = "../../../crates/scenograph/sceno" }
scenotime = { path = "../../../crates/scenograph/scenotime" }
serde = { version = "1", features = ["derive"] }
cambium = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-render = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
# The present core, shared with every winit host. Booting wgpu, picking a
# non-sRGB surface format, and rasterizing a Scene are not browser-specific, so
# this crate no longer hand-rolls them; only the canvas target and the
# content-over-chrome composition below are ours.
genet-render-host = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", version = "=0.1.0" }
js-sys = "0.3"
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
serde_json = "1"
sha2 = "0.11"
uuid = { version = "1", features = ["serde", "v4"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
    "console",
    "Blob",
    "Document",
    "DomRect",
    "Element",
    "Event",
    "EventTarget",
    "File",
    "FileList",
    "HtmlCanvasElement",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlTextAreaElement",
    "KeyboardEvent",
    "MouseEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "StorageManager",
    "WheelEvent",
    "Window",
] }

# Restated from the root manifest, which this standalone crate does not inherit
# (see the note at the top). Both are Genet forks published under the same
# version number as the crate they replace, so missing either is invisible
# while genet-livery resolves from crates.io and a compile error the moment it
# resolves the working copy: livery uses `AlignmentOptions::last_line_alignment`
# and `StyleProperty::TabSize`, which published parley 0.10.0 lacks, and buckram
# names `genet-taffy` outright. layout-dom-api and genet-scripted-dom are the
# root's other two crates-io restatements: both are published at 0.1.0 and
# pinned to the same rev so no crates.io copy can enter the graph beside the
# git one. Keep the rev in step with the genet pins above.
[patch.crates-io]
taffy = { package = "genet-taffy", version = "=0.14.0", git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
parley = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", version = "=0.1.0" }
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "da8762fd910d855d3bccec8af75d474d360e35b6", version = "=0.1.0" }
