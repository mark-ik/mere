[package]
name = "scenograph"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Facade for the scenograph projection-engine family: re-exports sceno (core), scenomise (choreography), and scenotime (runtime)."
readme = "../README.md"
keywords = ["projection", "scene", "graph", "visualization"]
categories = ["visualization", "gui"]

[dependencies]
sceno = { version = "0.0.3", path = "../sceno" }
scenomise = { version = "0.0.3", path = "../scenomise" }
scenotime = { version = "0.0.3", path = "../scenotime" }
