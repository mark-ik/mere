[package]
name = "scenograph"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Facade for the scenograph projection-engine family: re-exports sceno (core), scenomise (choreography), and scenotime (runtime)."
readme = "../README.md"
keywords = ["projection", "scene", "graph", "visualization"]
categories = ["visualization", "gui"]

[dependencies]
sceno = { version = "0.0.4", path = "../sceno" }
scenomise = { version = "0.0.4", path = "../scenomise" }
scenotime = { version = "0.0.4", path = "../scenotime" }
# The registry's capability records serialize, and a custom arrangement's
# config is the opaque `serde_json::Value` the score already carries.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
