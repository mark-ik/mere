[package]
name = "sceno"
version = "0.0.3"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core contracts for the scenograph projection engine: source references, coordinate spaces, footprints, persisted scores, and scene instances carrying representation slots and emphasis channels."
readme = "../README.md"
keywords = ["projection", "scene", "graph", "visualization"]
categories = ["visualization", "data-structures"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
