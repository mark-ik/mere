[package]
name = "sceno"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Core contracts for the scenograph projection engine: source references, coordinate spaces, footprints, and scene snapshots with per-instance identity. Scores and action intents arrive with later proofs."
readme = "../README.md"
keywords = ["projection", "scene", "graph", "visualization"]
categories = ["visualization", "data-structures"]

[dependencies]
serde = { version = "1.0.219", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0.140"
