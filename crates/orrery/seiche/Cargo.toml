[package]
name = "seiche"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "rapier-backed body/field simulation for Mere — bodies bound to graph nodes, themable forces, plug-in field types."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# rapier2d is the dynamics + collision substrate. Mere's spatial
# behavior (node exclusion, edge springs, themable moot fields) all
# resolve through this simulation, so the dep lands as a foundational
# layer alongside vello and petgraph rather than a feature bolt-on.
rapier2d = "0.33"
kernel.workspace = true
# Field algebra: seiche's CouplingForce evaluates quint fields (closed-form +
# finite-difference gradients) to drive rapier bodies. One-way dep — quint is
# the portable field source, seiche the integrator. (quint default features only;
# no rhai/burn pulled into the simulator.)
quint.workspace = true
euclid = "0.22"
tracing = "0.1"

[features]
# Benchmark-only: pulls quint's wgpu N-body pass so the ignored settle bench can
# inject it as a `RepulsionSolver`. Off by default; the shipped seiche lib never
# compiles burn (it stays the burn-free integrator). (burn brief Lane 5 — P3.)
gpu-bench = ["quint/field-burn-wgpu"]

[dev-dependencies]
kernel = { workspace = true, features = ["fixtures"] }
uuid = "1"
