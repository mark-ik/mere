[package]
name = "quint"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Field algebra for Mere's graph canvas — scalar/vector fields over canvas space, node/edge couplings, and evaluation (Rhai authoring, Burn lowering). The field source whose forces `seiche` integrates."

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# The field-primitive definitions (the portable AST, FieldId/CouplingId, Field,
# Coupling/CouplingResponse/NodeSelector) live in the portable `numen` crate; quint is
# the runtime algebra over them: it evaluates the definitions and derives forces. This
# is quint's only hard substrate dependency — quint's default build is portable.
numen = { path = "../../../../numen" }
# kernel is OPTIONAL, behind `kernel-bridge`: it supplies only the mere Graph +
# apply-delta glue that `FieldProjection::commit_to_graph` uses to write an authored
# projection into a live graph. Off by default so quint stays kernel-free (portable);
# a mere host that wants the commit bridge enables the feature. One-way dep.
kernel = { workspace = true, optional = true }
# For minting registry-local FieldIds (from_u128, WASM-safe) and serde of the
# UUID-backed kernel FieldId embedded in FieldRegistry.
uuid = { version = "1", default-features = false, features = ["serde"] }
# Burn-backed lowering of the field algebra (AST -> a fused tensor program).
# ndarray backend for portable per-target compute; generic over `B: Backend`.
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }
# Rhai composition surface for fields, couplings, and edge-path rules.
rhai = { version = "1.20", default-features = false, features = ["std"], optional = true }

# The burn tree reaches getrandom on wasm; 0.4 needs its wasm_js backend
# feature enabled by someone in the graph (compile_error! otherwise). Same
# story for uuid's rng (its own getrandom wiring is disabled on
# wasm-unknown, so the wasm-bindgen `js` path is the supported source).
# These declarations exist only to switch those features on for wasm builds.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
uuid = { version = "1", default-features = false, features = ["js"] }

[features]
default = []
# The graph-commit bridge: `FieldProjection::commit_to_graph`, which writes an authored
# projection's fields/couplings into a mere `kernel::graph::Graph`. Opt-in so quint's
# default build stays kernel-free and portable; a mere host enables it.
kernel-bridge = ["dep:kernel"]
field-burn = ["dep:burn"]
# Adds the wgpu backend so consumers can target GPU evaluation.
field-burn-wgpu = ["field-burn", "burn/wgpu", "dep:getrandom"]
field-rhai = ["dep:rhai"]

[dev-dependencies]
serde_json = "1.0"
