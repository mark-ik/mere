[package]
name = "misfin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Misfin (gemini-style mail) for Mere: vault-derived self-signed mailbox identity, gemmail parsing, and a TLS receive server (the `server` feature). Sending is errand's transport."

[features]
# Expose test-only helpers (send_for_tests, in-memory server scopes) to
# downstream crates for integration testing.
test-support = []
# The misfin receive server: an async TLS listener that accepts mail into a
# redb-backed mailbox. Opt-in so the lightweight identity/types/gemmail path
# (e.g. minting a cert to send via errand) does not pull tokio + redb.
server = ["dep:tokio", "dep:tokio-rustls", "dep:redb"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["logging", "std", "tls12", "aws-lc-rs"] }
rcgen = "0.13"
sha2 = "0.10"
url = "2.5"
dirs = "6"
log = "0.4"
tokio = { version = "1", features = ["io-util", "net", "rt", "macros", "time"], optional = true }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"], optional = true }
redb = { version = "2", optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time", "sync"] }

[lib]
path = "src/lib.rs"
