[package]
name = "mere-transport"
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Peer transport layer for the Mere browser — iroh-based authenticated encrypted QUIC streams between known peers."
documentation = "https://docs.rs/transport"
keywords = ["transport", "iroh", "p2p", "quic", "browser"]
categories = ["network-programming"]

[features]
# Optional Reticulum transport backend for off-grid / mesh links. Disabled by
# default; enable to build and test `ReticulumTransport`. Backed by `retinue`,
# Mark's own RNS implementation; `hkdf`/`sha2` derive the retinue identity.
reticulum = ["dep:retinue", "dep:hkdf", "dep:sha2"]

[lib]
name = "transport"
path = "src/lib.rs"

[dependencies]
# Path + version: path is used during local workspace builds; version is
# required for `cargo publish` to record the crates.io dependency.
identity.workspace = true
murm-replication = { workspace = true }
# `time` paces `endpoint_addr`'s brief wait for iroh's interface discovery.
tokio = { version = "1", features = ["io-util", "sync", "rt", "macros", "time"] }
thiserror = "1"
tracing = "0.1"
# iroh 0.98 wraps quinn QUIC; ed25519-dalek =3.0.0-pre.6 internally.
# We cross the dalek-version boundary via raw 32-byte seeds so identity
# (on dalek 2.x) does not need to track iroh's pre-release dalek dep.
iroh = "0.98"
iroh-blobs = "0.100"
# Shareable connection tickets: serialize this node's `EndpointAddr` to a string
# a peer can paste to dial it (the explicit-bootstrap path, e.g. a host's
# "connect to peer" verb), and parse it back. Pairs with `add_peer` / `set_topics`.
iroh-tickets = "0.5"
bytes = "1"
# p2panda-net is the production endpoint authority (P2pandaTransport); it
# pins iroh 0.98, unifying with the iroh/iroh-blobs deps above.
p2panda-net = "0.6.1"
p2panda-core = "0.6.1"
# Reticulum mesh-networking backend (optional, see [features]). `retinue` is
# Mark's from-scratch RNS stack; `hkdf`/`sha2` derive its identity from the seed.
retinue = { workspace = true, optional = true }
hkdf = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "sync", "macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
