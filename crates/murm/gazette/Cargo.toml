[package]
name = "gazette"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gazette: Mere's handle-resolution layer — turns a name / handle / key into reachable, trust-stated endpoints. Today implements WebFinger (RFC 7033, acct: handle -> JRD -> typed gemini / gopher / misfin / ActivityPub / profile endpoints); NIP-05, atproto-did, and the moot web-of-trust directory land here."

[features]
# Expose test-only helpers (resolver fetch overrides) to downstream crates
# for integration testing.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"

[lib]
path = "src/lib.rs"
