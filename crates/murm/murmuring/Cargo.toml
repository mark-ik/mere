[package]
name = "murmuring"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol core for bilateral chat-protocol selection — inner layer of murm for the Mere browser."
documentation = "https://docs.rs/murmuring"
readme = "README.md"
keywords = ["protocol", "p2p", "messaging", "chat"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Path + version: path for local workspace builds; version for `cargo publish`.
identity.workspace = true
# Mere hashes with BLAKE3 throughout. Post ids and cabal ids are plain
# BLAKE3-256 (no Cable-spec salt/personalization — no cabal.club wire interop).
blake3 = "1.5"
# A cabal post IS a p2panda-core Operation on the wire (signed Header<CabalExt>
# + body): BLAKE3, CBOR, Ed25519 — the same event type the rest of the
# substrate syncs. This is the §12 "Cable on our stack" promotion; the literal
# Cable varint wire is retired.
p2panda-core = "0.6.1"
# Storage-agnostic sync traits (`LogStore` + `TopicStore`) that p2panda-net's
# LogSync requires. We implement them over our redb post store (see
# `cable::log_store`), keeping the offline-catch-up lane pure-Rust. Traits only:
# `logs`/`topics` are always available; we skip the SQLite backend and the
# `macros` (OperationStore) feature — received ops persist via the normal
# Post → ingest → insert path, not OperationStore.
p2panda-store = { version = "0.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
# Persistent cabal store. We store posts as their canonical wire bytes
# (no separate serde format), so redb is sufficient — no rkyv needed at
# this layer.
redb = "2"
thiserror = "1"

[dev-dependencies]
tempfile = "3"
# The p2panda `LogStore`/`TopicStore` impls are async (trait requirement), so
# their tests need a runtime. murmuring is otherwise sync; this is test-only.
tokio = { version = "1", features = ["rt", "macros"] }
