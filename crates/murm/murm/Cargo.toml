[package]
name = "murm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bilateral peer-to-peer comms supercrate for the Mere browser — one-to-one messaging across protocols."
documentation = "https://docs.rs/murm"
readme = "README.md"
keywords = ["p2p", "messaging", "bilateral", "comms", "browser"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Path + version: path for local workspace builds; version for `cargo publish`.
identity.workspace = true
transport.workspace = true
murmuring.workspace = true
blake3 = "1.5"
# LogSync (offline catch-up) is assembled here over a cabal's redb store: the
# protocol (`p2panda-net`), its sync-event types (`p2panda-sync`), and `Topic`
# (`p2panda-core`). The store traits live in murmuring; murm only drives the
# session and drains received operations into the engine.
p2panda-net = "0.6.1"
p2panda-sync = "0.6.1"
p2panda-core = "0.6.1"
# `rt` for the sync tasks (`tokio::spawn`); `time` bounds the manual `resync`
# round; `sync` for the cabal `subscribe` broadcast receiver; `tokio-stream` for
# the gossip + LogSync subscription streams.
tokio = { version = "1", features = ["io-util", "rt", "time", "sync"] }
tokio-stream = "0.1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
