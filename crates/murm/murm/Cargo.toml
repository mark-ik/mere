[package]
name = "murm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Bilateral peer-to-peer comms supercrate for the Mere browser — one-to-one messaging across protocols."
documentation = "https://docs.rs/murm"
readme = "README.md"
keywords = ["p2p", "messaging", "bilateral", "comms", "browser"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Path + version: path for local workspace builds; version for `cargo publish`.
identity.workspace = true
transport.workspace = true
murmuring.workspace = true
tokio = { version = "1", features = ["io-util"] }
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread"] }
