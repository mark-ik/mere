description = "Chirograph: the projection contract, executed in duplicate. Versioned, carrier-neutral messages by which an endpoint offers a scene, a resource, or an action, and a host asks for one -- named for the medieval deed written twice on a sheet and cut through the writing, so the two halves prove each other by matching."

