[package]
name = "network-policy"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Owner-controlled session admission for Mere services: local policy, personae chain evaluation, and a revocation ledger."
keywords = ["policy", "capability", "delegation", "local-first"]
categories = ["network-programming", "authentication"]

[lib]
name = "network_policy"
path = "src/lib.rs"

[dependencies]
personae = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
