[package]
name = "mere-document-lanes"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository = "https://github.com/merely-made/mere"
description = "Mere's document content lanes above Genet: the reader and smolweb sessions over the portable document canvas, and the remote resource fetcher over netfetcher and errand. Mere's half of the former genet-documents; landed in mere 2026-09-03 by the platform boundary plan."
publish = true

[lib]
path = "src/lib.rs"

[features]
default = []
# Remote http(s) loading for RemoteFetcher via the netfetcher engine.
netfetch = ["dep:netfetcher", "dep:tokio", "dep:bytes"]
# The smolweb engine-native lane: errand transport and Nematic EngineDocument
# lowering; the reader lane is unconditional.
smolweb = ["dep:errand", "dep:nematic", "dep:tokio"]
# Preserve Fleece-derived reading evidence through Eidetic without making the
# document lane's ordinary reader/session consumers take a storage dependency.
eidetic-bridge = ["fleece/wire", "dep:eidetic", "dep:serde", "dep:serde_json"]
# Project Fleece-preserved JSON-LD blocks through Mere's RDF authority.
fleece-json-ld = ["dep:linked-data"]

[dependencies]
document-session-api = { workspace = true }
inker = { workspace = true }
genet-host-api = { workspace = true }
# Formerly relative paths into genet's components; now the workspace git pins.
genet-static-dom = { workspace = true }
fleece = { workspace = true }
netrender = { workspace = true }
document-canvas = { workspace = true, features = ["netrender"] }
# The smolweb lane decodes whatever a capsule serves, so this keeps genet's
# full codec set rather than mere's png-only ingest pin.
image = { version = "0.25", default-features = false, features = ["avif", "rayon", "bmp", "gif", "ico", "jpeg", "png", "webp"] }
url = "2.5"
nematic = { workspace = true, optional = true }
errand = { workspace = true, optional = true }
netfetcher = { workspace = true, optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "time"], optional = true }
bytes = { version = "1", optional = true }
eidetic = { workspace = true, optional = true }
linked-data = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"], optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
# Offline mock HTTP server for the netfetch integration tests; runs without a
# live network.
mockito = "1"
wgpu = { workspace = true }
eidetic-fjall = { workspace = true }
pollster = "0.4"
tempfile = "3"
oxjsonld = "0.2"
oxrdf = "0.3"
