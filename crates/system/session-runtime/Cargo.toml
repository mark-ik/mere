[package]
name = "session-runtime"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MIT OR Apache-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Portable graphshell session runtime state: session manifests, session graph/view sidecars, and worker declarations."

[dependencies]
# The platform data dir, for the family-shared identity root.
dirs = "5"
# The storage seam (2026-07-12): eidetic's Store is muniment::Backend.
muniment = { path = "../../eidetic/muniment", version = "0.1.0" }
incipit.workspace = true
kernel.workspace = true
forme.workspace = true
identity.workspace = true
notochord.workspace = true
blake3 = "1.5"
p2panda-core = "0.7.0"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
# The blob Store trait the content cache persists through (wasm-clean; the host
# supplies the concrete fjall / OPFS backend).
eidetic.workspace = true
# The facet store: the runtime tier of the one-node facet system (typed per-node
# metadata). session-runtime persists a `FacetStore<Uuid>` beside the session
# graph — the durable home the per-node sidecars (browser/denizen) converge onto.
chartulary = { path = "../../eidetic/chartulary" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
kernel = { workspace = true, features = ["fixtures"] }
# Tests construct sample graphs that need positions; kernel
# exposes the petgraph-backed API expecting `euclid::Point2D`.
euclid = "0.22"
# content_store tests implement an in-memory Store (async-trait) and drive the
# async calls to completion (pollster), mirroring eidetic's own tests.
async-trait = "0.1"
pollster = "0.4"
# The real fjall-backed Store, for the graph-engram persistence test that proves
# an engram survives a store close + reopen (the "survives restart" condition).
eidetic-fjall.workspace = true
hex = "0.4"
