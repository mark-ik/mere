[package]
name = "mere-proofs"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Typed digests, commitments, blob references, and proof envelopes for Mere domains."
documentation = "https://docs.rs/mere-proofs"
keywords = ["proofs", "digest", "commitment", "local-first"]
categories = ["data-structures", "cryptography"]

[lib]
name = "proofs"
path = "src/lib.rs"

[dependencies]
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
