[package]
name = "mere-fetch"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = true
description = "Host-neutral fetch actor and session-cookie runtime for Mere."

[lib]
name = "fetch"
path = "src/lib.rs"

[dependencies]
armillary.workspace = true
eidetic.workspace = true
errand = { workspace = true }
netfetcher = { workspace = true }
pollster = "0.4"
rustls-pki-types = "1"
serde = { workspace = true }
serde_json = { workspace = true }
pandect.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync"] }
tracing.workspace = true
url = "2"
verso-tile = { workspace = true }
zeroize = "1"

[lints]
workspace = true
