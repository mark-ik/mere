[package]
name = "gazetteer"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Gazetteer: Mere's handle-resolution index — resolves a name / handle / key to reachable, trust-stated endpoints. Incubating: WebFinger (RFC 7033) only today (acct: handle -> JRD -> typed gemini / gopher / misfin / ActivityPub / profile endpoints); NIP-05, atproto-did, and the moot web-of-trust directory land here. Blocking reqwest still needs an async port before a real consumer wires it."

[features]
# Expose test-only helpers (resolver fetch overrides) to downstream crates
# for integration testing.
test-support = []

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2.5"

[lib]
path = "src/lib.rs"
