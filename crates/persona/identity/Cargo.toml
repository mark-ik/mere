[package]
name = "mere-identity"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Identity management for the Mere browser — master Ed25519 keypair, OS-keychain integration, per-protocol identity derivation."
documentation = "https://docs.rs/mere-identity"
readme = "README.md"
keywords = ["identity", "ed25519", "keychain", "browser", "p2p"]
categories = ["cryptography", "authentication"]

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
blake2 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
tracing = "0.1"
# Passphrase-encrypted storage backend.
argon2 = "0.5"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { workspace = true }

[dev-dependencies]
hex = "0.4"
tempfile = "3"
