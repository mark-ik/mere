[package]
name = "codicil"
version = "0.1.1"
edition = "2024"
license.workspace = true
description = "An append-only, replayable log: immutable ordered entries you append and replay to rebuild state, persisted through muniment. The event-source and nondestructive-history primitive. Sibling to muniment (the store)."
repository = "https://github.com/merely-made/mere"
keywords = ["append-only", "log", "event-sourcing", "history", "persistence"]
categories = ["data-structures"]

[dependencies]
# The store codicil persists through. Local development redirects this source
# through the ignored `.cargo/config.toml` patch, matching its consumers.
muniment = { path = "../muniment", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = { workspace = true }
# Matches muniment's codec, so the positional-encoding test exercises the
# format a consumer would actually persist with.
postcard = { version = "1", features = ["alloc"] }
pollster = "0.4"
