[package]
name = "mere-eidetic-fjall"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fjall LSM Store implementation for eidetic — production-default native backend persisting blobs and manifests under a single keyspace partition."
readme = "README.md"
keywords = ["eidetic", "fjall", "lsm", "storage", "mere"]
categories = ["database-implementations"]

[lib]
name = "eidetic_fjall"
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
eidetic.workspace = true
# The seam this crate now implements (2026-07-12): FjallStore is a muniment
# backend, so it serves every family consumer, not just eidetic.
muniment = { git = "https://github.com/mark-ik/eidetic.git", branch = "main", version = "0.1.0" }
fjall = "2"

[dev-dependencies]
pollster = "0.4"
serde_json = "1.0"
tempfile = "3"
