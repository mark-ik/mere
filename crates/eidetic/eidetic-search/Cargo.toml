[package]
name = "mere-eidetic-search"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Lexical search over eidetic browsing memory — the Phase 9 producer half: a tantivy index minted from BrowsingTrace engrams, BM25 recall, fast-field reports, and the engine-agnostic hybrid-fusion seam."

[lib]
name = "eidetic_search"
path = "src/lib.rs"

[dependencies]
eidetic = { workspace = true }
# The lexical engine (MIT). Stays out of eidetic-core deliberately — the
# index is derived state minted from trace engrams, not part of the memory
# substrate. Default features include the mmap directory the native produce
# path uses; the wasm/OPFS question is Phase 7 + the probe, not this crate.
tantivy = "0.26"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
# The example's store is a muniment backend (2026-07-12).
muniment = { path = "../muniment", version = "0.1.0" }
pollster = "0.4"
tempfile = "3"
# The eidetic-recall example (the browsing-derivation rehearsal bin, moved
# here so one bin carries ingest → index → recall → report): import supplies
# the bookmark parser + history interchange types; fjall the on-disk store;
# embed (BERT over burn, `--backend cpu|wgpu` at runtime) the vector half of
# fused recall. No direct burn dependency: the example constructs through
# `embed::bert::load_cpu` / `load_wgpu`, which return the provider seam (Burn
# 0.22 plan, B1). It used to name `burn::backend::Wgpu` while depending on burn
# with only the ndarray feature — compiling solely because `embed/bert-wgpu`
# unified `burn/wgpu` in. That is exactly the accidental fan-out this removes.
import = { workspace = true }
eidetic-fjall = { workspace = true }
embed = { workspace = true, features = ["bert", "bert-wgpu"] }

# `test = true` runs the example's embedded mapper tests under `cargo test`.
[[example]]
name = "eidetic-recall"
test = true
