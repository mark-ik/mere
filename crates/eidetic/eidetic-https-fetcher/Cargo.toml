[package]
name = "eidetic-https-fetcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "HTTPS BlobFetcher companion crate for eidetic — fetches BlobSource::Https URLs via ureq for use with eidetic::resolve_blob."
readme = "README.md"
keywords = ["eidetic", "fetcher", "https", "mere"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
eidetic.workspace = true
ureq = { version = "2.10", default-features = false, features = ["tls"] }

[dev-dependencies]
mockito = "1.4"
pollster = "0.4"
