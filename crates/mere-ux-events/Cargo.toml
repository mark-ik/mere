[package]
name = "mere-ux-events"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable chrome-event taxonomy for the Mere browser — UxEvent + UxObserver + UxProbe + diagnostics-channel bridge + command-surface telemetry. The third pillar between code-level tracing and registry-level register-diagnostics."
documentation = "https://docs.rs/mere-ux-events"
readme = "README.md"
keywords = ["ux", "events", "observability", "probes", "mere"]
categories = ["development-tools::debugging"]

[lib]
path = "src/lib.rs"

[dependencies]
mere-graphshell = { path = "../mere-domain/graphshell" }
mere-kernel = { path = "../mere-kernel" }
serde = { version = "1.0", features = ["derive"] }
