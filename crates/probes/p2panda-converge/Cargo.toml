# Standalone spike probe (own [workspace]). Probe 1: do concurrent multi-author
# MereEvents (carried in operation bodies, with `parents` refs) converge between
# two nodes via p2panda's LogSync, and what does the per-author-log model
# guarantee about cross-author causal refs?
#
# Uses p2panda-net's `test_utils::TestNode` (deterministic loopback via seeded
# address book + explicit initiate_session). This exercises the same LogSync
# substrate the umbrella `p2panda::Node` wraps (node.rs: stream -> log_sync.stream).
[package]
name = "probe-p2panda-converge"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe-p2panda-converge"
path = "src/main.rs"

[dependencies]
p2panda-net = { version = "0.6.1", features = ["test_utils"] }
p2panda-core = "0.6.1"
p2panda-sync = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"

[workspace]
