# Meadowcap-shaped capability over GRAPH-CLUSTER paths. Demonstrates the
# spatial-namespace benefit (share a coherent sub-graph neighborhood via
# path-prefix scoping + monotonic delegation) that p2panda's flat topics cannot
# express. "Owning a willow-esque interpretation" per Mark.
[package]
name = "probe-willow-cluster-cap"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe-willow-cluster-cap"
path = "src/main.rs"

[dependencies]
ed25519-dalek = "2"

[workspace]
