# Standalone spike probe (own [workspace]). Targets the §"take the encryption
# engine, not the bundle" decision in
# design_docs/mere_docs/implementation_strategy/2026-06-01_p2panda_substrate_spike_plan.md
#
# Pressure-tests p2panda-encryption's `traits` seam (NOT the git-only
# p2panda-spaces bundle): feed a murm/cabal-shaped operation as the authored +
# ordered message, supply a member set from a stub cluster-path capability, and
# drive one data-scheme and one message-scheme round trip behind a Mere-side
# trait. The published engine (crates.io 0.6.1) is enough; authorization is
# pluggable, so tessera + our caps would slot in above this.
[package]
name = "probe-p2panda-encryption-fit"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe-p2panda-encryption-fit"
path = "src/main.rs"

[dependencies]
# The schemes are feature-gated. Authorization (DGM / GroupMembership) and
# ordering are pluggable traits we implement Mere-side, so no `test_utils`.
p2panda-encryption = { version = "0.6.1", features = ["data_scheme", "message_scheme"] }
p2panda-core = "0.6.1"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }

[workspace]
