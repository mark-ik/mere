# Standalone spike probe (own [workspace]). The first build slice: a
# `P2pandaTransport: transport::Transport` adapter over `p2panda-net::Endpoint`,
# validated by running the REAL `murm` Cable snapshot sync over it. Path-deps to
# the live transport/murm/identity crates so this exercises the actual Transport
# trait + actual Cable code, with NO live-crate dependency swap (reversible).
[package]
name = "probe-p2panda-transport-adapter"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe-p2panda-transport-adapter"
path = "src/main.rs"

[dependencies]
transport = { path = "../../murm/transport" }
murm = { path = "../../murm/murm" }
identity = { path = "../../persona/identity" }
p2panda-net = "0.6.1"
p2panda-core = "0.6.1"
iroh = "0.98"
tokio = { version = "1", features = ["full"] }

[workspace]
