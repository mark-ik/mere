[package]
name = "probe-markdown-v0"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Thin-slice probe: render an inker EngineDocument through Glass-HQ/gpui."

[[bin]]
name = "probe-markdown-v0"
path = "src/main.rs"

[dependencies]
gpui = { path = "../../../../glass-gpui/crates/gpui" }
gpui_platform = { path = "../../../../glass-gpui/crates/gpui_platform", features = ["font-kit"] }
inker = { path = "../../workbench/inker" }
nematic = { path = "../../workbench/inker/engines/nematic" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
