# Standalone spike probe (own [workspace] so it does not join the main mere
# workspace nor the sibling probes workspace). S2 of the p2panda substrate
# spike: does p2panda-core's per-author log carry a MereEvent?
[package]
name = "probe-p2panda-fit"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe-p2panda-fit"
path = "src/main.rs"

[dependencies]
p2panda-core = "0.6.1"
serde = { version = "1", features = ["derive"] }

[workspace]
