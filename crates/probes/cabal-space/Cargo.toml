# Standalone spike probe (own [workspace]). Thread 2: model a cabal as a
# BLAKE3 signed-event SPACE on our stack — p2panda-core Operations under the
# Cable shared-secret trust model. Realizes the §12 decision ("a cabal is a
# shared-secret-keyed BLAKE3 space"), the first slice of moving the bilateral
# lane off the literal Cable wire.
[package]
name = "probe-cabal-space"
version = "0.0.0"
edition = "2021"
publish = false

[[bin]]
name = "probe-cabal-space"
path = "src/main.rs"

[dependencies]
p2panda-core = "0.6.1"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }

[workspace]
