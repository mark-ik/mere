# DocumentScript component host (P2): the native side of the document-core WIT
# world — owns a Wasmtime engine + per-instance Store, backs the inspect/apply/log
# imports over genet's live ScriptedDom, drives per-turn handle-event, and
# enforces epoch / StoreLimits quotas.
#
# A member of the mere workspace (folded in at P2.5). wasmtime 45 sets this crate's
# rustc floor at 1.93; the workspace channel is in mere/rust-toolchain.toml and sits
# above it.
[package]
name = "document-host"
version = "0.0.1"
edition = "2021"
rust-version = "1.93.0"
license = "MIT OR Apache-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
servitor = { workspace = true }
# wasmtime 45 (default features: component-model + async always-on). Async exports
# are invoked via call_async on a fiber so a future sync `fetch` import can suspend
# a turn without blocking (plan §11.7-7).
wasmtime = "45"
wasmtime-wasi = "45"
# genet's live scripted DOM, via the same git dep meerkat uses (so they unify on
# one rev). genet-scripted-dom is light — markup5ever + layout-dom-api +
# genet-static-dom; no stylo/taffy, so the workspace patches do not touch it.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", git = "https://github.com/merely-made/genet.git", branch = "main" }
# The mod-loader DI seam (P2.4): we *implement* its `WasmModRuntime` trait, never
# edit it (that crate stays runtime-free). Intra-workspace path dep, matching the
# sibling register-* crates' own cross-references.
register-mod-loader = { path = "../../system/registry/register-mod-loader" }
# Drives the async `document-core` exports from the sync `WasmModRuntime` trait —
# a minimal block_on with no global runtime, so the lib stays executor-neutral.
pollster = "0.4"

[dev-dependencies]
# Drives the async export calls in the tests; the lib stays executor-neutral.
tokio = { version = "1", features = ["rt", "macros"] }
