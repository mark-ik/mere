# DocumentScript component host (P2): the native side of the document-core WIT
# world — owns a Wasmtime engine + per-instance Store, backs the inspect/apply/log
# imports over serval's live ScriptedDom, drives per-turn handle-event, and
# enforces epoch / StoreLimits quotas.
#
# A member of the mere workspace (folded in at P2.5). The workspace pins rustc 1.93
# (mere/rust-toolchain.toml) because wasmtime 45 requires it.
[package]
name = "document-host"
version = "0.0.1"
edition = "2021"
rust-version = "1.93.0"
license = "MPL-2.0"
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
# wasmtime 45 (default features: component-model + async always-on). Async exports
# are invoked via call_async on a fiber so a future sync `fetch` import can suspend
# a turn without blocking (plan §11.7-7).
wasmtime = "45"
wasmtime-wasi = "45"
# serval's live scripted DOM, via the same git dep meerkat uses (so they unify on
# one rev). serval-scripted-dom is light — markup5ever + layout-dom-api +
# serval-static-dom; no stylo/taffy, so the workspace patches do not touch it.
serval-scripted-dom = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", git = "https://github.com/mark-ik/serval.git", branch = "main" }

[dev-dependencies]
# Drives the async export calls in the tests; the lib stays executor-neutral.
tokio = { version = "1", features = ["rt", "macros"] }
