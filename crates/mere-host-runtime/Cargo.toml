[package]
name = "mere-host-runtime"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Portable runtime state + types Mere hosts attach to. Per the multiplexer framing (design_docs/mere_docs/research/2026-05-11_browser_multiplexer_framing.md): hosts are attach clients; this crate owns the session manifest, tile data model, action bus types, and tear-out payloads — everything that compiles wasm32-clean without a UI framework. Sibling to mere-host-contract (which owns the port traits the host satisfies)."

[dependencies]
mere-frame = { path = "../mere-domain/frame" }
mere-kernel = { path = "../mere-kernel" }
inker = { path = "../inker" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# Tests construct sample graphs that need positions; mere-kernel
# exposes the petgraph-backed API expecting `euclid::Point2D`.
euclid = "0.22"
