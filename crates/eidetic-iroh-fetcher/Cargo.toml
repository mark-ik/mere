[package]
name = "eidetic-iroh-fetcher"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Iroh BlobFetcher companion crate for eidetic — fetches BlobSource::Iroh tickets via mere-transport's iroh-blobs integration."
readme = "README.md"
keywords = ["eidetic", "fetcher", "iroh", "p2p", "mere"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
eidetic = { path = "../eidetic" }
mere-transport = { path = "../mere/mere-transport" }

[dev-dependencies]
bytes = "1"
mere-identity = { path = "../mere/mere-identity" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
