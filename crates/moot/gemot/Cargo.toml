[package]
name = "gemot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Community domain and assembly layer for Moot lifecycle, governance, replication, and Tessera."
documentation = "https://docs.rs/gemot"
readme = "README.md"
keywords = ["federation", "community", "social", "p2p", "browser"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Tessera events are wire-ready (they become signed operation extensions on the
# event-DAG, like Murm's `CabalExt`). serde sets the event types up for that
# wire bridge; p2panda-core is the operation/signing substrate the bridge rides
# (same as murm posts); identity supplies the Ed25519 signing keypair.
serde = { version = "1", features = ["derive"] }
p2panda-core = "0.7.0"
p2panda-auth = { version = "0.7.0", default-features = false }
p2panda-encryption = { version = "0.7.0", default-features = false, features = ["data_scheme"] }
identity.workspace = true
# The typed capability vocabulary (capability-model OQ3, ruled 2026-07-24):
# the moot authorization seam parses request paths as servitor Caps and
# answers them from delegation certificates through the same power/scope
# encoding the denizen tier writes — one capability question, two tiers.
servitor.workspace = true
murm-replication = { workspace = true }
proofs.workspace = true
# The sync traits implemented by the shared muniment adapter. `macros` and
# p2panda-store's own SQLite backend stay off.
p2panda-store = { version = "0.7.0", default-features = false }
# Recognition policy remains in mooting. The generic store moved to
# murm-replication.
mooting = { workspace = true }
muniment = { workspace = true, features = ["redb"] }
redb = "2"
thiserror = "1"
# Sync is host-composed after the sibling-posture purity split: gemot owns no
# p2panda-net. It provides the stores + folds + `verify`; the host builds the
# `LogSync` + `murm-replication::SyncedSpace` pump and publishes authored ops. So
# p2panda-net / p2panda-sync / tokio-stream / tokio are dev-only (the in-crate
# two-peer convergence tests + the `moot-peer` example play the host).

[dev-dependencies]
# The peer-petition receipt drives a REAL servitor::Gate over a chartulary
# graph, proving one gate serves scripts, components, and moot peers alike.
# Test-only: MootAuthority itself needs no graph substrate.
chartulary.workspace = true
# The two-peer convergence tests + the `moot-peer` example play the host: they
# build the real p2panda-net peers and the `LogSync` + `SyncedSpace` pump.
# `transport` supplies `P2pandaTransport` / `sync_overlay_topic`;
# `murm-replication` supplies `SyncedSpace` and the shared store;
# `p2panda-net` is the protocol, `p2panda-sync` its event types, `tokio-stream`
# reads the subscription; `macros` + `rt-multi-thread` run the async tests;
# tempfile backs the persistent-store reopen test.
transport.workspace = true
p2panda-net = "0.7.0"
p2panda-sync = "0.7.0"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tokio-stream = "0.1"
tempfile = "3"
