# The technical Commons profile: graph, encrypted chat, governed retained
# facts, and the reusable sans-I/O call grammar. This was M3's consumer-pull
# receipt; Turnstone is now its intended place consumer, so it belongs in the
# Mere workspace without becoming a product or UI crate.
[package]
name = "commons-spine"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
chartulary = { path = "../../eidetic/chartulary" }
codicil = { path = "../../eidetic/codicil" }
muniment = { path = "../../eidetic/muniment", features = ["redb"] }
personae = { path = "../../persona/personae" }
proofs = { package = "mere-proofs", path = "../../system/proofs" }
servitor = { path = "../../servitor" }
stickleback = { path = "../../stickleback" }
gemot = { workspace = true }
p2panda-core = "0.7.0"
p2panda-encryption = { version = "0.7.0", features = ["data_scheme", "message_scheme"] }
p2panda-net = "0.7.0"
p2panda-store = { version = "0.7.0", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
hex = "0.4"
murm = { path = "../../murm/murm" }
transport = { package = "mere-transport", path = "../../murm/transport", features = ["reticulum"] }
proptest = "1"
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }

[lib]
path = "src/lib.rs"
