[package]
name = "moothold"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Community and federation supercrate for the Mere browser — moots, coalitions, social primitives across protocols."
documentation = "https://docs.rs/moothold"
readme = "README.md"
keywords = ["federation", "community", "social", "p2p", "browser"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Tessera events are wire-ready (they become signed operation extensions on the
# event-DAG, like murmuring's `CabalExt`). serde sets the event types up for that
# wire bridge; p2panda-core is the operation/signing substrate the bridge rides
# (same as murm posts); identity supplies the Ed25519 signing keypair.
serde = { version = "1", features = ["derive"] }
p2panda-core = "0.6.1"
identity.workspace = true
# The tessera store. A moot's tessera log is the synced operation log; the store
# persists `Operation<TesseraExt>` and exposes the two traits p2panda-net's
# LogSync reconciles — `LogStore` (per-author append-only logs) + `TopicStore`
# (which logs a moot holds) — over redb, exactly as murmuring's
# `PersistentCabalStore`. The `sqlite` feature backs the *moot object* lane's
# `MootStore` (the mesh-proven path: p2panda's own SQLite impls of all three
# store traits); `macros` (OperationStore derive) stays off.
p2panda-store = { version = "0.6.1", default-features = false, features = ["sqlite"] }
redb = "2"
thiserror = "1"
# The tessera sync lane (`tessera::sync`): a LogSync session over the store,
# mirroring murm's `gossip_sync`. `p2panda-net` is the protocol (the `Endpoint` /
# `Gossip` it drives come from the host's transport via `sync_parts`, so this
# stays decoupled from the `transport` crate), `p2panda-sync` its event types;
# `rt` runs the drain task, `time` bounds the manual `resync` checkpoint,
# `tokio-stream` reads the subscription.
p2panda-net = "0.6.1"
p2panda-sync = "0.6.1"
tokio = { version = "1", features = ["rt", "time"] }
tokio-stream = "0.1"

[dev-dependencies]
# `transport` (dev-only) builds the two real p2panda-net peers for the
# convergence test + supplies `sync_overlay_topic` for their explicit bootstrap;
# the library itself takes raw `Endpoint`/`Gossip`, not a `P2pandaTransport`.
# `macros` + `rt-multi-thread` run the async / two-peer tests; tempfile backs the
# persistent-store reopen test.
transport.workspace = true
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time"] }
tempfile = "3"
