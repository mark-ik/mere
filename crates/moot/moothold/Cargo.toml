[package]
name = "moothold"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Tier 3 federation of Gemot moots: concord and reciprocal resource sharing."
documentation = "https://docs.rs/moothold"
readme = "README.md"
keywords = ["federation", "community", "reputation", "p2p"]
categories = ["network-programming"]

[dependencies]
gemot.workspace = true
muniment = { version = "0.1.0", features = ["redb"] }
murm-replication.workspace = true
p2panda-core = "0.6.1"
p2panda-store = { version = "0.6.1", default-features = false }
serde = { version = "1", features = ["derive"] }
thiserror = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
