[package]
name = "mooting"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Protocol core for community social-primitives selection — inner layer of gemot for the Mere browser."
documentation = "https://docs.rs/mooting"
readme = "README.md"
keywords = ["protocol", "social", "community", "federation"]
categories = ["network-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Recognition fingerprints use p2panda's native BLAKE3 hash and CBOR.
p2panda-core = "0.6.1"
serde = { version = "1", features = ["derive"] }
thiserror = "1"
