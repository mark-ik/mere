[package]
name = "personae"
version = "0.2.1"
edition = "2024"
license.workspace = true
description = "The identity and carry layer for the Merely ecosystem: a master Ed25519 keypair, deterministic per-protocol key derivation (BLAKE3), a passphrase/OS-store-unlocked vault, and sealed-record storage. A person has personae, plural — work, research, burner — so the crate is the register of your faces and their root of trust. Promoted from mere's persona/identity."
repository = "https://github.com/merely-made/mere"
keywords = ["identity", "ed25519", "keychain", "vault", "p2p"]
categories = ["cryptography", "authentication"]

[lib]
path = "src/lib.rs"

# Bins from the 2026-07-22 identity-vault-ssh-agent plan. Both are feature-
# gated so the published lib keeps its lean default dep tree.
#
# V2: serves vault `ssh` slots over the OpenSSH agent protocol (Windows
# named pipe / Unix socket).
[[bin]]
name = "personae-agent"
path = "src/bin/personae-agent.rs"
required-features = ["agent"]

# V3: inspect and manage the vault from a terminal.
[[bin]]
name = "personae-vault"
path = "src/bin/personae-vault/main.rs"
required-features = ["ssh"]

[features]
# SSH keys as vault slots (encode/decode/import). The CLI needs this much;
# the agent needs the protocol stack on top.
ssh = ["dep:ssh-key", "dep:signature", "dep:gethostname"]
agent = ["ssh", "dep:ssh-agent-lib", "dep:tokio", "dep:tracing-subscriber"]

[dependencies]
ed25519-dalek = { version = "3", features = ["zeroize"] }
blake3 = "1.5"
getrandom = "0.3"
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
tracing = "0.1"
# Passphrase-encrypted storage + sealed-record backends.
argon2 = "0.5"
chacha20poly1305 = "0.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
# `agent` feature: SSH agent protocol + OpenSSH key handling. ssh-key is
# ed25519-only here on purpose (the agent's v1 scope); the `signature`
# traits are how ssh-key exposes signing.
ssh-agent-lib = { version = "0.6", optional = true }
ssh-key = { version = "0.6", features = ["ed25519"], optional = true }
# Hostname for the local device id (ssh_ca self-grants). Already in the
# workspace lock via transitive deps; tiny (rustix + windows-link).
gethostname = { version = "1", optional = true }
signature = { version = "2", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
rand_core = { version = "0.6", features = ["getrandom"] } # ssh-key 0.6 test helper (PrivateKey::random)
hex = "0.4"
tempfile = "3"

# OS-store unlock backend (Windows DPAPI today; other platforms follow).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
