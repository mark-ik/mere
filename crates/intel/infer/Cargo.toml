[package]
name = "infer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Inference-provider seam for Mere's statistical-intelligence tier — the InferenceProvider trait, capability descriptors, and a deterministic canned provider for tests; model-backed providers (burn-wgpu first) land behind features, mirroring embed's bert pattern."

[lib]
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# The inference actor (harness §3) rides armillary's thread-actor harness.
# Optional so the seam's core stays thread-free and wasm-clean; hosts that
# spawn the actor enable `actor`.
armillary = { workspace = true, optional = true }
# The own llama-family decoder body (P1) — burn-nn primitives (RmsNorm,
# RotaryEncoding, SwiGlu, autoregressive cache), ndarray baseline, wgpu via
# `decoder-wgpu`, mirroring embed's bert/bert-wgpu split.
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }
serde_json = { version = "1.0", optional = true }
safetensors = { version = "0.4", optional = true }
# BF16/F16 → f32 decode at the safetensors boundary (TinyLlama and most
# HF llama-family checkpoints ship bfloat16).
half = { version = "2", optional = true }

[features]
default = []
actor = ["dep:armillary"]
decoder = ["dep:burn", "dep:serde_json", "dep:safetensors", "dep:half"]
decoder-wgpu = ["decoder", "burn/wgpu"]

[dev-dependencies]
serde_json = "1.0"
