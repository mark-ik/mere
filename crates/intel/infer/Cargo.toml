[package]
name = "infer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Mere's statistical-intelligence glue over the standalone vates inference crate: re-exports the InferenceProvider seam, the burn llama-family decoder, and the armillary streaming actor under the established infer:: paths, keeping only the mere-side eidetic model corridor."

[lib]
path = "src/lib.rs"

[dependencies]
# The seam, decoder, and actor bodies moved to the standalone vates crate
# (boundary pass slice B, 2026-07-09). infer re-exports the surface and keeps
# the mere glue. Git sibling consumed one-way; a local checkout is picked up
# via the gitignored `.cargo/config.toml` patch (mirrors sibylla / netfetcher).
vates = { git = "https://github.com/mark-ik/vates.git", branch = "main" }
# The mere-side corridor test's backend/tensor types (embed's `dep:burn`
# pattern: the model tree lives in vates; these are only what the test
# instantiates). Pulled only by the `decoder` feature.
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }
safetensors = { version = "0.4", optional = true }

[features]
default = []
actor = ["vates/actor"]
decoder = ["vates/decoder", "dep:burn", "dep:safetensors"]
decoder-wgpu = ["decoder", "vates/decoder-wgpu"]

[dev-dependencies]
# Test stores are muniment backends now (2026-07-12).
muniment = { git = "https://github.com/mark-ik/muniment.git", branch = "main", version = "0.1.0" }
serde_json = "1.0"
# The P2 corridor test: model artifacts through eidetic's typed store and
# back into a working provider (embed's bert_full_pipeline pattern).
eidetic = { workspace = true }
pollster = "0.4"
async-trait = "0.1"
