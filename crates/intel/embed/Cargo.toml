[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mere's statistical-intelligence glue over the standalone sibylla retrieval crate: eidetic persistence and the aether field-algebra / canvas-search bridge, re-exporting sibylla's embedding + retrieval core (incl. the Burn-backed BERT provider behind features)."
readme = "README.md"
keywords = ["embeddings", "vector-search", "intelligence", "mere"]
categories = ["data-structures"]

[lib]
path = "src/lib.rs"

[dependencies]
# The promoted embedding + retrieval core (provider / stub / index / search /
# lexical / affinity, and the bert provider behind features), owned by the
# standalone sibylla crate. embed re-exports it and keeps only the mere glue
# (persistence / field_bridge / canvas_search). Git sibling consumed one-way; a
# local checkout is picked up via the gitignored `.cargo/config.toml` patch
# (mirrors netfetcher / errand).
sibylla = { git = "https://github.com/mark-ik/sibylla.git" }
async-trait = "0.1"
eidetic.workspace = true
# The field algebra (FieldProjection / FieldId / eval) the embedding→field
# bridge builds onto — extracted from graph-canvas into its own crate.
aether.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Test-support only: the `bert_full_pipeline` integration test (the mere-side
# eidetic↔BERT loading check) names `burn::backend::NdArray` for the provider's
# backend. The BERT model tree itself lives in sibylla; this is just the backend
# type the test instantiates. Pulled only by the `bert` feature.
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }

[features]
default = []
# The Burn-backed BERT embedding provider, re-exported from sibylla — which now
# owns the burn / tokenizers / safetensors tree (BERT moved there at sibylla's
# founding P2). `dep:burn` is for the mere-side integration test's backend type.
bert = ["sibylla/bert", "dep:burn"]
# GPU execution for the BERT provider (`BertEmbeddingProvider<Wgpu>`).
bert-wgpu = ["bert", "sibylla/bert-wgpu"]

[dev-dependencies]
pollster = "0.4"
serde_json = "1.0"
