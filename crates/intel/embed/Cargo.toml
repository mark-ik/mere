[package]
name = "mere-embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Mere's statistical-intelligence glue over esp::embed: eidetic persistence and the quint field-algebra / canvas-search bridge."
readme = "README.md"
keywords = ["embeddings", "vector-search", "intelligence", "mere"]
categories = ["data-structures"]

[lib]
name = "embed"
path = "src/lib.rs"

[dependencies]
# The portable embedding and retrieval core. This crate keeps only Mere's
# persistence, field, and canvas glue.
esp.workspace = true
eidetic.workspace = true
# The field algebra (FieldProjection / FieldId / eval) the embedding→field
# bridge builds onto — extracted from graph-canvas into its own crate.
quint.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
default = []
# The Burn-backed BERT embedding provider, re-exported from ESP, which owns the
# burn / tokenizers / safetensors tree. No `dep:burn` here: the test and the
# doctest construct through `esp::embed::bert::load_cpu`, so nothing on this
# side ever names a Burn type (Burn 0.22 plan, B1).
bert = ["esp/bert"]
# GPU execution for the BERT provider (`BertEmbeddingProvider<Wgpu>`).
bert-wgpu = ["bert", "esp/bert-wgpu"]

[dev-dependencies]
# Test stores are muniment backends now (2026-07-12).
muniment = { path = "../../eidetic/muniment", version = "0.1.0" }
pollster = "0.4"
serde_json = "1.0"
