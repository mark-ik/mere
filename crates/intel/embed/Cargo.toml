[package]
name = "embed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Embedding-provider trait and vector index for Mere's statistical-intelligence tier — pure-Rust, browser-friendly, with a deterministic hash-based provider for tests and a slot for a future Burn-backed BERT provider."
readme = "README.md"
keywords = ["embeddings", "vector-search", "intelligence", "mere"]
categories = ["data-structures"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }
eidetic.workspace = true
# The field algebra (FieldProjection / FieldId / eval) the embedding→field
# bridge builds onto — extracted from graph-canvas into its own crate.
aether.workspace = true
safetensors = { version = "0.4", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.20", default-features = false, features = ["onig"], optional = true }

# Same wasm getrandom story as aether: the burn tree reaches getrandom on
# wasm and 0.4 needs its wasm_js backend switched on by someone in the graph.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[features]
default = []
# Burn-backed BERT embedding provider (currently scaffold; layer
# implementations and safetensors loading land in a follow-up slice).
# Pulls in burn (ndarray backend) + tokenizers.
bert = ["dep:burn", "dep:tokenizers", "dep:safetensors"]
# GPU execution for the BERT provider: adds burn's wgpu backend so callers
# can instantiate `BertEmbeddingProvider<Wgpu>`. Mirrors aether's
# `field-burn-wgpu` naming. (burn brief Lane 1.)
bert-wgpu = ["bert", "burn/wgpu", "dep:getrandom"]
# Continuous validation against a reference inference engine (candle-
# transformers, ort, etc.). Gates an expensive end-to-end comparison test
# that loads the same model in two frameworks and checks output divergence.
# Currently structural — the reference-engine dep wires in alongside the
# safetensors loader sub-slice. Run with:
#   cargo test --features bert,bert-validation -- --ignored validation
bert-validation = ["bert"]

[dev-dependencies]
pollster = "0.4"
serde_json = "1.0"
