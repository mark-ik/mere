[package]
name = "sibylla"
version = "0.1.2"
edition = "2024"
license.workspace = true
description = "Deprecated compatibility shim for esp::embed; new code should depend on esp."
repository = "https://github.com/merely-made/mere"
readme = "README.md"
keywords = ["embeddings", "vector-search", "deprecated"]
categories = ["science", "data-structures"]

[dependencies]
esp = { path = "../esp", version = "0.1.0", default-features = false }

[features]
default = []
index-burn = ["esp/index-burn"]
index-burn-wgpu = ["index-burn", "esp/index-burn-wgpu"]
bert = ["esp/bert"]
bert-wgpu = ["bert", "esp/bert-wgpu"]
bert-validation = ["bert", "esp/bert-validation"]
