[package]
name = "vates"
version = "0.1.2"
edition = "2024"
license.workspace = true
description = "Deprecated compatibility shim for esp::infer; new code should depend on esp."
repository = "https://github.com/merely-made/mere"
readme = "README.md"
keywords = ["inference", "llm", "deprecated"]
categories = ["science", "api-bindings"]

[dependencies]
esp = { path = "../esp", version = "0.1.0", default-features = false }

[features]
default = []
actor = ["esp/actor"]
decoder = ["esp/decoder"]
decoder-wgpu = ["decoder", "esp/decoder-wgpu"]
