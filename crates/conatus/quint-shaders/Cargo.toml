# The explicit-regime kernels of conatus's resident lane, written in
# Rust and compiled to SPIR-V by rust-gpu.
#
# Separate from `quint` because a rust-gpu crate compiles for the
# SPIR-V target: it is `no_std`, it may not touch serde or uuid or
# burn, and its only dependency is `spirv-std`. `quint` carries the
# compiled artifact and the host-side pipelines; this carries the
# source of truth for what the GPU actually runs.
#
# Built with `cargo gpu build` (see build.ps1); the resulting `.spv`
# is committed into `quint/shaders/`, so a consumer needs neither the
# rust-gpu toolchain nor a build script. That is the renderling fork's
# carriage, adopted here.
[package]
name = "quint-shaders"
version = "0.0.1"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Explicit-regime GPU kernels for quint's resident field lane: repulsion, springs, and integration, in Rust via rust-gpu."
repository = "https://github.com/merely-made/mere"
publish = false

[package.metadata.rust-gpu.build]
output-dir = "../quint/shaders"

[lib]
crate-type = ["dylib", "rlib"]

# spirv-std by git rev, matching the renderling fork exactly. The
# crates.io release pulls a modern `libm` whose 128-bit integer math
# cannot lower to SPIR-V (439 errors), and the rev is what pins a libm
# the codegen backend can compile. Same rev as the fork family: take
# the family together or not at all.
[dependencies]
spirv-std = { git = "https://github.com/rust-gpu/rust-gpu.git", rev = "05b34493ce661dccd6694cf58afc13e3c8f7a7e0" }
# glam pinned with it. spirv-std accepts a wide glam range, but the
# newest in that range emits a `rust_gpu::vector` attribute this
# codegen backend does not know; the fork family's glam is the one it
# was built against. Pin the row, not the crate.
glam = { version = "=0.24.2", default-features = false, features = ["libm"] }

# Its own workspace: the SPIR-V target needs a build profile mere's
# workspace does not set, and this crate is never built for the host.
[workspace]
