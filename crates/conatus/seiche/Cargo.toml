[package]
name = "seiche"
version = "0.0.3"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Kernel-free, rapier-backed force-directed graph layout: bodies bound to node keys, themable forces (exclusion, springs, boundary), and quint field couplings. A host feeds node keys + positions; seiche integrates."
repository = "https://github.com/mark-ik/seiche"
keywords = ["physics", "layout", "graph", "force-directed", "rapier"]
categories = ["graphics", "simulation"]

[lib]
path = "src/lib.rs"

[dependencies]
# rapier2d is the dynamics + collision substrate. Mere's spatial
# behavior (node exclusion, edge springs, themable moot fields) all
# resolve through this simulation, so the dep lands as a foundational
# layer alongside vello and petgraph rather than a feature bolt-on.
rapier2d = "0.33"
# NodeKey (the opaque body identifier) is petgraph's NodeIndex, the same type mere's
# kernel and chartulary use, so seiche stays graph-agnostic without depending on
# either; a consumer feeds its own node keys + positions in.
petgraph = "0.8"
# Field algebra: seiche's CouplingForce evaluates quint fields (closed-form +
# finite-difference gradients) to drive rapier bodies. quint (default features only,
# no rhai/burn) is the portable field source, seiche the integrator. numen supplies
# the field-definition types the CouplingForce carries.
quint = { path = "../quint", version = "0.0.2" }
numen = { path = "../numen", version = "0.1" }
euclid = "0.22"
tracing = "0.1"
# No mere `kernel` dep: seiche is the kernel-free physics core. The graph glue that
# read/wrote a mere `Graph` (the former `kernel-bridge` wrappers) lives host-side now
# (mere-canvas's `build` adapters); the graph-free sync_nodes / sync_edges / positions
# are the whole interface a host drives.

[features]
default = []
# Benchmark-only: pulls quint's wgpu N-body pass so the ignored settle bench can
# inject it as a `RepulsionSolver`. Off by default; the shipped seiche lib never
# compiles burn (it stays the burn-free integrator). (burn brief Lane 5 — P3.)
gpu-bench = ["quint/field-burn-wgpu"]

[dev-dependencies]
uuid = "1"
