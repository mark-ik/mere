[package]
name = "conatus"
version = "0.1.0"
edition = "2024"
rust-version = "1.92.0"
license.workspace = true
description = "Host-neutral 3D body, collision, query, and fixed-step runtime for Merely spatial applications and games."
repository = "https://github.com/merely-made/mere"
keywords = ["game-engine", "physics", "voxel", "spatial", "simulation"]
categories = ["game-engines", "simulation"]

[dependencies]
nisus = { workspace = true }
rapier3d = "0.33"
serde = { version = "1", features = ["derive"] }
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
cubecl = { version = "0.11.0-pre.2", default-features = false, features = ["std", "wgpu"], optional = true }
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std"], optional = true }
burn-wgpu = { version = "0.22.0-pre.2", default-features = false, features = ["std", "autotune"], optional = true }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }

[features]
default = []
# CubeCL owns allocations. Burn and raw-kernel consumers borrow views of those
# allocations, so this entire device carriage is opt-in and absent from the
# ordinary Conatus body/runtime path.
resident = [
    "dep:wgpu",
    "dep:bytemuck",
    "dep:cubecl",
    "dep:burn",
    "burn/wgpu",
    "burn/extension",
    "dep:burn-wgpu",
    "dep:getrandom",
]

[dev-dependencies]
serde_json = "1"
pollster = "0.4"
seiche = { path = "../seiche" }
wgpu = { version = "30", default-features = false, features = ["dx12", "vulkan", "metal", "wgsl"] }
