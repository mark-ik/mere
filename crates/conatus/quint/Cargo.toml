[package]
name = "quint"
version = "0.0.4"
authors = ["@mark-ik"]
license.workspace = true
edition = "2024"
rust-version = "1.92.0"
description = "Field algebra for graph canvases — scalar/vector fields over canvas space, node/edge couplings, and evaluation (Rhai authoring, Burn lowering). The portable field source whose forces `seiche` integrates."
repository = "https://github.com/merely-made/mere"
keywords = ["field", "physics", "graph", "layout", "canvas"]
categories = ["graphics", "science"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
# The field-primitive definitions (the portable AST, FieldId/CouplingId, Field,
# Coupling/CouplingResponse/NodeSelector) live in the portable `numen` crate; quint is
# the runtime algebra over them: it evaluates the definitions and derives forces. This
# is quint's only hard substrate dependency — quint's default build is portable.
numen = { path = "../numen", version = "0.2" }
# For minting registry-local FieldIds (from_u128, WASM-safe) and serde of the
# UUID-backed kernel FieldId embedded in FieldRegistry.
uuid = { version = "1", default-features = false, features = ["serde"] }
# Burn-backed lowering of the field algebra (AST -> a fused tensor program).
# NdArray supplies portable per-target compute; the execution device is chosen
# at runtime by each call.
burn = { version = "0.22.0-pre.2", default-features = false, features = ["std"], optional = true }
burn-wgpu = { version = "0.22.0-pre.2", default-features = false, features = ["std", "autotune"], optional = true }
# Rhai composition surface for fields, couplings, and edge-path rules.
rhai = { version = "1.20", default-features = false, features = ["std"], optional = true }
# The resident lane's device types. The device itself is always the
# host's: quint never boots one, because a second device on the same
# adapter cannot share a buffer with the renderer.
wgpu = { version = "30", default-features = false, features = ["wgsl"], optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
# Resident planes are allocated by CubeCL, then viewed by Burn and raw
# wgpu consumers. This is the direction CubeCL supports without a copy:
# compute allocations can be exported, while foreign buffers cannot be
# cheaply adopted as tensors.
cubecl = { version = "0.11.0-pre.2", default-features = false, features = ["std", "wgpu"], optional = true }

# The burn tree reaches getrandom on wasm; 0.4 needs its wasm_js backend
# feature enabled by someone in the graph (compile_error! otherwise). Same
# story for uuid's rng (its own getrandom wiring is disabled on
# wasm-unknown, so the wasm-bindgen `js` path is the supported source).
# These declarations exist only to switch those features on for wasm builds.
[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
getrandom = { version = "0.4", features = ["wasm_js"], optional = true }
uuid = { version = "1", default-features = false, features = ["js"] }

[features]
default = []
# The resident lane: CubeCL-owned allocations with Burn and raw-kernel
# views on the host's existing device. Optional because it drags the GPU
# carriage, and quint's default build stays portable.
field-gpu = [
    "dep:wgpu",
    "dep:bytemuck",
    "dep:cubecl",
    "dep:burn",
    "burn/wgpu",
    "burn/extension",
    "dep:burn-wgpu",
    "dep:getrandom",
]
field-burn = ["dep:burn", "burn/ndarray", "dep:getrandom"]
# Adds the wgpu backend so consumers can target GPU evaluation.
field-burn-wgpu = ["field-burn", "burn/wgpu", "burn/extension", "dep:burn-wgpu", "dep:getrandom"]
field-rhai = ["dep:rhai"]

[dev-dependencies]
serde_json = "1.0"
# The resident lane's receipt needs a real adapter. Backends are named
# here rather than in the dependency above on purpose: quint leaves the
# backend choice to whichever host boots the device, and a dev-only
# feature set does not reach consumers.
pollster = "0.4"
wgpu = { version = "30", default-features = false, features = [
    "dx12",
    "vulkan",
    "metal",
    "wgsl",
] }
