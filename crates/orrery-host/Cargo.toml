[package]
name = "orrery-host"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "Serval-on-winit host for the orrery (the graph field-canvas), build item 1D of the serval-as-host flip. Composites platen's scene-paint underlay (and, incrementally, gyre-positioned abs-pos node children under one camera transform) through the shared serval-winit-host present stack."

# The reusable orrery content-root (window-agnostic): graph + gyre physics + camera
# + the abs-pos node-children pool, with `frame(w, h) -> (Scene, needs_redraw)` and
# semantic input methods. The bin below is a thin winit shell over it; meerkat hosts
# the same `Orrery` as its content-root (S1 of the modular integration plan).
[lib]
name = "orrery_host"
path = "src/lib.rs"

[[bin]]
name = "orrery-host"
path = "src/main.rs"

[dependencies]
# Shared present stack (SurfaceHost: boot / resize / rasterize / acquire) + the
# winit->serval key & modifier mapping, shared with meerkat.
serval-winit-host = { path = "../serval-winit-host" }

# The host-neutral orrery scene producer + camera/style, and its graph + physics.
platen.workspace = true
kernel.workspace = true
gyre.workspace = true

# The actor harness behind the always-offload physics backend (P6): the gyre
# Simulation runs on an armillary actor thread, emitting position snapshots the
# host folds into its LayoutView. The in-thread backend (tests + the future
# no-threads wasm profile) needs none of this.
armillary.workspace = true

# Compose the underlay (+ the node-children document) into one Scene, and
# present it. Path deps on the sibling netrender checkout, like meerkat's.
paint_list_render = { path = "../../../netrender/paint_list_render" }
paint_list_api = { path = "../../../netrender/paint_list_api" }
netrender = { path = "../../../netrender/netrender" }

# The node-children layer: a persistent serval ScriptedDom (abs-pos node subtrees
# under the camera-transformed container), driven through IncrementalLayout
# (apply on the RepaintOnly path + emit_paint_list) from serval-layout and
# composited with the underlay. layout_dom_api supplies the build traits + names.
serval-scripted-dom = { path = "../../../serval/components/serval-scripted-dom" }
serval-layout = { path = "../../../serval/components/serval-layout" }
layout_dom_api = { package = "layout-dom-api", path = "../../../serval/components/shared/layout-dom" }

# Windowing + present (pins align with serval's: wgpu 29 / winit 0.30).
winit = { workspace = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = "1"
# Constructing seed positions for the gyre simulation (its position type).
euclid = "0.22"

[lints]
workspace = true
