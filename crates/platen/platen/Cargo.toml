[package]
name = "platen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The pane home for the Mere browser — compiles forme arrangements into workbench plans, tile trees, and pane geometry; the press in the printing metaphor. Decomposed 2026-07-09: the graph-scene paint lane moved to the canvas crate."
documentation = "https://docs.rs/platen"
readme = "README.md"
keywords = ["layout", "composition", "panes", "workbench", "browser"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
document-canvas.workspace = true
inker.workspace = true
# Pelt's tile-tree contract (V5/V6): platen projects a forme arrangement's
# WorkbenchPlan onto it (`tree_projection::tile_tree_from_plan`), so a host
# can drive the standalone pelt tile surface as its workbench pane. A
# zero-dependency contract leaf in serval; the projection is the only seam
# between forme and the surface (the projection-not-a-second-authority rule).
pelt-core = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
# Platen projects a forme arrangement into a presentation plan (the
# tree projection — its core role under the composition spine).
forme.workspace = true
serde = { version = "1.0", features = ["derive"] }
# Workbench tiling persists as JSON (the bridge's (Arrangement, geometry) pair);
# the host writes the string beside the session graph.
serde_json = "1"
uuid = { version = "1", features = ["serde"] }
