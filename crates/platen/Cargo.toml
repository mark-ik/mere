[package]
name = "platen"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Graph-aware composition surface for the Mere browser — node layout, the press to verso's page."
keywords = ["layout", "composition", "graph", "workbench", "browser"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
graph-canvas = { path = "../graph/graph-canvas" }
graphshell-core = { path = "../shell/graphshell-core" }
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1", features = ["serde"] }
verso-tile = { path = "../verso-tile" }
