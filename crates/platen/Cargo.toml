[package]
name = "platen"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Graph-aware composition surface for the Mere browser — node layout, the press to verso's page."
documentation = "https://docs.rs/platen"
readme = "README.md"
keywords = ["layout", "composition", "graph", "workbench", "browser"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
cartography = { path = "../cartography" }
graph-canvas = { path = "../graph/graph-canvas" }
graph-layout = { path = "../graph/graph-layout" }
document-canvas = { path = "../document/document-canvas" }
inker = { path = "../inker" }
mere-kernel = { path = "../mere-kernel" }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
verso-tile = { path = "../verso-tile" }
