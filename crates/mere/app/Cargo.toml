[package]
name = "mere-app"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Mere — idiomatic Xilem app. Chrome is a Xilem view tree over one AppState; the graph canvas is a custom Masonry widget. Replaces the substrate-as-host mere-host (2026-05-21 re-scaffold)."

[[bin]]
name = "mere"
path = "src/main.rs"

[dependencies]
# The Xilem app driver (window + event loop + reactive view tree). Git-dep on
# our fork's branch (carries the external-surface + on_tick hooks and the
# wgpu-29/vello-0-9 pins) so a fresh `git clone` of mere builds without a
# sibling xilem checkout. The fork resolves its imaging dep via git too. For
# local xilem dev, override via a gitignored `.cargo/config.toml` `paths` entry.
xilem = { git = "https://github.com/mark-ik/xilem", branch = "mere-wgpu-29-vello-0-9" }

# Portable core — the framework-free truth the views render.
kernel = { workspace = true, features = ["store"] }
frame.workspace = true
# Arrangement authority + its tree projection — the Workbench pane renders
# `platen::project_tree(&forme::Arrangement)`. The `store` feature adds native
# on-disk persistence so the workbench forme survives a restart.
forme = { workspace = true, features = ["store"] }
platen.workspace = true
# Engine choice + a smolweb document engine — the live workbench tile routes
# an address through `inker`'s policy and renders the matched `nematic`
# engine's `EngineDocument` (the v1 "one live engine-backed tile").
inker.workspace = true
nematic.workspace = true
# JSON-LD ingest: a fetched `application/ld+json` body is parsed to a
# `GraphContribution` and merged into the live graph (linked-data plan Phase 2,
# host consumer) rather than rendered as a document.
linked-data.workspace = true

# Mint the seed workbench forme's graph_id (forme's `GraphId` is a bare UUID).
uuid = { version = "1", features = ["v4"] }

# External-surface tiles: the `with_external_compositor` hook composites engine
# textures into the shared render target. Same wgpu (29) as masonry_winit, so
# the `ExternalCompositeCtx` device/queue/target types unify.
wgpu.workspace = true
# The system-WebView producer for scrying surface tiles. Git-dep (portable, like
# the xilem fork); scrying pins the same wgpu 29 / rwh 0.6 / dpi, so its frame
# textures + the importer unify with our device. Driven from the on_tick hook.
scrying = { git = "https://github.com/mark-ik/wgpu-scry", branch = "main" }
# Extract the parent window handle (HWND) from `ctx.window` to parent the
# WebView, and build the producer's `PhysicalSize` config.
raw-window-handle.workspace = true
dpi.workspace = true

# WebView2's composition path needs a `DispatcherQueue` on the UI thread before
# `Compositor::new`; the host creates + holds the controller (scrying leaves
# thread init to the embedder). Windows-only.
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = ["System", "Win32_System_WinRT"]

[lints]
workspace = true
