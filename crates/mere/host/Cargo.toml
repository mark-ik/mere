[package]
name = "host"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Mere xilem host — winit application binding the substrate scene, frametree projection, renderer chain (orrery / panel / splitter), and cartography projection into a runnable window. Replaces the prior gpui host (2026-05-18 redirect)."

[[bin]]
name = "host"
path = "src/main.rs"

[dependencies]
# Substrate ↔ runtime bridge — owns HostApp, sync_scene_from_frame_layout,
# pane/splitter/tile identity tracking, action bus, manifest store.
host-substrate.workspace = true
# Durable state vocabulary + ActionKind/BusAction. HostApp re-exports
# what's needed for dispatch; we pull the runtime crate directly for
# the action-bus enum types the click handlers construct.
session-runtime.workspace = true
# Frame layout types (FrameLayout, PaneContent, etc.) for the seed
# layout the host builds at startup.
frame.workspace = true
# Substrate scene primitives (NodeContentKind, RendererRegistry traits,
# NodeIdentity) used by the orrery / splitter renderers.
register-renderer.workspace = true
# Kernel graph + geometry — the host seeds a Graph at startup and
# stores it in its GraphRegistry for cartography projection.
kernel.workspace = true
# Cartography contracts — ProjectionRequest / ViewIntent / Projection.
cartography.workspace = true
# Strategy implementations (GridAdapter for the v0 orrery; force-
# directed / etc. as the renderer chain grows).
graph-layout.workspace = true
# Substrate scene primitives (SubstrateScene, SubstrateNode,
# RelationEdge) — the Path-B explosion appends per-node entities to
# the scene directly, so the substrate types are needed in non-test
# code, not just the renderer unit tests.
spatial-substrate.workspace = true
# EngineDocument shape for seeding workbench tiles.
inker.workspace = true

# Masonry renderer for `NodeContentKind::Panel` panes (workbench /
# gloss / apparatus). Pulls in the upstream xilem stack via mere-
# masonry's path-deps.
mere-masonry = { path = "../../verso/masonry-renderer" }
masonry_core = { path = "../../../../xilem/masonry_core" }

# Windowing + GPU + paint stack.
winit = "0.30.13"
wgpu = "29"
vello = "0.9"
kurbo = "0.13"
pollster = "0.4"
# petgraph::NodeIndex constructor for tile-seeding.
petgraph = "0.8"
# xilem's ViewCtx requires a tokio runtime; the host owns one and
# shares it into each reactive panel (multi-threaded flavor per the
# panel-work decision).
tokio = { version = "1", features = ["rt-multi-thread"] }

