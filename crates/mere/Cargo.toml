[package]
name = "mere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "The composed graph library behind Merecat and other graph-shaped applications."

[features]
default = []
# The app-facing semantic query surface stays opt-in because it carries the
# SPARQL evaluator. Consumers that only need graph construction do not pull it.
query = ["linked-data/query"]
# Test-only fixture escape hatch. This mirrors kernel's gate without exposing
# the fixture API to ordinary library consumers.
fixtures = ["kernel/fixtures"]

[dependencies]
apparatus = { workspace = true }
forme = { workspace = true }
# The engine-management layer (serval component since 2026-07-10): the facade
# composes mere's routing vocabulary over inker's host-neutral policy.
inker = { workspace = true }
graphlets = { workspace = true }
glossary = { workspace = true }
gloss = { workspace = true }
kernel = { workspace = true }
linked-data = { workspace = true }
canvas = { workspace = true }
platen = { workspace = true }
roster = { workspace = true }
trail = { workspace = true }
workbench = { workspace = true }

[lints]
workspace = true
