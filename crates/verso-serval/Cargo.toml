[package]
name = "verso-serval"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The serval FlipDonor adapter for the Mere browser's compatibility-view flip: bridges serval's scripted DOM (DOM + form layers) plus host-fed runtime/session state to verso-api's PortableViewState. The glass-box donor side of a serval -> scrying flip."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
verso-api = { workspace = true }
# serval's mutable scripted DOM. The donor serializes its outerHTML (DOM layer)
# and walks it for form values (FORM layer); both are public inherent methods on
# ScriptedDom. Same git dep meerkat already pulls.
serval-scripted-dom = { git = "https://github.com/mark-ik/serval.git", branch = "main" }
# The LayoutDom trait, for `document()` (the capture root NodeId). Same package
# meerkat pulls (the `layout-dom-api` crate, imported as `layout_dom_api`).
layout_dom_api = { package = "layout-dom-api", git = "https://github.com/mark-ik/serval.git", branch = "main" }
