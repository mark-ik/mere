[package]
name = "illume"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable text lexer and syntax highlighter for the Mere browser. Pure-Rust, wasm-safe djot structure plus a pluggable inner-language injection registry over a logos pack; host-agnostic, no UI toolkit."
documentation = "https://docs.rs/illume"
keywords = ["djot", "lexer", "syntax-highlighting", "logos"]
categories = ["text-processing"]

[lib]
path = "src/lib.rs"

[dependencies]
# The djot pull-parser. The editor pipe reads the same source text as the meaning
# pipe (nematic's DjotKnotEngine) but drives highlighting from the byte-offset
# event stream, separate from the block model. Pinned to match nematic.
jotdown = "0.10"
# DFA lexer generator for the curated injection pack — the fastest pure-Rust token
# lexer, wasm-clean, no C. Each pack language is a small token enum.
logos = "0.16"
