[package]
name = "weld-engine"
# Genet's workspace version, inlined when this crate landed in mere on
# 2026-09-03: mere's workspace version is 0.0.1 and the move is not a
# version decision. Unpublished either way.
version = "0.2.0"
edition.workspace = true
authors = ["Mark AB (markik)"]
# Not workspace: this crate is ours, not Servo-derived, so it keeps the founding
# license rather than inheriting genet's MPL-2.0.
license = "MPL-2.0"
repository.workspace = true
description = "inker SurfaceEngine implementation backed by the wgpu-weld CEF (Chromium) accelerated-OSR embedding."
publish = false

[features]
default = []
welding-0-15 = ["dep:welding-0-15"]

[lib]
path = "src/lib.rs"

[dependencies]
inker.workspace = true
tracing.workspace = true
welding-0-15 = { workspace = true, optional = true }
dpi.workspace = true

# Welding remains opt-in: ordinary Mere resolution stays free of CEF. The
# adapter feature names one reviewed 0.15 contract exactly; concrete runtime,
# profile, producer construction, and import-cache policy remain with the host.
