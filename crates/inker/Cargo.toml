[package]
name = "inker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Modular engine/renderer controller for the Mere browser — selects and orchestrates content engines."
documentation = "https://docs.rs/inker"
readme = "README.md"
keywords = ["engine", "renderer", "controller", "browser", "modular"]
categories = ["web-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
# Kernel-free by design (the seiche precedent): routing context takes petgraph's
# NodeIndex directly (mere's kernel NodeKey is an alias of the same type) and an
# own uuid-backed view-id newtype, so inker ports to non-mere hosts and to the
# serval workspace without dragging the graph kernel.
petgraph = { version = "0.8.3", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
tracing = "0.1"
uuid = { version = "1", features = ["serde"] }
