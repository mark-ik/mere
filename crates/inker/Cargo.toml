[package]
name = "inker"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Modular engine/renderer controller for the Mere browser — selects and orchestrates content engines."
keywords = ["engine", "renderer", "controller", "browser", "modular"]
categories = ["web-programming"]

[lib]
path = "src/lib.rs"

[dependencies]
graphshell-core = { path = "../graphshell/core" }
serde = { version = "1.0", features = ["derive"] }
verso-tile = { path = "../verso-tile" }
