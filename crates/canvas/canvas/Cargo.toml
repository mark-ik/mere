[package]
name = "mere-canvas"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "The mere graph canvas: the graph-truth presentation library (content-root: graph + seiche physics + camera + the abs-pos node-children pool + the scene-paint underlay), composited through the shared genet-winit-host present stack. Was `orrery`; that name retired to the Merely product tier ladder 2026-07-09, and platen's graph-scene lane merged in the same pass."

# The reusable canvas content-root (window-agnostic): graph + seiche physics + camera
# + the abs-pos node-children pool, with `frame(w, h) -> (Scene, needs_redraw)` and
# semantic input methods. The bin below is a thin winit shell over it; meerkat and
# merecat host the same `Canvas` as their content-root.
[lib]
name = "canvas"
path = "src/lib.rs"

[[bin]]
name = "canvas"
path = "src/main.rs"

[dependencies]
kernel.workspace = true
# The scene-paint lane (merged from platen, 2026-07-09): cartography projection
# dispatch + the layout-strategy catalog + the coupling paint pass, over forme
# arrangements.
cartography.workspace = true
arrangements.workspace = true
sceno.workspace = true
scenomise.workspace = true
quint.workspace = true
forme.workspace = true
# The scene-paint list + the cartography-geometry sidecar serialize (the host
# persists the sidecar as JSON beside the session graph).
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
# seiche is the kernel-free physics core. The graph glue that reads/writes a kernel
# Graph (sync the sim from nodes, resolve couplings) lives canvas-side in
# `build::{sync_sim_with_graph, coupling_force_from_graph}` — the adapters that
# replaced seiche's removed `kernel-bridge` wrappers when seiche was extracted.
seiche.workspace = true
# The graph-structural signal producer (intel/signals): degree-based importance now (the
# size-by-importance encoding reads it), richer signals later. (Graph signals.)
signals.workspace = true

# The actor harness behind the always-offload physics backend (P6): the seiche
# Simulation runs on an armillary actor thread, emitting position snapshots the
# host folds into its LayoutView. The in-thread backend (tests + the future
# no-threads wasm profile) needs none of this.
armillary.workspace = true

# Compose the underlay (+ the node-children document) into one Scene, and
# present it. Path deps on the sibling netrender checkout, like meerkat's.
paint_list_render = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
paint_list_api = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
netrender = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }

# The node-children layer: a persistent genet ScriptedDom (abs-pos node subtrees
# under the camera-transformed container), driven through IncrementalLayout
# (apply on the RepaintOnly path + emit_paint_list) from genet-layout and
# composited with the underlay. layout_dom_api supplies the build traits + names.
genet-scripted-dom = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
genet-layout = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", git = "https://github.com/mark-ik/genet.git", branch = "main" }

tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = "1"
# Constructing seed positions for the seiche simulation (its position type).
euclid = "0.22"

# The native present stack: the Orrery lib is window-agnostic (frame -> Scene), so
# the winit window + wgpu present + the shared SurfaceHost are bin-only and gated
# off wasm. The wasm present path (canvas + WebGPU) is a later step. (P2, 2026-06-06.)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
genet-winit-host = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
winit = { workspace = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }

[lints]
workspace = true

[dev-dependencies]
kernel = { workspace = true, features = ["fixtures"] }
