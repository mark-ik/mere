[package]
name = "mere-gloss"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Gloss domain layer for Mere: outline snapshots, minimap geometry, and document-outline projection."
documentation = "https://docs.rs/gloss"
readme = "README.md"
keywords = ["gloss", "outline", "mere", "uxtree"]
categories = ["accessibility", "gui"]

[lib]
name = "gloss"
path = "src/lib.rs"

[dependencies]
accesskit.workspace = true
forme.workspace = true
glossary.workspace = true
inker.workspace = true
kernel.workspace = true
canvas.workspace = true
register-theme.workspace = true
tracing.workspace = true
uxtree.workspace = true
netrender = { git = "https://github.com/merely-made/netrender.git", branch = "main" }
