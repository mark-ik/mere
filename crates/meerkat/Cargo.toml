[package]
name = "meerkat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "Mere's serval-as-host shell (the eventual replacement for the Xilem + Masonry mere-app host): chrome — toolbar / omnibar / command palette / frametree — built as xilem_serval views over the reused graphshell chrome domain, presented by serval. Holds the separate-roots discipline (chrome-root vs content-roots) from commit one."

[lib]
name = "meerkat"
path = "src/lib.rs"

# The on-screen shell: a winit window that renders the reused chrome through
# serval and presents via netrender (pelt-live-shaped). The lib half stays
# headless; this bin carries the windowing + present stack.
[[bin]]
name = "meerkat"
path = "src/main.rs"

[dependencies]
# The chrome-as-DOM view layer: a xilem_core backend that diffs a Xilem view
# tree into serval's mutable ScriptedDom. Cross-repo path dep on the sibling
# serval checkout — mere and serval share the vello 0.9 / wgpu 29 pins, so there
# is no renderer-stack reconciliation (serval-as-host flip plan, Findings).
xilem-serval = { path = "../../../serval/components/xilem-serval" }
serval-scripted-dom = { path = "../../../serval/components/serval-scripted-dom" }
# The content card parses fetched pages as full HTML documents (keeping <head>,
# so head <style> / <link> are seen) and renders them through the shared serval
# content core; StaticDocument is serval's script-free document DOM.
serval-static-dom = { path = "../../../serval/components/serval-static-dom" }

# Reused, host-neutral chrome view-models — toolbar / omnibar / command palette /
# frame model / routing. meerkat is the next "host widget" that renders these as
# DOM; the shell owns the mutations. The exact M4 contract these types were built
# for ("host widgets render from these types through the view-model").
chrome = { workspace = true }

# ─── On-screen bin: the serval render + present stack (pelt-live-shaped) ──────
# Reuse pelt-live's lib for the cascade -> layout -> paint -> netrender::Scene
# builder (scene_from_scripted_dom) and the point->node hit-test (hit_test_node),
# rather than reimplement them. This is the path dep that pulls serval-layout /
# netrender / paint / taffy into mere's workspace.
pelt-live = { path = "../../../serval/ports/pelt-live" }
# ScrollOffsets, the per-node scroll map scene_from_scripted_dom takes (empty for
# the chrome toolbar; populated when scrollable chrome lands).
serval-layout = { path = "../../../serval/components/serval-layout" }
# Scene / Renderer / ColorLoad / ExternalTexturePlacement for the present pass.
netrender = { path = "../../../netrender/netrender" }
# The `LayoutDom` trait: `document()` + `element_name` / `dom_children` to walk
# and measure the chrome band (toolbar split + click-region gate). ScriptedDom
# implements it; same cross-repo path as xilem-serval.
layout_dom_api = { package = "layout-dom-api", path = "../../../serval/components/shared/layout-dom" }

# Shared serval-on-winit present plumbing (SurfaceHost: boot / resize / rasterize
# / acquire, + winit->serval key & modifier mapping), shared with the orrery host.
serval-winit-host = { path = "../serval-winit-host" }

# The orrery content-root: the graph's spatial presentation (graph + gyre physics
# + camera + abs-pos node pool), as a window-agnostic `Orrery` exposing
# `frame(w, h) -> (Scene, needs_redraw)` + semantic input. meerkat hosts it as the
# content-root below the chrome band; the orrery-host bin is the same `Orrery` on
# its own window. (Modular integration plan, S1.)
orrery-host = { path = "../orrery-host" }

# The content-card pipeline: a focused node's media as a document. inker supplies
# the portable EngineDocument model; document-canvas lays it out (parley) and,
# behind its `netrender` feature, lowers it to a netrender::Scene the host
# composites as a floating card over the orrery. (Modular integration plan, S2.)
inker = { workspace = true }
document-canvas = { workspace = true, features = ["netrender"] }

# The graph kernel (the `Graph` type) and the linked-data bridge: a fetched
# JSON-LD document (or JSON-LD embedded in HTML) merges into the session graph,
# remote `@context`s resolved offline against the bundled full pack (schema.org /
# ActivityStreams / Dublin Core). The merge rides `Orrery::ingest_graph`.
kernel = { workspace = true }
linked-data = { workspace = true }

# Off-UI-thread fetch (S2.2b): netfetcher's async WHATWG Fetch runs on a tokio
# worker pool; results are delivered back to the winit loop over a channel + an
# EventLoopProxy wake. `url` builds the request; netfetcher is the sibling repo,
# path-dep'd like netrender. Network I/O is the host's job — engines stay
# byte-consuming and never link netfetcher.
netfetcher = { path = "../../../netfetcher" }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

# ─── P2P sync (S5.0 foundation) ──────────────────────────────────────────────
# The host stands up one p2panda transport and joins a tessera moot's LogSync
# session, surfacing real sync status in the chrome. The sync subsystem mirrors
# the netfetcher seam (background tokio work -> mpsc channel -> EventLoopProxy
# wake -> user_event drain) — see the host p2p wiring plan. `transport` is the
# P2pandaTransport adapter; `moothold` supplies the tessera SyncedMoot + store;
# `identity` the (ephemeral, for now) signing keypair.
identity = { workspace = true }
transport = { workspace = true }
moothold = { workspace = true }

# Content engines for the card (S2.2b-ii): nematic's document engines (markdown /
# gemtext / plain text / feeds / …) turn fetched bytes into an EngineDocument,
# routed by content-type. HTML rides the serval lane instead (set_inner_html →
# scene_from_scripted_dom via the pelt-live dep already present).
nematic = { workspace = true }

# Session persistence (S3): the session graph survives restart as graph.json via
# session-runtime's session_graph_store; dirs resolves the per-user data dir.
session-runtime = { workspace = true }
dirs = "6"
# Durable content cache (S3.2c): fetched pages + subresources persist through an
# eidetic fjall store under the session dir, so a reload shows them without
# re-fetching. pollster drives the async Store calls to completion on the UI
# thread (the fjall backend's futures are ready, so this does not block on I/O).
eidetic-fjall = { workspace = true }
pollster = "0.4"

# Windowing + present (mirrors pelt-live's bin deps; mere's pins align with
# serval's, so the wgpu 29 / winit 0.30 surface + netrender Renderer unify).
winit = { workspace = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
