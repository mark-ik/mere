[package]
name = "meerkat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "Mere's serval-as-host shell (the eventual replacement for the Xilem + Masonry mere-app host): chrome — toolbar / omnibar / command palette / frametree — built as xilem_serval views over the reused graphshell chrome domain, presented by serval. Holds the separate-roots discipline (chrome-root vs content-roots) from commit one."

[features]
agent-harness = []

[lib]
name = "meerkat"
path = "src/lib.rs"

# The on-screen shell: a winit window that renders the reused chrome through
# serval and presents via netrender (pelt-live-shaped). The lib half stays
# headless; this bin carries the windowing + present stack.
[[bin]]
name = "meerkat"
path = "src/main.rs"

[dependencies]
# The chrome-as-DOM view layer: a xilem_core backend that diffs a Xilem view
# tree into serval's mutable ScriptedDom. Cross-repo path dep on the sibling
# serval checkout — mere and serval share the vello 0.9 / wgpu 29 pins, so there
# is no renderer-stack reconciliation (serval-as-host flip plan, Findings).
xilem-serval = { path = "../../../serval/components/xilem-serval" }
serval-scripted-dom = { path = "../../../serval/components/serval-scripted-dom" }
# The content card parses fetched pages as full HTML documents (keeping <head>,
# so head <style> / <link> are seen) and renders them through the shared serval
# content core; StaticDocument is serval's script-free document DOM.
serval-static-dom = { path = "../../../serval/components/serval-static-dom" }

# Reused, host-neutral chrome view-models — toolbar / omnibar / command palette /
# frame model / routing. meerkat is the next "host widget" that renders these as
# DOM; the shell owns the mutations. The exact M4 contract these types were built
# for ("host widgets render from these types through the view-model").
chrome = { workspace = true }

# The comms domain (P5): the host-neutral conversation / message / identity model
# + pane view-model. meerkat renders `comms::CommsPane` the way it renders
# `chrome`'s view-models, and (P6c) drives a live `Comms` through the comms actor —
# so both backend adapters are on.
comms = { workspace = true, features = ["misfin-adapter", "murm-adapter"] }
# The comms actor stands up the backends the adapters wrap: a real on-disk misfin
# mailbox (the `server` feature's `MailboxStore`) and a local murm cabal (`Murm` +
# `open_cabal`, over a stub transport — no networking in this first cut).
misfin = { workspace = true, features = ["server"] }
murm = { workspace = true }

# ─── On-screen bin: the serval render + present stack ────────────────────────
# meerkat owns its `ScriptedDom -> netrender::Scene` render glue (the
# `serval_render` module), depending on serval's *components* directly rather than
# on `pelt-live` (a serval-side probe). See the serval_render_glue_extraction_plan.
# The cascade / layout / emit / query engine, plus ScrollOffsets (the per-node
# scroll map the glue takes) and IncrementalLayout (the pane sessions).
serval-layout = { path = "../../../serval/components/serval-layout" }
# The paint-list -> netrender::Scene lowering (translate_paint_list); the same
# crate the orrery lowers through.
paint_list_render = { path = "../../../netrender/paint_list_render" }
# Engine-agnostic paint command types (ColorF, DeviceIntSize) the render glue names.
paint_list_api = { path = "../../../netrender/paint_list_api" }
# Scene / Renderer / ColorLoad / ExternalTexturePlacement for the present pass.
netrender = { path = "../../../netrender/netrender" }
# Host text-into-scene path: parley shapes a single line; netrender_text lowers
# the parley Layout into the same netrender::Scene the host draws rects into. Used
# for the session-switcher tile labels (the textless-switcher deferral) and session
# rename display. Same parley 0.10 pin as document-canvas, so the Layout type unifies.
parley = { workspace = true }
netrender_text = { path = "../../../netrender/netrender_text" }
# The `LayoutDom` trait: `document()` + `element_name` / `dom_children` to walk
# and measure the chrome band (toolbar split + click-region gate). ScriptedDom
# implements it; same cross-repo path as xilem-serval.
layout_dom_api = { package = "layout-dom-api", path = "../../../serval/components/shared/layout-dom" }

# Shared serval-on-winit present plumbing (SurfaceHost: boot / resize / rasterize
# / acquire, + winit->serval key & modifier mapping), shared with the orrery host.
serval-winit-host = { path = "../../../serval/components/serval-winit-host" }

# The orrery content-root: the graph's spatial presentation (graph + gyre physics
# + camera + abs-pos node pool), as a window-agnostic `Orrery` exposing
# `frame(w, h) -> (Scene, needs_redraw)` + semantic input. meerkat hosts it as the
# content-root below the chrome band; the `orrery` bin is the same `Orrery` on
# its own window. (Modular integration plan, S1.)
orrery.workspace = true
# Domain a11y projection for the graph/orrery content root.
mere-orrery.workspace = true

# The content-card pipeline: a focused node's media as a document. inker supplies
# the portable EngineDocument model; document-canvas lays it out (parley) and,
# behind its `netrender` feature, lowers it to a netrender::Scene the host
# composites as a floating card over the orrery. (Modular integration plan, S2.)
inker = { workspace = true }
document-canvas = { workspace = true, features = ["netrender"] }

# The omnibar command shell's rhai lane. meerkat reuses `script-rhai::base_engine`
# (the shared sandbox config) and layers the `Command`-verb + graph-query bindings
# on top: the privileged tier of the two-tier trust model (the note lane stays
# binding-free). See the omnibar_command_shell_plan.
script-rhai = { workspace = true }

# The graph kernel (the `Graph` type) and the linked-data bridge: a fetched
# JSON-LD document (or JSON-LD embedded in HTML) merges into the session graph,
# remote `@context`s resolved offline against the bundled full pack (schema.org /
# ActivityStreams / Dublin Core). The merge rides `Orrery::ingest_graph`.
kernel = { workspace = true }
linked-data = { workspace = true }

# The actor-kernel runtime: the !Send host-kernel boundary + the Send actor
# harness. meerkat's I/O subsystems (fetch, ...) are expressed as armillary
# actors; the kernel context is pinned to the UI thread by type.
armillary = { workspace = true }

# Tiled-workbench composition (S4): forme owns the geometry-free arrangement
# (a graph of tile / member intents); platen projects it into a WorkbenchPlan,
# which `Workbench::to_tile_tree` hands to pelt's `TileSurface` to render. meerkat
# holds the open tiles, drives the projection, and resolves each tile's member UUID
# to a node URL against the session graph. The orrery is that same arrangement's
# Cartography projection; the tiled mode is its Tree projection.
# The frame tree: the window-level pane arranger (FrameLayout = split tree of
# resizable panes). meerkat hosts the graph pane plus summoned sibling panes
# (roster now; gloss / inspector / apparatus later) as frame leaves, computing
# each leaf's rect from the split ratios (the frame crate is geometry-free).
frame = { workspace = true }

forme = { workspace = true }
platen = { workspace = true }
# Domain a11y projections for panes hosted by the frame tree.
apparatus-domain = { package = "apparatus", path = "../platen/domain/apparatus" }
workbench-domain = { package = "workbench", path = "../platen/domain/workbench" }
# Pelt's tile-tree contract + the GPU-free tile surface (V6): meerkat hosts the
# standalone pelt `TileSurface` as its workbench pane, driven entirely through the
# contract (`Workbench::to_tile_tree` projects forme's tiling onto it). The
# `tile-surface` feature is the GPU-free surface only — `default-features = false`
# keeps pelt's reference-shell windowing (serval-winit-host / wgpu present stack)
# out; meerkat brings its own. `pelt-core` is the zero-dependency contract leaf.
pelt-core = { path = "../../../serval/ports/pelt-core" }
pelt-desktop = { path = "../../../serval/ports/pelt-desktop", default-features = false, features = ["tile-surface"] }

# Off-UI-thread fetch (S2.2b): netfetcher's async WHATWG Fetch runs on a tokio
# worker pool; results are delivered back to the winit loop over a channel + an
# EventLoopProxy wake. `url` builds the request; netfetcher is the sibling repo,
# path-dep'd like netrender. Network I/O is the host's job — engines stay
# byte-consuming and never link netfetcher.
netfetcher = { path = "../../../netfetcher" }
# Small-web (smolweb) transport: gemini / gopher / finger / spartan / nex / guppy
# / titan, routed by scheme. A standalone, crates.io-only sibling crate consumed
# one-way; a **git dep** (not a path dep) so any machine pulls just mere and Cargo
# fetches errand from GitHub — no `../../../errand` layout to replicate. The fetch
# actor routes http(s) -> netfetcher and smolweb schemes -> errand.
errand = { git = "https://github.com/mark-ik/errand.git" }
# Construct `errand::ClientIdentity` (CertificateDer / PrivateKeyDer) from the
# misfin cert's DER bytes for the misfin send path. Same crate rustls re-exports
# as `rustls::pki_types`, so it unifies with errand's rustls 0.23.
rustls-pki-types = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync"] }

# ─── P2P sync (S5.0 foundation) ──────────────────────────────────────────────
# The host stands up one p2panda transport and joins a tessera moot's LogSync
# session, surfacing real sync status in the chrome. The sync subsystem mirrors
# the netfetcher seam (background tokio work -> mpsc channel -> EventLoopProxy
# wake -> user_event drain) — see the host p2p wiring plan. `transport` is the
# P2pandaTransport adapter; `moothold` supplies the tessera SyncedMoot + store;
# `identity` the (ephemeral, for now) signing keypair.
identity = { workspace = true }
transport = { workspace = true }
moothold = { workspace = true }

# Shell-chrome theme tokens (theming pass): the toolbar / omnibar / palette /
# pane palette comes from a resolved `ChromeTheme` rather than hardcoded CSS, so
# the chrome theme-switches alongside the graph chrome. The registry also seeds
# the graph-node + edge tokens; meerkat consumes the chrome half for now.
register-theme = { workspace = true }
# Portable UX event/probe taxonomy. meerkat records pane/theme events into its
# host-local Apparatus observability cache through this seam.
ux-events = { workspace = true }
# Diagnostics channel registry and portable emit scaffold. meerkat uses the
# descriptor/invariant layer to classify Apparatus records.
register-diagnostics = { workspace = true }
# Internal a11y/automation tree projection and AccessKit-shaped audit. The OS
# bridge stays separate; this is only the host-local snapshot Apparatus reads.
uxtree = { workspace = true }
accesskit = { workspace = true }
raw-window-handle = { workspace = true }

# Content engines for the card (S2.2b-ii): nematic's document engines (markdown /
# gemtext / plain text / feeds / …) turn fetched bytes into an EngineDocument,
# routed by content-type. HTML rides the serval lane instead (set_inner_html →
# scene_from_scripted_dom via the host-owned serval_render glue).
nematic = { workspace = true }

# Session persistence (S3): the session graph survives restart as graph.json via
# session-runtime's session_graph_store; dirs resolves the per-user data dir.
session-runtime = { workspace = true }
dirs = "6"
# Durable content cache (S3.2c): fetched pages + subresources persist through an
# eidetic fjall store under the session dir, so a reload shows them without
# re-fetching. pollster drives the async Store calls to completion on the UI
# thread (the fjall backend's futures are ready, so this does not block on I/O).
eidetic-fjall = { workspace = true }
pollster = "0.4"

# Windowing + present (mirrors pelt-live's bin deps; mere's pins align with
# serval's, so the wgpu 29 / winit 0.30 surface + netrender Renderer unify).
winit = { workspace = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
# System clipboard for the omnibar / command-palette Ctrl(Cmd)+C/X/V, the same
# crate pelt-live's bin uses for its serval text field.
arboard = "3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[target.'cfg(windows)'.dependencies]
accesskit_windows = { workspace = true }
# The compatibility-view tile (scrying tile plan X1): the WebView2 composition
# producer + the native-frame wgpu importer. A standalone sibling repo consumed
# one-way, like netrender; the host builds the producer (it owns the HWND,
# device, and profile dir the engine seam says the engine can't fabricate).
scrying = { path = "../../../wgpu-scry/scrying" }
dpi = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit_unix = { workspace = true }

[dev-dependencies]
# Workbench-composition tests mint graph-member ids (kernel node UUIDs) and
# build small session graphs to resolve tiles against.
uuid = { workspace = true }

[lints]
workspace = true
