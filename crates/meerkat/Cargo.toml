[package]
name = "meerkat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "Mere's serval-as-host shell (the eventual replacement for the Xilem + Masonry mere-app host): chrome — toolbar / omnibar / command palette / frametree — built as xilem_serval views over the reused graphshell chrome domain, presented by serval. Holds the separate-roots discipline (chrome-root vs content-roots) from commit one."

[lib]
name = "meerkat"
path = "src/lib.rs"

# The on-screen shell: a winit window that renders the reused chrome through
# serval and presents via netrender (pelt-live-shaped). The lib half stays
# headless; this bin carries the windowing + present stack.
[[bin]]
name = "meerkat"
path = "src/main.rs"

[dependencies]
# The chrome-as-DOM view layer: a xilem_core backend that diffs a Xilem view
# tree into serval's mutable ScriptedDom. Cross-repo path dep on the sibling
# serval checkout — mere and serval share the vello 0.9 / wgpu 29 pins, so there
# is no renderer-stack reconciliation (serval-as-host flip plan, Findings).
xilem-serval = { path = "../../../serval/components/xilem-serval" }
serval-scripted-dom = { path = "../../../serval/components/serval-scripted-dom" }

# Reused, host-neutral chrome view-models — toolbar / omnibar / command palette /
# frame model / routing. meerkat is the next "host widget" that renders these as
# DOM; the shell owns the mutations. The exact M4 contract these types were built
# for ("host widgets render from these types through the view-model").
chrome = { workspace = true }

# ─── On-screen bin: the serval render + present stack (pelt-live-shaped) ──────
# Reuse pelt-live's lib for the cascade -> layout -> paint -> netrender::Scene
# builder (scene_from_scripted_dom) and the point->node hit-test (hit_test_node),
# rather than reimplement them. This is the path dep that pulls serval-layout /
# netrender / paint / taffy into mere's workspace.
pelt-live = { path = "../../../serval/ports/pelt-live" }
# ScrollOffsets, the per-node scroll map scene_from_scripted_dom takes (empty for
# the chrome toolbar; populated when scrollable chrome lands).
serval-layout = { path = "../../../serval/components/serval-layout" }
# Scene / Renderer / ColorLoad / ExternalTexturePlacement for the present pass.
netrender = { path = "../../../netrender/netrender" }
# The `LayoutDom` / `LayoutDomMut` traits: `document()` + `set_inner_html()` to
# build the content-root DOM, and `element_name` / `dom_children` to measure the
# toolbar band. ScriptedDom implements them; same cross-repo path as xilem-serval.
layout_dom_api = { package = "layout-dom-api", path = "../../../serval/components/shared/layout-dom" }

# Shared serval-on-winit present plumbing (SurfaceHost: boot / resize / rasterize
# / acquire, + winit->serval key & modifier mapping), shared with the orrery host.
serval-winit-host = { path = "../serval-winit-host" }

# Windowing + present (mirrors pelt-live's bin deps; mere's pins align with
# serval's, so the wgpu 29 / winit 0.30 surface + netrender Renderer unify).
winit = { workspace = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
