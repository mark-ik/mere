[package]
name = "meerkat"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "Mere's genet-as-host shell (the eventual replacement for the Xilem + Masonry mere-app host): chrome — toolbar / omnibar / command palette / frametree — built as xilem_serval views over the reused graphshell chrome domain, presented by genet. Holds the separate-roots discipline (chrome-root vs content-roots) from commit one."

[features]
default = ["engine-scry"]
agent-harness = []
# Surface-engine compile gates (engine-picker plan: each surface engine has its own
# feature, "even scry", so a build carries only the engines it wants — `is_available`
# = present (compiled in) && enabled (active this session)).
#
# `engine-scry` is the system-WebView2 compatibility tile (Windows). On by default:
# it is the working compat view and a light dep, unlike the heavy graft (Servo) / weld
# (CEF) engines below. Off => the scrying / verso-scry / dpi deps and the windows_pool
# driver drop out, and ScryingHost degrades to its no-op (off-platform) surface.
engine-scry = ["dep:scrying", "dep:scrying-engine", "dep:grafting", "dep:dpi"]
# `engine-graft` (Servo via wgpu-graft) and `engine-weld` (Chromium/CEF via wgpu-weld)
# are off by default. Each turns on its concrete host pool (GraftHost / WeldHost) and
# the engine's presence in routing. Today these are no-op seams: enabling the real
# producers pulls a multi-minute native engine build (SpiderMonkey via
# `servo-wgpu-interop-adapter/servo`, CEF via `welding/cef-runtime`), wired in the
# follow-on that fills the host pools and the render-drive path.
engine-graft = []
engine-weld = []
# The genet *scripted* render rung (render ladder phase 2): a content node pinned to
# `genet.scripted` runs its page JS through `pelt_desktop::ScriptedDocument` on Boa.
# Off by default so the base build stays the static rung — no JS engine in its
# dependency graph (the profile ladder's witness discipline) and clear of the
# Boa+wgpu link-size limit. Build the scripted variant with `--features scripted`.
scripted = ["pelt-desktop/scripted", "dep:script-engine-api", "dep:script-engine-boa", "content-contract/scripted"]
# Add the Nova JS engine as a second scripted rung (`genet.scripted.nova`), keeping
# the Boa rung and the shared scripted host path. Mirrors pelt-desktop's split so the
# host can route to Nova explicitly rather than silently swapping engines under one id.
scripted-nova = ["scripted", "pelt-desktop/scripted-nova", "dep:script-engine-nova"]
# The Genet smolweb document lane: a focused Gemini/Gopher/feed capsule lowers
# through Nematic -> EngineDocument -> document-canvas -> PaintList -> Scene,
# retaining scroll and link regions. Off by default so the base build stays
# clear of the smolweb transport/parse stack.
smolweb = ["pelt-desktop/smolweb", "dep:genet-documents", "genet-documents/smolweb"]
# Local LLM inference for the `>ask` omnibar verb. Off by default: it pulls the
# burn-wgpu tree (cubecl), a multi-minute cold build. Without it, `>ask` still
# exists and answers through infer's deterministic `CannedProvider` stub (the
# light `actor`-only infer dep is always compiled); with it, `>ask` runs a real
# llama-family model (TinyLlama today) when `MERE_TINYLLAMA_DIR` points at a
# checkpoint. (burn brief Lane 3 — meerkat host wiring.)
local-inference = ["infer/decoder-wgpu"]
# Content-embedding graph arrangement for the orrery's affinity force (burn brief
# Lane 5, P4): embeds each node's text and clusters content-similar nodes, driving
# the "cluster by affinity" force from node content instead of structural Jaccard.
# Off by default so the shipped build's affinity toggle stays structural. Pulls the
# `embed` crate at its default (pure-Rust, burn-free) — the lexical feature-hashing
# provider (clusters by shared vocabulary). A later `semantic-embeddings` feature
# upgrades the provider to a Burn-backed BERT model. Mirrors `local-inference`'s
# opt-in shape.
content-affinity = ["dep:embed"]

[lib]
name = "meerkat"
path = "src/lib.rs"

# The on-screen shell: a winit window that renders the reused chrome through
# genet and presents via netrender (pelt-live-shaped). The lib half stays
# headless; this bin carries the windowing + present stack.
[[bin]]
name = "meerkat"
path = "src/main.rs"

[dependencies]
# The chrome-as-DOM view layer: a xilem_core backend that diffs a Xilem view
# tree into genet's mutable ScriptedDom. Cross-repo path dep on the sibling
# genet checkout — mere and genet share the vello 0.9 / wgpu 29 pins, so there
# is no renderer-stack reconciliation (genet-as-host flip plan, Findings).
xilem-serval = { package = "serval-xilem", git = "https://github.com/mark-ik/genet.git", branch = "main", features = ["highlight"] }
# Chisel widget leaves: the toolbar status cluster (frame-time Meter + recent
# GraphGlyph) as `<chisel-leaf>` elements in the chrome DOM, plus the grid
# widget (GridSpec) for the nodes/recent table. The chrome emit splices leaf
# commands via IncrementalLayout::emit_paint_list_with_leaves.
chisel = { package = "serval-chisel", git = "https://github.com/mark-ik/genet.git", branch = "main" }
genet-scripted-dom = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
# The content card parses fetched pages as full HTML documents (keeping <head>,
# so head <style> / <link> are seen) and renders them through the shared genet
# content core; StaticDocument is genet's script-free document DOM.
genet-static-dom = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
# The render-free extraction lane: walks a parsed document into structured content
# (title / metadata / outline / links / text) with no cascade/layout/paint, for the
# eidetic corpus. Depends only on genet's layout-dom-api, so no render stack rides in.
genet-extract = { git = "https://github.com/mark-ik/genet.git", branch = "main" }

# Reused, host-neutral chrome view-models — toolbar / omnibar / command palette /
# frame model / routing. meerkat is the next "host widget" that renders these as
# DOM; the shell owns the mutations. The exact M4 contract these types were built
# for ("host widgets render from these types through the view-model").
chrome = { workspace = true }

# The comms domain (P5): the host-neutral conversation / message / identity model
# + pane view-model. meerkat renders `comms::CommsPane` the way it renders
# `chrome`'s view-models, and (P6c) drives a live `Comms` through the comms actor —
# so both backend adapters are on.
comms = { workspace = true, features = ["misfin-adapter", "murm-adapter"] }
# The comms actor stands up the backends the adapters wrap: a real on-disk misfin
# mailbox (the `server` feature's `MailboxStore`) and a local murm cabal (`Murm` +
# `open_cabal`, over a stub transport — no networking in this first cut).
misfin = { workspace = true, features = ["server"] }
murm = { workspace = true }

# ─── On-screen bin: the genet render + present stack ────────────────────────
# meerkat owns its `ScriptedDom -> netrender::Scene` render glue (the
# `genet_render` module), depending on genet's *components* directly rather than
# on `pelt-live` (a genet-side probe). See the genet_render_glue_extraction_plan.
# The cascade / layout / emit / query engine, plus ScrollOffsets (the per-node
# scroll map the glue takes) and IncrementalLayout (the pane sessions).
genet-layout = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
engine-observables-api = { package = "engine-observables-api", git = "https://github.com/mark-ik/genet.git", branch = "main" }
# The paint-list -> netrender::Scene lowering (translate_paint_list); the same
# crate the orrery lowers through.
paint_list_render = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
# Engine-agnostic paint command types (ColorF, DeviceIntSize) the render glue names.
paint_list_api = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
# Scene / Renderer / ColorLoad / ExternalTexturePlacement for the present pass.
netrender = { git = "https://github.com/mark-ik/netrender.git", branch = "main", features = ["serde"] }
# Favicon PNG encoding for the orrery-as-element gnodes: RGBA -> PNG bytes -> a
# `data:` URI <img> the gnode carries (genet decodes it). Already resolved in the
# workspace via genet's image decoder, so this only exposes the built crate to
# encode (favicons + snapshot cards). The decode features (jpeg/gif/bmp on top of png)
# back the drag-and-drop sprite import — a dropped image decoded to a face. (Phase 2 / P2 sprite.)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp"] }
# Host text-into-scene path: parley shapes a single line; netrender_text lowers
# the parley Layout into the same netrender::Scene the host draws rects into. Used
# for the session-switcher tile labels (the textless-switcher deferral) and session
# rename display. Same parley 0.10 pin as document-canvas, so the Layout type unifies.
parley = { workspace = true }
# Rebuilds document-canvas FontTable sidecars in the transferable content-update
# wire form; this is the Blob type parley's FontData uses.
linebender_resource_handle = "0.1"
netrender_text = { git = "https://github.com/mark-ik/netrender.git", branch = "main" }
# The `LayoutDom` trait: `document()` + `element_name` / `dom_children` to walk
# and measure the chrome band (toolbar split + click-region gate). ScriptedDom
# implements it; same cross-repo path as xilem-serval.
layout_dom_api = { package = "layout-dom-api", git = "https://github.com/mark-ik/genet.git", branch = "main" }

# Shared genet-on-winit present plumbing (SurfaceHost: boot / resize / rasterize
# / acquire, + winit->genet key & modifier mapping), shared with the orrery host.
genet-winit-host = { git = "https://github.com/mark-ik/genet.git", branch = "main" }

# The content-card pipeline: a focused node's media as a document. inker supplies
# the portable EngineDocument model; document-canvas lays it out (parley) and,
# behind its `netrender` feature, lowers it to a netrender::Scene the host
# composites as a floating card over the orrery. (Modular integration plan, S2.)
inker = { workspace = true }
document-canvas = { workspace = true, features = ["netrender"] }

# The omnibar command shell's rhai lane. meerkat reuses `script-rhai::base_engine`
# (the shared sandbox config) and layers the `Command`-verb + graph-query bindings
# on top: the privileged tier of the two-tier trust model (the note lane stays
# binding-free). See the omnibar_command_shell_plan.
script-rhai = { workspace = true }

# The DocumentScript component host (P2.5c): a wasm `document-core` component
# attached to a content tile mutates the page's mirrored `ScriptedDom` through a
# capability-scoped contract, guarded by epoch + StoreLimits. The content actor
# drives it via `meerkat::content::script`. Intra-workspace path dep (not yet in
# [workspace.dependencies]); pulls wasmtime, hence the 1.93 toolchain.
document-host = { path = "../script/document-host" }

# The composed graph library: a fetched JSON-LD document (or JSON-LD embedded
# in HTML) merges into the session graph, and the graph projections feed host
# views. This is the extraction seam: the browser reaches graph truth through
# `mere`, not its constituent graph crates.
mere = { workspace = true, features = ["query"] }

# The actor-kernel runtime: the !Send host-kernel boundary + the Send actor
# harness. meerkat's I/O subsystems (fetch, ...) are expressed as armillary
# actors; the kernel context is pinned to the UI thread by type.
armillary = { workspace = true }
fetch = { workspace = true }
# The inference-provider seam + armillary inference actor (burn brief Lane 3).
# `actor`-only here: light (armillary + the CannedProvider stub, no burn). The
# `local-inference` meerkat feature adds `infer/decoder-wgpu` for real models.
infer = { workspace = true, features = ["actor"] }
# Content-embedding graph arrangement (burn brief Lane 5, P4). Optional — only the
# `content-affinity` feature compiles it. embed's default is pure-Rust (the lexical
# feature-hashing provider), so this stays burn-free until a later `semantic-
# embeddings` feature adds `embed/bert`.
embed = { workspace = true, optional = true }
content-contract = { workspace = true }
crawl = { workspace = true }
import = { workspace = true }

# Tiled-workbench composition (S4): forme owns the geometry-free arrangement
# (a graph of tile / member intents); platen projects it into a WorkbenchPlan,
# which `Workbench::to_tile_tree` hands to pelt's `TileSurface` to render. meerkat
# holds the open tiles, drives the projection, and resolves each tile's member UUID
# to a node URL against the session graph. The orrery is that same arrangement's
# Cartography projection; the tiled mode is its Tree projection.
# The frame tree: the window-level pane arranger (FrameLayout = split tree of
# resizable panes). meerkat hosts the graph pane plus summoned sibling panes
# (roster now; gloss / inspector / apparatus later) as frame leaves, computing
# each leaf's rect from the split ratios (the frame crate is geometry-free).
frame = { workspace = true }

# Pelt's tile-tree contract + the GPU-free tile surface (V6): meerkat hosts the
# standalone pelt `TileSurface` as its workbench pane, driven entirely through the
# contract (`Workbench::to_tile_tree` projects forme's tiling onto it). The
# `tile-surface` feature is the GPU-free surface only — `default-features = false`
# keeps pelt's reference-shell windowing (genet-winit-host / wgpu present stack)
# out; meerkat brings its own. `pelt-core` is the zero-dependency contract leaf.
pelt-core = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
pelt-desktop = { git = "https://github.com/mark-ik/genet.git", branch = "main", default-features = false, features = ["tile-surface"] }
# Boa JS engine for the `scripted` rung (the `ScriptedDocument<BoaEngine>` the content
# actor drives). Optional — only the `scripted` feature pulls it, so the base build
# links no JS engine. Pure Rust, all targets.
script-engine-api = { git = "https://github.com/mark-ik/genet.git", branch = "main", optional = true }
genet-documents = { git = "https://github.com/mark-ik/genet.git", branch = "main", optional = true }
script-engine-boa = { git = "https://github.com/mark-ik/genet.git", branch = "main", optional = true }
# Optional Nova JS engine for the `scripted-nova` rung.
script-engine-nova = { git = "https://github.com/mark-ik/genet.git", branch = "main", optional = true }

# Off-UI-thread fetch (S2.2b): netfetcher's async WHATWG Fetch runs on a tokio
# worker pool; results are delivered back to the winit loop over a channel + an
# EventLoopProxy wake. `url` builds the request. netfetcher is a sibling repo
# consumed one-way; a **git dep** (not a path dep) like netrender / errand, so any
# machine pulls just mere and Cargo fetches it from GitHub — no `../../../netfetcher`
# layout to replicate. A local checkout is picked up via the gitignored
# `.cargo/config.toml` `paths` override. Network I/O is the host's job — engines
# stay byte-consuming and never link netfetcher.
netfetcher = { git = "https://github.com/mark-ik/netfetcher.git", branch = "main" }
# Small-web (smolweb) transport: gemini / gopher / finger / spartan / nex / guppy
# / titan, routed by scheme. A standalone, crates.io-only sibling crate consumed
# one-way; a **git dep** (not a path dep) so any machine pulls just mere and Cargo
# fetches errand from GitHub — no `../../../errand` layout to replicate. The fetch
# actor routes http(s) -> netfetcher and smolweb schemes -> errand.
errand = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
# Construct `errand::ClientIdentity` (CertificateDer / PrivateKeyDer) from the
# misfin cert's DER bytes for the misfin send path. Same crate rustls re-exports
# as `rustls::pki_types`, so it unifies with errand's rustls 0.23.
rustls-pki-types = "1"
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "io-util", "sync"] }

# ─── P2P sync (S5.0 foundation) ──────────────────────────────────────────────
# The host stands up one p2panda transport and drives a tessera moot's LogSync
# session, surfacing real sync status in the chrome. The sync subsystem mirrors
# the netfetcher seam (background tokio work -> mpsc channel -> EventLoopProxy
# wake -> user_event drain) — see the host p2p wiring plan. `transport` is the
# P2pandaTransport adapter + the shared `SyncedSpace` drain; `moothold` supplies
# the tessera store + fold + `verify`; `identity` the (ephemeral) signing keypair.
# After the sibling-posture purity split moothold owns no p2panda-net, so the
# host builds the `LogSync` pump directly — hence the p2panda-net / p2panda-core
# deps here.
identity = { workspace = true }
murm-replication = { workspace = true }
transport = { workspace = true }
moothold = { workspace = true }
p2panda-net = "0.6.1"
p2panda-core = "0.6.1"

# Shell-chrome theme tokens (theming pass): the toolbar / omnibar / palette /
# pane palette comes from a resolved `ChromeTheme` rather than hardcoded CSS, so
# the chrome theme-switches alongside the graph chrome. The registry also seeds
# the graph-node + edge tokens; meerkat consumes the chrome half for now.
register-theme = { workspace = true }
# Mod loader: meerkat reads installed wasm-mod manifests under `<mere_root>/mods/`
# to derive DocumentScript auto-attach bindings (the "installed extension" form).
# Path dep (not in workspace.dependencies), matching document-host's use.
register-mod-loader = { path = "../system/registry/register-mod-loader" }
# Portable UX event/probe taxonomy. meerkat records pane/theme events into its
# host-local Apparatus observability cache through this seam.
ux-events = { workspace = true }
# Diagnostics channel registry and portable emit scaffold. meerkat uses the
# descriptor/invariant layer to classify Apparatus records.
register-diagnostics = { workspace = true }
# Internal a11y/automation tree projection and AccessKit-shaped audit. The OS
# bridge stays separate; this is only the host-local snapshot Apparatus reads.
uxtree = { workspace = true }
accesskit = { workspace = true }
raw-window-handle = { workspace = true }

# Content engines for the card (S2.2b-ii): nematic's document engines (markdown /
# gemtext / plain text / feeds / …) turn fetched bytes into an EngineDocument,
# routed by content-type. HTML rides the genet lane instead (set_inner_html →
# scene_from_scripted_dom via the host-owned genet_render glue).
nematic = { workspace = true }

# Session persistence (S3): the session graph survives restart as graph.json via
# session-runtime's session_graph_store; dirs resolves the per-user data dir.
session-runtime = { workspace = true }
dirs = "6"
# Durable content cache (S3.2c): fetched pages + subresources persist through an
# eidetic fjall store under the session dir, so a reload shows them without
# re-fetching. pollster drives the async Store calls to completion on the UI
# thread (the fjall backend's futures are ready, so this does not block on I/O).
eidetic = { workspace = true }
eidetic-fjall = { workspace = true }
# The lexical trail index (tantivy): meerkat rebuilds it from the browsing-trace
# corpus + page text to answer the `>recall` omnibar query. (Capture plan C5.)
eidetic-search = { workspace = true }
pollster = "0.4"

# Windowing + present (mirrors pelt-live's bin deps; mere's pins align with
# genet's, so the wgpu 29 / winit 0.30 surface + netrender Renderer unify).
winit = { workspace = true }
wgpu = { version = "29", default-features = false, features = ["std", "wgsl"] }
# System clipboard for the omnibar / command-palette Ctrl(Cmd)+C/X/V, the same
# crate pelt-live's bin uses for its genet text field.
arboard = "3"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustc-hash = "2.1.2"
# Auto-derived enum metadata: `Command::COUNT` sizes `Command::ALL` so adding a
# command needs no manual count bump (and a missing one is a compile error).
strum = { version = "0.28", features = ["derive"] }
# User / mod theme files (serde ThemeDef JSON in <mere_root>/themes/).
serde_json = { workspace = true }
# Durable cookie-jar records persisted to eidetic (native session store).
serde = { workspace = true }
hex = "0.4"
# Transferable content-update envelope; scenes themselves use netrender's
# postcard encoder, but the update wrapper needs its own flat byte envelope.
postcard = { version = "1", features = ["alloc"] }
# Seed colour manipulation for the in-app theme editor (HSL nudges on seeds). The
# perceptual syntax palette now derives inside xilem-serval's `highlight` feature
# (illume + tinct), so meerkat no longer maps kinds to roles itself.
tincture = { workspace = true }
# illume's container tree for structural editor ops (expand-selection to the enclosing
# djot container). This is host editing logic, distinct from the highlight bridge that
# lives in xilem-serval's `highlight` feature.
illume = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
# Unique ids for forked user themes.
uuid = { workspace = true }

[target.'cfg(windows)'.dependencies]
accesskit_windows = { workspace = true }
# The compatibility-view tile (scrying tile plan X1): the WebView2 composition
# producer + the native-frame wgpu importer. A standalone sibling repo consumed
# one-way, like netrender; the host builds the producer (it owns the HWND,
# device, and profile dir the engine seam says the engine can't fabricate). A
# **git dep** (not a path dep) so a bare clone builds without the `../../../wgpu-scry`
# sibling layout; a local checkout is picked up via the gitignored
# `.cargo/config.toml` `paths` override.
scrying = { git = "https://github.com/mark-ik/wgpu-scry.git", branch = "main", optional = true }
scrying-engine = { workspace = true, optional = true }
grafting = { git = "https://github.com/mark-ik/wgpu-graft.git", branch = "main", default-features = false, features = ["wgpu-29"], optional = true }
dpi = { workspace = true, optional = true }

# The verso compatibility-view flip: when a node is pinned genet -> scrying.web,
# the host captures the donor's place/session (verso-api's PortableViewState) and the
# scrying pool drives verso-scry's forward-inject state machine over its producer so
# the WebView loads carried, not blank. verso-api is the engine-agnostic contract;
# verso-scry is the black-box receiver (host implements its `ScrySurface` seam here).
verso-tile = { git = "https://github.com/mark-ik/genet.git", branch = "main" }

[target.'cfg(target_os = "macos")'.dependencies]
accesskit_macos = { workspace = true }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
accesskit_unix = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
meerkat-browser-worker = { workspace = true }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "ErrorEvent", "MessageEvent", "Worker"] }

[dev-dependencies]
mere = { workspace = true, features = ["fixtures"] }
# Workbench-composition tests mint graph-member ids (kernel node UUIDs) and
# build small session graphs to resolve tiles against.
uuid = { workspace = true }
# Mod-binding tests stage a throwaway `<mere_root>/mods/` dir of wasm fixtures.
tempfile = "3"
# Graphlet-derivation tests build small kernel graphs (nodes need a layout position).
euclid = "0.22"

[lints]
workspace = true
