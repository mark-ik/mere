[package]
name = "mere-forme"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# Publishable from 2026-08-14, in pandect's dependency closure. The
# mere- prefix is long-standing: bare `forme` is an HTML template engine.
publish = true
description = "Per-graph-view workbench arrangement authority for Mere — projects graph members + edges into a workbench arrangement (tree-shaped or otherwise)"

[features]
default = []
petgraph = ["dep:petgraph"]
# Native on-disk persistence of `FormeDocument`s (the `store` module).
# Off by default so forme stays portable-by-default (wasm consumers don't
# pull `std::fs` paths); the native host enables it. `serde_json` is already
# a base dep, so this gates only the module.
store = []

# The crates.io name is `mere-forme` (the bare `forme` is owned by someone
# else), but the LIB stays `forme`, so every `use forme::...` in the tree is
# untouched and this rename never reaches the code.
[lib]
name = "forme"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Match the workspace's taffy: stylo_taffy (via genet-layout) hard-pins this
# exact pre-release, and cargo unifies one taffy per 0.11.x slot, so forme tracks
# the same version rather than lagging at 0.7. It carries the stable-0.11 struct
# `Dimension` API. Revisit when stylo_taffy ships against stable taffy 0.11.0.
taffy = "=0.11.0-experimental-cache-fix.3"
petgraph = { version = "0.8", features = ["serde-1"], optional = true }
# Forme + graph-member ids are UUID-backed (kernel's stable node id and
# `GraphId` are both UUIDs). forme stays framework-free — it holds ids;
# the host resolves them against the kernel graph.
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
kernel = { workspace = true, features = ["fixtures"] }
serde_json = "1.0"
proptest = "1.11"
