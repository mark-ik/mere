[package]
name = "stickleback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A shared replicated-space runtime for signed peer domains: joined p2panda spaces and their drain, policy-before-insert operation processing, muniment-backed storage, retention checkpoints, and native drop carriage. The domain supplies its own grammar, addressing, and authorization."
readme = "README.md"
keywords = ["p2p", "replication", "local-first", "sync"]
categories = ["network-programming", "database"]

[lib]
path = "src/lib.rs"

[dependencies]
muniment.workspace = true
p2panda-core = "0.7.0"
p2panda-net = "0.7.0"
p2panda-store = { version = "0.7.0", default-features = false }
p2panda-sync = "0.7.0"
hex = "0.4"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
proofs.workspace = true
tokio = { version = "1", features = ["rt", "time"] }
tokio-stream = "0.1"
thiserror = "1"

[dev-dependencies]
pollster = "0.4"
p2panda-stream = { version = "0.7.0", default-features = false, features = ["log_prune"] }
