[package]
name = "stickleback"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "A shared replicated-space runtime for signed peer domains: joined p2panda spaces and their drain, policy-before-insert operation processing, muniment-backed storage, retention checkpoints, and native drop carriage. The domain supplies its own grammar, addressing, and authorization."
readme = "README.md"
keywords = ["p2p", "replication", "local-first", "sync"]
categories = ["network-programming", "database"]

[lib]
path = "src/lib.rs"

[dependencies]
identity.workspace = true
muniment.workspace = true
p2panda-core = "0.7.0"
p2panda-encryption = { version = "0.7.0", features = ["data_scheme", "message_scheme"] }
# Every p2panda-net feature except `sqlite`. The address book runs on
# stickleback's muniment-backed store, so p2panda-store's bundled SQLite
# backend (and sqlx with it) stays out of the graph entirely. Feature
# unification means EVERY consumer has to opt out, not just one.
p2panda-net = { version = "0.7.0", default-features = false, features = [
  "address_book",
  "iroh_endpoint",
  "iroh_mdns",
  "discovery",
  "gossip",
  "sync",
] }
p2panda-store = { version = "0.7.0", default-features = false }
p2panda-sync = "0.7.0"
hex = "0.4"
blake3 = "1.5"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
proofs.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time"] }
tokio-stream = "0.1"
thiserror = "1"

[dev-dependencies]
pollster = "0.4"
p2panda-stream = { version = "0.7.0", default-features = false, features = ["log_prune"] }
tempfile = "3"
