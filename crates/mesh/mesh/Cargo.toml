[package]
name = "mere-mesh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "The personal-space compute mesh: signed job operations over the LogSync event-DAG, a deterministic job board, and the worker loop. Resource-coordination milestone 1 (own devices, no economy)."

[lib]
name = "mesh"
path = "src/lib.rs"

[dependencies]
# The operation/signing substrate the job ops ride (the same signed
# Operation<Ext> wire as tessera and murm posts; mirrors gemot's pin).
p2panda-core = "0.7.0"
# Persona-derived signing keys (the same identity flow tessera's wire uses).
identity = { workspace = true }
serde = { version = "1", features = ["derive"] }
thiserror = "1"
blake3 = "1.5"
proofs.workspace = true
# The three sync traits LogSync reconciles against (`LogStore` + `TopicStore`,
# plus `OperationStore`). Default features off: the mesh brings muniment through
# `stickleback`'s `MunimentStore`, not p2panda-store's bundled SQLite
# backend. (This said "the mooting adapter" until 2026-07-26; mooting stopped
# being a mesh dependency when the shared store moved to stickleback.)
p2panda-store = { version = "0.7.0", default-features = false }
# Shared muniment-backed store and LogSync drain.
stickleback = { workspace = true }
muniment = { path = "../../eidetic/muniment", features = ["redb"] }
# The sync lane (`sync::SyncedMesh`): `stickleback::JoinedSpace` over the
# store. `p2panda-net` stays for the `Endpoint`/`Gossip` the host injects
# (endpoint-decoupled), so the lib never builds a `P2pandaTransport`.
# `p2panda-sync`'s event types belong to the drain now, so mesh stopped
# referencing them and the dependency was dropped 2026-07-26. `rt` runs the
# session, `time` bounds the manual `resync`.
p2panda-net = "0.7.0"
tokio = { version = "1", features = ["rt", "time"] }
# The embedding behaviour behind `esp.embed.lexical/v1`. Default features: the
# lexical provider is pure Rust, so the mesh pulls in no Burn, GPU, weights, or
# tokenizer assets to ship its first useful resource.
esp = { workspace = true }

[dev-dependencies]
# `transport` builds the real p2panda-net peers for
# the two-peer convergence test and the `mesh-peer` example bin. `macros` +
# `rt-multi-thread` run the async tests; `io-std`/`io-util` read pasted peer
# tickets in the example; tempfile backs the file-store reopen test.
transport = { workspace = true }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "io-std", "io-util"] }
tempfile = "3"
