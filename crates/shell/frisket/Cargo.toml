[package]
name = "frisket"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "The pane model for Mere: a savable tree of resizable panes, projected into uxtree. A frisket is the press frame whose cut-out apertures decide what prints where."
documentation = "https://docs.rs/frisket"
readme = "README.md"
keywords = ["pane", "layout", "tiling", "mere", "uxtree"]
categories = ["accessibility", "gui"]

[lib]
path = "src/lib.rs"

[dependencies]
accesskit.workspace = true
incipit.workspace = true
serde.workspace = true
tracing.workspace = true
uuid.workspace = true
uxtree.workspace = true

[dev-dependencies]
serde_json = "1"
