[package]
name = "workbench"
version = "0.1.0"
authors.workspace = true
license = "MPL-2.0"
edition.workspace = true
# Inline: genet's workspace supplied this and mere's does not. The value is
# genet's 1.86.0, unchanged — the move is not an MSRV decision.
rust-version = "1.86.0"
repository.workspace = true
description = "Reusable split-and-tab workspace organization for Genet hosts."
keywords = ["genet", "workspace", "tabs", "split", "gui"]
categories = ["gui"]
publish = true

[lib]
path = "lib.rs"
bench = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)', 'cfg(llvm_pgo)'] }
