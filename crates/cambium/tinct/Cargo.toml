[package]
name = "tinct"
version = "0.1.2"
edition = "2024"
description = "Perceptual (OKLCH) seed-to-palette derivation, plus a contrast-gated syntax-highlight palette, for the Merely family (Woodshed, Hocket, Mere). A theme is a few seed colours; the full palette is derived."
license = "MPL-2.0"
# Landed in mere 2026-09-03 (platform boundary plan, P3). Inherited now:
# mere's workspace repository is this crate's home, where genet's pointed
# at upstream servo, which is why these lines were spelled out before.
repository.workspace = true
keywords = ["color", "theme", "palette", "oklch", "design-tokens"]
categories = ["gui", "graphics"]

[dependencies]
serde = { version = "1", features = ["derive"] }
