[package]
name = "scenomise"
version = "0.0.4"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Choreography for the scenograph projection engine: placement algorithms that realize persisted scores into arranged scenes."
readme = "../README.md"
keywords = ["layout", "projection", "scene", "graph"]
categories = ["visualization", "algorithms"]

[dependencies]
sceno = { version = "0.0.4", path = "../sceno" }
# The registry's capability records serialize, and a custom arrangement's
# config is the opaque `serde_json::Value` the score already carries.
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
