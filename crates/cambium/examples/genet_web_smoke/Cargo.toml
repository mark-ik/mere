[package]
name = "genet-web-smoke"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone project — intentionally NOT a workspace member, in mere as it was
# in genet (it carries its own `[workspace]` and `[patch]` tables, and
# `cargo check --workspace` does not cover it). Proves the genet engine core
# renders in a browser: cambium view tree -> ScriptedDom ->
# Livery + Buckram -> PaintList -> paint_list_render -> netrender ->
# WebGPU canvas surface. No Servo shell, no winit, no JS engine.
#
# Build (from genet/ root):
#   cargo build --manifest-path examples/genet_web_smoke/Cargo.toml --target wasm32-unknown-unknown
#   wasm-bindgen --target web --out-dir examples/genet_web_smoke/pkg \
#     examples/genet_web_smoke/target/wasm32-unknown-unknown/debug/genet_web_smoke.wasm
#   python -m http.server -d examples/genet_web_smoke 8000
# then open http://localhost:8000 in a WebGPU browser (Chrome/Edge).
#
# netrender crates come from merely-made/netrender git (converted from the
# first receipt's sibling path deps once the per-target-webgpu commit
# landed on main, per the netrender_smoke pattern).

[lib]
name = "genet_web_smoke"
crate-type = ["cdylib"]
path = "src/lib.rs"

[workspace]

[dependencies]
# View layer. Cambium landed in mere on 2026-09-03 under the platform boundary
# plan (P2), and this example came with it, so `cambium` is a plain relative
# path inside this repository again — no sibling checkout needed. Cambium
# declares genet-scripted-dom by version; the patch below pulls that registry
# edge onto the same genet revision so the ScriptedDom and observable
# contracts unify with genet-livery's graph.
cambium = { path = "../../cambium" }

# genet engine core. These were relative paths into genet's `components/`;
# from mere they are git pins at the revision every genet.git pin in this
# repository names.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "d424a689518a53e38d4c6f89c5c792bebb439248" }
genet-livery = { git = "https://github.com/merely-made/genet.git", rev = "d424a689518a53e38d4c6f89c5c792bebb439248" }

# rasterizer stack — git deps matching the genet workspace's own
# netrender source, so paint_list_api unifies with genet-livery's copy
# (the per-target-webgpu commit is on main; the netrender_smoke pattern).
netrender = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
netrender_device = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_api = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }
paint_list_render = { git = "https://github.com/merely-made/netrender.git", rev = "6f1a4fe70a58a57ba6b248acfa662f0ec4e44a25" }

wgpu = { version = "30", default-features = false, features = ["std", "wgsl", "webgpu"] }

# Web glue. Keep wasm-bindgen exact so its generated schema stays deliberate.
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "console",
] }
console_error_panic_hook = "0.1"

# Mirrors the genet workspace [patch.crates-io] entries this dependency
# graph needs (patches are per-workspace-root, and this example is its
# own workspace). Same rationale comments as genet/Cargo.toml. Each was a path
# into genet's checkout and is now a git pin at the same revision; cargo finds
# `genet-taffy` and `sonic-rs` by package name anywhere in that repository.
[patch.crates-io]
# Keep the standalone smoke on this checkout's current scripted-DOM and
# render-neutral DOM contracts instead of a previously published graph.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", rev = "d424a689518a53e38d4c6f89c5c792bebb439248" }
layout-dom-api = { git = "https://github.com/merely-made/genet.git", rev = "d424a689518a53e38d4c6f89c5c792bebb439248" }
# Published Genet Taffy fork, locally patched to this checkout for smoke builds.
genet-taffy = { git = "https://github.com/merely-made/genet.git", rev = "d424a689518a53e38d4c6f89c5c792bebb439248" }
# ahash runtime-rng/getrandom-0.3 drop for the wasm graph.
sonic-rs = { git = "https://github.com/merely-made/genet.git", rev = "d424a689518a53e38d4c6f89c5c792bebb439248" }
# netrender pulls vello, and upstream vello 0.10 still requires wgpu 29.
vello = { git = "https://github.com/mark-ik/vello.git", tag = "vello-0.10.0" }
