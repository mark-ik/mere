[package]
name = "cartography"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Non-destructive projection layer for Mere — contracts between graph truth + intelligence signals on the input side and canvas swatches on the output side. Owns LayoutStrategy trait, Projection/Overlay/MinimapDescriptor types, and the narrow IntelligenceSignals shape that firewalls cartography from intelligence-embeddings internals."
documentation = "https://docs.rs/cartography"
readme = "README.md"
keywords = ["cartography", "graph", "layout", "projection", "browser"]
categories = ["graphics", "rendering"]

[lib]
path = "src/lib.rs"

[features]
default = []
# Cartography-side `LayoutStrategy` / `StreamingLayoutStrategy`
# adapters that wrap `graph-canvas`'s existing `Layout<N>` impls
# (ForceDirected today; more as the bridge proves out). Off by default
# because contract consumers may want cartography without pulling in
# the whole graph-canvas crate; the adapters live here (rather than in
# graph-canvas) to keep the dependency edge one-way and avoid the
# `mere-kernel → graph-canvas → ??? → mere-kernel` cycle the kernel's
# legacy graph-canvas dependency would otherwise create.
graph-canvas-adapters = ["dep:graph-canvas", "dep:euclid"]

[dependencies]
euclid = { version = "0.22", features = ["serde"], optional = true }
graph-canvas = { path = "../graph/graph-canvas", optional = true }
mere-kernel = { path = "../mere-kernel" }
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
uuid = { version = "1.10", features = ["v4"] }
