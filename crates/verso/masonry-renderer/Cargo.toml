[package]
name = "mere-masonry"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/mere"
description = "Mere-substrate driver for the Masonry widget engine. Renderer-registry tenant for `NodeContentKind::Panel` nodes."
publish = false
rust-version = "1.92.0"

# This crate is excluded from the parent mere workspace because it depends on
# upstream xilem via path deps to a local clone (which is outside the workspace
# tree). When xilem stabilises (post-1.0), switch to crates.io deps and join
# the workspace.

[dependencies]
register-renderer = { path = "../../graphshell/shell/system/registry/register-renderer" }

# Upstream Linebender stack — driven by this crate, not modified.
# Path deps to the local xilem clone for development convenience; switch to
# crates.io versions once xilem stabilises (it's pre-1.0 today).
masonry_core = { path = "../../../../xilem/masonry_core" }

# All load-bearing deps declared directly — no transitive resolution
# through mere-renderer-registry's re-exports. Pinned to match the mere
# workspace's [workspace.dependencies] versions even though this crate
# is excluded (path-deps on xilem keep it out of the workspace tree).
vello = "0.9"
wgpu = "29"
kurbo = "0.13"
accesskit = "0.24"
ui-events = "0.3"
dpi = "0.1.2"

# `imaging_vello` GPU backend. As of the imaging fork at
# `../../../imaging` (branch `mere-wgpu-29-vello-0-9`) and the xilem
# workspace pin bump to wgpu 29 + vello 0.9 + parley 0.9, the GPU path
# aligns with mere's workspace versions — no skew. masonry renders
# directly into a wgpu 29 `Texture` via `texture_render::Renderer`;
# the host registers that texture with vello 0.9 via `register_texture`.
masonry_imaging = { path = "../../../../xilem/masonry_imaging", default-features = false, features = ["imaging_vello"] }

[dev-dependencies]
# Headless wgpu boot for the integration tests.
pollster = "0.4"
# `ModularWidget` — a builder-style stub widget that satisfies the
# `Widget` trait without us writing one from scratch.
masonry_testing = { path = "../../../../xilem/masonry_testing" }
# Cross-crate integration test exercises SubstrateHost +
# ExternalTextureCompositor + MasonryEmbeddedRenderer end-to-end.
spatial-substrate = { path = "../../graphshell/graph/spatial-substrate" }
