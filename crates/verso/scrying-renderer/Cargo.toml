[package]
name = "scrying-embedded-renderer"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
rust-version = "1.92.0"
description = "EmbeddedFrameRenderer impl for `mere-renderer-registry` backed by `scrying`'s system-WebView producers. Per the spatial-chrome modular adoption plan §Phase 4, this is the consolidation point where Mere's substrate composes web content via scrying's `WgpuTextureImporter` + `NativeFrame` path — same wgpu 29 universe as the host's vello renderer."

[lib]
path = "src/lib.rs"

[dependencies]
register-renderer.workspace = true
scrying = { path = "../../../../wgpu-scry/scrying" }

wgpu.workspace = true

[dev-dependencies]
# Test stubs use kurbo::Size for SceneNodeRef construction; production
# code names sizes via mere_renderer_registry's re-export of kurbo.
kurbo.workspace = true
# Headless wgpu boot for the lifecycle tests.
pollster = "0.4"

[lints]
workspace = true
