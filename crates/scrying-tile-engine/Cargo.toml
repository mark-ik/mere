[package]
name = "scrying-tile-engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "inker SurfaceEngine implementation backed by the scrying system-WebView producer (WebView2 / WKWebView / WebKitGTK)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
inker = { path = "../inker" }
scrying = { path = "../../../scrying/scrying" }
# `PhysicalSize` for scrying's `resize` signature — scrying uses `dpi` and
# doesn't re-export the type, so we depend on the same version.
dpi = "0.1.2"
tracing = "0.1"
