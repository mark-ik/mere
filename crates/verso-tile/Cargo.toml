[package]
name = "verso-tile"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tile-rendering-surface management for the Mere browser — Verso brand layer that places engine output into GraphTree tiles."
keywords = ["tile", "rendering", "graph", "surface", "browser"]
categories = ["gui", "rendering"]

[lib]
path = "src/lib.rs"

[dependencies]
graphshell-core = { path = "../graphshell/core" }
serde = { version = "1.0", features = ["derive"] }
