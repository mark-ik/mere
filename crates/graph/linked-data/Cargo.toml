[package]
name = "linked-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JSON-LD export/import bridge between the Mere graph kernel and linked data."
documentation = "https://docs.rs/linked-data"
keywords = ["json-ld", "rdf", "linked-data", "graph", "semantic-web"]
categories = ["web-programming", "data-structures"]

[lib]
path = "src/lib.rs"

[features]
default = ["bundled-contexts"]
# Vendored standard-vocabulary JSON-LD contexts (schema.org, ActivityStreams 2.0,
# plus a small Mere-authored Dublin Core context; ~220 KB) so an arbitrary remote
# `@context` resolves offline via `ContextCache::full()`. Disable for a slimmer
# binary — `full()` then equals `minimal()`. See `assets/NOTICE` for licensing.
bundled-contexts = []
# SPARQL query over the graph via an in-memory Oxigraph store (no RocksDB, so it
# stays wasm-viable). Off by default: base linked-data stays slim, only consumers
# that want SPARQL pull Oxigraph.
query = ["dep:oxigraph"]

[dependencies]
kernel.workspace = true
serde_json.workspace = true
oxjsonld = "0.2"
oxrdf = "0.3"
oxigraph = { version = "0.5", default-features = false, optional = true }
