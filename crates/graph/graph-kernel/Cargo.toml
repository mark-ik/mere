[package]
name = "mere-kernel"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MIT OR Apache-2.0"
edition = "2024"
# Publishable from 2026-08-14: pandect (now pandect) is going to
# crates.io and this is in its dependency closure. Bare `kernel` belongs to
# a stranger (Abstract Reactive Streams), hence the mere- prefix.
publish = true
rust-version = "1.92.0"
description = "Portable identity, authority, and mutation kernel for the Mere browser. Renamed from graphshell-core."

[features]
test-utils = []
# Test-fixture escape hatch: re-exposes the pub(crate) graph mutators through
# the `graph::fixtures::GraphFixtures` extension trait so test code can build
# sample graphs without routing through GraphDelta. Enable in dev-dependencies
# ONLY — a non-dev enable reopens the Phase 6.5 write-path boundary.
fixtures = []
# Native on-disk graph persistence (the `store` module: Graph <-> graph.json
# via GraphSnapshot). Off by default so the kernel stays portable-by-default;
# the native host enables it. serde_json is already a base dep.
store = []

[lib]
name = "kernel"
path = "src/lib.rs"

[dependencies]
# Navigation lineage over the substrate: stemma (the promoted, MIT/Apache lineage
# crate) is the kernel's visit-history authority, replacing the retired in-tree MPL
# node-lineage copy (all consumers migrated). stemma is node-lineage promoted
# near-verbatim (GraphMemory -> Stemma), so the nav model is unchanged. Git
# sibling; local checkout via the gitignored `.cargo/config.toml` patch.
# The portable field-primitive definitions (Field / Coupling / the scalar & vector
# field AST / EdgePath) that the kernel's field store and quint both consume.
# Promoted out of this kernel so the third graph primitive sits at the portable tier
# beside chartulary's nodes/edges. On crates.io; local checkout via the gitignored
# `.cargo/config.toml` `[patch.crates-io]`.
numen.workspace = true
forme.workspace = true
crossbeam-channel = "0.5"
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
rkyv = { version = "0.8", features = ["std"] }
time = { version = "0.3", features = ["formatting"] }
# Drop-in std::time replacement whose SystemTime::now() uses Date.now() in
# wasm32 browser hosts instead of the unsupported std implementation.
web-time = "1"
url = "2.5"
mime_guess = "2.0"
infer = "0.19"
petgraph = { version = "0.8.3", features = ["serde-1"] }
# v5 (SHA-1 name-based) is available on every target, including wasm — it needs
# no RNG, unlike v4 (native-only, below). Node ids derive from the URL via v5.
uuid = { version = "1", features = ["serde", "v5"] }
euclid = { version = "0.22", features = ["serde"] }
serde_json = "1.0"
accesskit = { workspace = true, features = ["serde"] }
# Enum derives (FromRepr / EnumIter) for the relation taxonomy's recognized
# core — replaces the hand-written ordinal mirror tables in edge_taxonomy.rs.
strum = { version = "0.28", features = ["derive"] }
# The generic container-graph substrate. mere's Node implements its capability
# traits (Identified / Addressed / Labeled), the first step of the graph re-base
# onto chartulary. Git sibling; local checkout via the gitignored
# `.cargo/config.toml` patch.
chartulary.workspace = true
# The append-only log primitive (codicil) and its store (muniment): mere's
# captured-delta stream persists as a codicil, the edit spine over the substrate
# (see graph/journal.rs). Both already build in the tree via chartulary; these are
# direct deps so the journal can name them. Git siblings; local checkouts via
# the gitignored `.cargo/config.toml` patches.
codicil.workspace = true
muniment.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
futures-util = { version = "0.3", features = ["std"] }
postcard = { version = "1", features = ["alloc"] }
# The dissolution-gate harness's open-map codec race (binary facet-sidecar
# candidates must be self-describing so unknown-forward foreign facets
# survive; the race answers whether the codec or the shape is the cost).
ciborium = "0.2"
cbor4ii = { version = "1.2", features = ["serde1", "use_alloc"] }
rmp-serde = "1.3"
minicbor-serde = { version = "0.7", features = ["std"] }
tempfile = "3"
# Block on the journal's async muniment save/load in tests (matches the substrate
# crates' test harness).
pollster = "0.4"
