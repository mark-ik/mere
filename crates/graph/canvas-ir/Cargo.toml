[package]
name = "canvas-ir"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Portable canvas scene IR for the Mere graph view: scene input, camera/viewport, projection, render packets, and scene-object ids/hit-shapes. The dependency-light data model shared by graph-layout and platen (extracted from graph-canvas, which is retired)."

[dependencies]
# Field ids referenced by the scene/packet model; aether is the standalone
# field-algebra crate (kernel-free).
aether.workspace = true
euclid = { version = "0.22", features = ["serde"] }
kernel.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
serde_json = "1.0"
