[package]
name = "graphshell-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport-independent local curation state for Graphshell."

[dependencies]
chirograph.workspace = true
sceno.workspace = true
uxtree = { workspace = true, optional = true }
accesskit = { workspace = true, optional = true }
scenotime.workspace = true
serde.workspace = true
serde_json.workspace = true

[features]
# Off by default: a client that only reads scenes should not carry an
# accessibility tree builder. Hosts that drive a screen reader turn it on.
accesskit = ["dep:uxtree", "dep:accesskit"]

[dev-dependencies]
# Test-only: lets the frozen-realization tests solve the real coastal-map
# fixture rather than assert against a hand-built stand-in.
scenomise.workspace = true
serde_json = "1"
# Test-only: parse the rendered markup back into a real tree, so the frozen
# realization is proven to be a DOM a host can traverse, not a hopeful string.
genet-scripted-dom = { git = "https://github.com/merely-made/genet.git", branch = "main" }
layout_dom_api = { package = "layout-dom-api", git = "https://github.com/merely-made/genet.git", branch = "main" }
