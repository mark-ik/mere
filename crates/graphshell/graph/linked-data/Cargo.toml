[package]
name = "linked-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "JSON-LD export/import bridge between the Mere graph kernel and linked data."
documentation = "https://docs.rs/linked-data"
keywords = ["json-ld", "rdf", "linked-data", "graph", "semantic-web"]
categories = ["web-programming", "data-structures"]

[lib]
path = "src/lib.rs"

[features]
default = ["bundled-contexts"]
# Vendored standard-vocabulary JSON-LD contexts (currently schema.org, ~207 KB)
# so an arbitrary remote `@context` resolves offline via `ContextCache::full()`.
# Disable for a slimmer binary — `full()` then equals `minimal()`. The vendored
# assets are third-party / separately-licensed; see `assets/NOTICE`.
bundled-contexts = []

[dependencies]
kernel.workspace = true
serde_json.workspace = true
oxjsonld = "0.2"
oxrdf = "0.3"
