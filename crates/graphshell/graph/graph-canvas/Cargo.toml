[package]
name = "graph-canvas"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Framework-agnostic graph-view canvas: scene derivation, camera, projection, interaction, hit testing, and render-packet derivation for Graphshell"

[dependencies]
# The field algebra (FieldId etc.) extracted to its own crate; graph-canvas
# now consumes it rather than owning the `fields` module.
aether.workspace = true
euclid = { version = "0.22", features = ["serde"] }
kernel.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"

[dev-dependencies]
serde_json = "1.0"
