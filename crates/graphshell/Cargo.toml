[package]
name = "graphshell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable shell layer for the Mere browser — host GUI integration and Navigator surface."
documentation = "https://docs.rs/graphshell"
readme = "README.md"
keywords = ["shell", "gui", "navigator", "tiling", "browser"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
eidetic = { path = "../eidetic" }
graph-canvas = { path = "../graph/graph-canvas" }
node-lineage = { path = "../graph/node-lineage" }
forme = { path = "../graph/forme" }
mere-kernel = { path = "../mere-kernel" }
mere-host-contract = { path = "../mere-host-contract" }
inker = { path = "../inker" }
platen = { path = "../platen" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde"] }
verso-tile = { path = "../verso-tile" }

[dev-dependencies]
pollster = "0.4"
