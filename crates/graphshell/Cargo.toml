[package]
name = "graphshell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Portable graph + shell chrome facade for the Mere browser — graph authority, shell state, host ports, and Navigator-facing contracts."
documentation = "https://docs.rs/graphshell"
readme = "README.md"
keywords = ["shell", "gui", "navigator", "tiling", "browser"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
async-trait = "0.1"
eidetic.workspace = true
graph-canvas.workspace = true
node-lineage.workspace = true
forme.workspace = true
mere-kernel.workspace = true
mere-host-contract.workspace = true
inker.workspace = true
platen.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde"] }
verso-tile.workspace = true

[dev-dependencies]
pollster = "0.4"
