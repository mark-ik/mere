[package]
name = "graphshell"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable shell layer for the Mere browser — host GUI integration and Navigator surface."
keywords = ["shell", "gui", "navigator", "tiling", "browser"]
categories = ["gui"]

[lib]
path = "src/lib.rs"

[dependencies]
graph-canvas = { path = "../graph/graph-canvas" }
graph-memory = { path = "../graph/graph-memory" }
graph-tree = { path = "../graph/graph-tree" }
graphshell-core = { path = "../shell/graphshell-core" }
graphshell-runtime = { path = "../shell/graphshell-runtime" }
inker = { path = "../inker" }
platen = { path = "../platen" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1", features = ["serde"] }
