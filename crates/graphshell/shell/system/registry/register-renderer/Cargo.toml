[package]
name = "register-renderer"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
publish = false
description = "Trait + dispatch contract for renderers (mere-masonry, scrying-tile-engine, future serval/wry adapters) co-resident in Mere's spatial chrome IR substrate. Vello/wgpu-bound half of the contract; data-only types live in mere-renderer-registry-types so wasm32-clean consumers (mere-host-runtime) can use them without pulling vello/wgpu."
rust-version = "1.92.0"

[dependencies]
register-renderer-types.workspace = true
# All load-bearing pins live in mere/Cargo.toml's [workspace.dependencies].
kurbo.workspace = true
vello.workspace = true
wgpu.workspace = true
# `EmbeddedFrameRenderer::take_accesskit_subtree` returns
# `accesskit::TreeUpdate` so the substrate's `collect_accesskit_updates`
# can graft renderer-contributed sub-trees onto its scene-level tree.
accesskit.workspace = true

[lints]
workspace = true
