[package]
name = "session-runtime"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Portable graphshell session runtime state: session manifests, session graph/view sidecars, worker declarations, and compatibility re-exports for adjacent control-plane and verso state."

[dependencies]
frame.workspace = true
kernel.workspace = true
mere-identity.workspace = true
control-plane.workspace = true
verso-tile-state.workspace = true

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
# Tests construct sample graphs that need positions; mere-kernel
# exposes the petgraph-backed API expecting `euclid::Point2D`.
euclid = "0.22"
