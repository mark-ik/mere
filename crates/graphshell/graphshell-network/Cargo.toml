[package]
name = "graphshell-network"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Stream carrier for Graphshell endpoints reached across a connection."

[dependencies]
graphshell-protocol = { path = "../graphshell-protocol" }
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "rt", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util", "macros", "rt", "rt-multi-thread", "time"] }
