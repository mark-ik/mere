[package]
name = "mere-host"
version = "0.0.1"
authors = ["@mark-ik"]
license = "MPL-2.0"
edition = "2024"
publish = false
rust-version = "1.92.0"
description = "Mere xilem host — winit application binding the substrate scene, frametree projection, renderer chain (orrery / panel / splitter), and cartography projection into a runnable window. Replaces the prior gpui mere-host (2026-05-18 redirect)."

# Excluded from the parent mere workspace because it transitively
# depends on mere-masonry, which path-deps the local xilem clone
# (outside the workspace tree). When xilem stabilises (post-1.0),
# join the workspace; until then this crate stands alone like
# mere-masonry.

[[bin]]
name = "mere-host"
path = "src/main.rs"

[dependencies]
# Substrate ↔ runtime bridge — owns MereHostApp, sync_scene_from_frame_layout,
# pane/splitter/tile identity tracking, action bus, manifest store.
mere-host-substrate = { path = "../mere-host-substrate" }
# Durable state vocabulary + ActionKind/BusAction. MereHostApp re-exports
# what's needed for dispatch; we pull the runtime crate directly for
# the action-bus enum types the click handlers construct.
mere-host-runtime = { path = "../mere-host-runtime" }
# Frame layout types (FrameLayout, PaneContent, etc.) for the seed
# layout the host builds at startup.
mere-frame = { path = "../mere-domain/frame" }
# Substrate scene primitives (NodeContentKind, RendererRegistry traits,
# NodeIdentity) used by the orrery / splitter renderers.
mere-renderer-registry = { path = "../mere-renderer-registry" }
# Kernel graph + geometry — the host seeds a Graph at startup and
# stores it in its GraphRegistry for cartography projection.
mere-kernel = { path = "../mere-kernel" }
# Cartography contracts — ProjectionRequest / ViewIntent / Projection.
cartography = { path = "../cartography" }
# Strategy implementations (GridAdapter for the v0 orrery; force-
# directed / etc. as the renderer chain grows).
graph-layout = { path = "../graph/graph-layout" }
# EngineDocument shape for seeding workbench tiles.
inker = { path = "../inker" }

# Masonry renderer for `NodeContentKind::Panel` panes (workbench /
# gloss / apparatus). Pulls in the upstream xilem stack via mere-
# masonry's path-deps.
mere-masonry = { path = "../mere-masonry" }
masonry_core = { path = "../../../xilem/masonry_core" }
masonry_testing = { path = "../../../xilem/masonry_testing" }

# Windowing + GPU + paint stack.
winit = "0.30.13"
wgpu = "29"
vello = "0.9"
kurbo = "0.13"
pollster = "0.4"
# petgraph::NodeIndex constructor for tile-seeding.
petgraph = "0.8"

[dev-dependencies]
# Substrate primitives used by the moved renderer-module unit tests
# (orrery_renderer / splitter_renderer / graph_registry).
mere-spatial-prototype = { path = "../mere-spatial-prototype" }
