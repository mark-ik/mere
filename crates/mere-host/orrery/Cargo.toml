[package]
name = "mere-host-orrery"
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
description = "gpui renderer for mere's orrery pane — turns a mere-kernel Graph into a gpui element tree (v0: cards; full canvas viz later)."
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
euclid = "0.22"
gpui = { workspace = true }
graph-canvas = { path = "../../graph/graph-canvas" }
mere-kernel = { workspace = true }
platen = { workspace = true }
uuid = "1"
