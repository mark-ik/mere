[package]
name = "mere-workbench"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Workbench domain layer for the Mere browser — projects platen's WorkbenchProjection into uxtree nodes (a11y / automation tree)."
documentation = "https://docs.rs/mere-workbench"
readme = "README.md"
keywords = ["workbench", "mere", "domain", "accessibility", "uxtree"]
categories = ["accessibility", "gui"]

[lib]
path = "src/lib.rs"

[dependencies]
accesskit = "0.24"
platen = { path = "../../platen" }
tracing = "0.1"
uxtree = { path = "../../uxtree" }

[dev-dependencies]
mere-kernel = { path = "../../mere-kernel" }
uuid = "1"
verso-tile = { path = "../../verso-tile" }
