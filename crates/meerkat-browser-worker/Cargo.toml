[package]
name = "meerkat-browser-worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
rust-version = "1.92.0"
description = "Browser Worker bootstrap utilities for Meerkat's wasm-side worker seams."

[lib]
name = "meerkat_browser_worker"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["DedicatedWorkerGlobalScope", "ErrorEvent", "MessageEvent", "Worker", "WorkerOptions", "WorkerType"] }

[lints]
workspace = true
