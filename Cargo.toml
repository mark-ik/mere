[package]
name = "chartulary"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
description = "The generic content-addressed container graph (aka chart). Graph<N, E> on petgraph with capability traits (Identified, Addressed, ContentBearing, Labeled, Classified, Predicated) and default Container/Relation payloads. The substrate that binds muniment's blobs and codicil's log into an app-agnostic graph."
repository = "https://github.com/mark-ik/chartulary"
keywords = ["graph", "content-addressed", "knowledge-graph", "petgraph"]
categories = ["data-structures"]

[dependencies]
petgraph = { version = "0.8", features = ["serde-1"] }
serde = { version = "1", features = ["derive"] }
# For the content reference in ContentBearing (the blake3 Hash). default-features
# off so chartulary does not pull muniment's JSON/postcard codecs, only its Hash.
muniment = { path = "../muniment", default-features = false }
# The edit spine (G1): graph edits are a codicil log, persisted through muniment.
codicil = { path = "../codicil" }

[dev-dependencies]
pollster = "0.4"
serde_json = "1"
