[workspace]
resolver = "2"
members = [
    "crates/mere/app",
    "crates/meerkat",
    "crates/serval-winit-host",
    "crates/persona/identity",
    "crates/graphshell/graph/aether",
    "crates/graphshell/graph/gyre",
    "crates/graphshell/graph/cartography",
    "crates/graphshell/graph/graph-canvas",
    "crates/graphshell/graph/graph-kernel",
    "crates/graphshell/graph/graph-layout",
    "crates/graphshell/graph/linked-data",
    "crates/graphshell/graph/node-lineage",
    "crates/graphshell/graph/orrery",
    "crates/graphshell/shell/domain/chrome",
    "crates/graphshell/shell/domain/frame",
    "crates/graphshell/shell/session-runtime",
    "crates/graphshell/shell/state",
    "crates/graphshell/shell/system/registry/register-diagnostics",
    "crates/graphshell/shell/system/registry/register-input",
    "crates/graphshell/shell/system/registry/register-knowledge",
    "crates/graphshell/shell/system/registry/register-layout",
    "crates/graphshell/shell/system/registry/register-lens",
    "crates/graphshell/shell/system/registry/register-mod-loader",
    "crates/graphshell/shell/system/registry/register-protocol",
    "crates/graphshell/shell/system/registry/register-theme",
    "crates/graphshell/shell/system/registry/register-viewer",
    "crates/graphshell/shell/ux-events",
    "crates/inker",
    "crates/inker/document-canvas",
    "crates/inker/engines/nematic",
    "crates/inker/engines/scrying-engine",
    "crates/forme/forme",
    "crates/forme/uxtree",
    "crates/platen/domain/apparatus",
    "crates/platen/domain/gloss",
    "crates/platen/domain/workbench",
    "crates/platen/platen",
    "crates/verso/tile-state",
    "crates/verso/verso-core",
    "crates/eidetic/eidetic-core",
    "crates/eidetic/eidetic-fjall",
    "crates/eidetic/eidetic-https-fetcher",
    "crates/eidetic/eidetic-iroh-fetcher",
    "crates/import",
    "crates/intel/embed",
    "crates/murm/misfin",
    "crates/murm/murm",
    "crates/murm/murmuring",
    "crates/murm/transport",
    "crates/murm/webfinger",
    "crates/moot/moothold",
    "crates/moot/mooting",
]
exclude = [
    "crates/probes",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/mere"

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
aether = { path = "crates/graphshell/graph/aether" }
gyre = { path = "crates/graphshell/graph/gyre" }
cartography = { path = "crates/graphshell/graph/cartography" }
graph-canvas = { path = "crates/graphshell/graph/graph-canvas" }
graph-layout = { path = "crates/graphshell/graph/graph-layout" }
node-lineage = { path = "crates/graphshell/graph/node-lineage" }
linked-data = { path = "crates/graphshell/graph/linked-data" }
kernel = { path = "crates/graphshell/graph/graph-kernel" }
orrery = { path = "crates/graphshell/graph/orrery" }

shell-state = { path = "crates/graphshell/shell/state" }
frame = { path = "crates/graphshell/shell/domain/frame" }
chrome = { path = "crates/graphshell/shell/domain/chrome" }
session-runtime = { path = "crates/graphshell/shell/session-runtime" }
ux-events = { path = "crates/graphshell/shell/ux-events" }
register-diagnostics = { path = "crates/graphshell/shell/system/registry/register-diagnostics" }

inker = { path = "crates/inker" }
document-canvas = { path = "crates/inker/document-canvas" }
nematic = { path = "crates/inker/engines/nematic" }
scrying-engine = { path = "crates/inker/engines/scrying-engine" }

forme = { path = "crates/forme/forme" }
uxtree = { path = "crates/forme/uxtree" }

platen = { path = "crates/platen/platen" }
apparatus = { path = "crates/platen/domain/apparatus" }
gloss = { path = "crates/platen/domain/gloss" }
workbench = { path = "crates/platen/domain/workbench" }

verso-core = { path = "crates/verso/verso-core" }
tile-state = { path = "crates/verso/tile-state" }

eidetic = { path = "crates/eidetic/eidetic-core" }
eidetic-fjall = { path = "crates/eidetic/eidetic-fjall" }
eidetic-https-fetcher = { path = "crates/eidetic/eidetic-https-fetcher" }
eidetic-iroh-fetcher = { path = "crates/eidetic/eidetic-iroh-fetcher" }

embed = { path = "crates/intel/embed" }

murm = { path = "crates/murm/murm" }
murmuring = { path = "crates/murm/murmuring" }
transport = { path = "crates/murm/transport" }

moothold = { path = "crates/moot/moothold" }
mooting = { path = "crates/moot/mooting" }

identity = { path = "crates/persona/identity" }

# ─── External pins ───────────────────────────────────────────────────────────
# Linebender visual stack — one row, one wgpu, vello upstream-current.
vello = "0.9"
wgpu = "29"
kurbo = "0.13"
peniko = "0.6"
parley = "0.9"
skrifa = "0.42"
color = "0.3"

# Layout engine — platen's between-tiles arrangement authority (Masonry owns
# within-tile content). Standalone, GUI-free; platen implements its Node/Cache.
morphorm = "0.8"

# Input + accessibility + window plumbing.
accesskit = "0.24"
accesskit_windows = "0.32"
accesskit_unix = "0.21"
accesskit_macos = "0.26"
ui-events = "0.3"
dpi = "0.1.2"
raw-window-handle = "0.6"
winit = "0.30.13"

# Cross-cutting utilities that benefit from one-version alignment.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# ─── Cross-repo render-stack alignment (meerkat → serval) ────────────────────
# meerkat pulls serval-layout (via pelt-live) for the cascade → layout → paint
# path. serval-layout's `stylo_taffy` deps crates.io `stylo`/`stylo_atoms`, while
# serval pins the same crates from the servo/stylo git rev; `stylo` declares
# `links = "servo_style_crate"` (only one Stylo allowed per graph). Redirect the
# crates.io deps to the same git rev so they unify with serval's Stylo rather than
# conflict — a root-workspace patch applies graph-wide, including transitive deps.
# Mirrors serval's own patch (serval docs/2026-05-20_stylo_taffy_adoption_plan.md);
# touches only the new serval-layout transitive dep (mere's crates don't use stylo).
[patch.crates-io]
stylo = { git = "https://github.com/servo/stylo", rev = "572ecba2d1600e7c3d490586692a209faf703baa" }
stylo_atoms = { git = "https://github.com/servo/stylo", rev = "572ecba2d1600e7c3d490586692a209faf703baa" }
