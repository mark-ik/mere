[package]
name = "personae"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "The identity and carry layer for the Strophos ecosystem: a master Ed25519 keypair, deterministic per-protocol key derivation (BLAKE3), a passphrase/OS-store-unlocked vault, and sealed-record storage. A person has personae, plural — work, research, burner — so the crate is the register of your faces and their root of trust. Promoted from mere's persona/identity."
repository = "https://github.com/mark-ik/personae"
keywords = ["identity", "ed25519", "keychain", "vault", "p2p"]
categories = ["cryptography", "authentication"]

[lib]
path = "src/lib.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
blake3 = "1.5"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
thiserror = "1"
tracing = "0.1"
# Passphrase-encrypted storage + sealed-record backends.
argon2 = "0.5"
chacha20poly1305 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
hex = "0.4"
tempfile = "3"

# OS-store unlock backend (Windows DPAPI today; other platforms follow).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
] }
