[workspace]
resolver = "2"
members = [
    "crates/mere/mere",
    "crates/mere/mere-identity",
    "crates/mere/mere-transport",
    "crates/graph/graph-canvas",
    "crates/graph/graph-memory",
    "crates/graph/graph-tree",
    "crates/registry/register-diagnostics",
    "crates/graphshell",
    "crates/graphshell/core",
    "crates/graphshell/host",
    "crates/graphshell/host-iced",
    "crates/graphshell/runtime",
    "crates/graphshell/shell-state",
    "crates/verso-tile",
    "crates/inker",
    "crates/platen",
    "crates/nematic",
    "crates/eidetic",
    "crates/murm/murm",
    "crates/murm/murmuring",
    "crates/moot/moothold",
    "crates/moot/mooting",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/mere"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
