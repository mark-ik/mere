[workspace]
resolver = "2"
members = [
    "crates/meerkat-browser-worker",
    "crates/meerkat",
    "crates/armillary",
    "crates/orrery/orrery",
    "crates/persona/identity",
    "crates/orrery/aether",
    "crates/orrery/gyre",
    "crates/orrery/cartography",
    "crates/orrery/arrangements",
    "crates/graph/glossary",
    "crates/graph/graphlets",
    "crates/graph/graph-kernel",
    "crates/graph/linked-data",
    "crates/graph/node-lineage",
    "crates/shell/chrome",
    "crates/shell/comms",
    "crates/shell/frame",
    "crates/system/session-runtime",
    "crates/system/fetch",
    "crates/system/content-contract",
    "crates/system/shell-state",
    "crates/system/registry/register-diagnostics",
    "crates/system/registry/register-input",
    "crates/system/registry/register-knowledge",
    "crates/system/registry/register-layout",
    "crates/system/registry/register-lens",
    "crates/system/registry/register-mod-loader",
    "crates/system/registry/register-protocol",
    "crates/system/registry/register-theme",
    "crates/system/registry/register-viewer",
    "crates/system/ux-events",
    "crates/inker",
    "crates/inker/document-canvas",
    "crates/inker/illume",
    "crates/inker/knot-editor-host",
    "crates/inker/engines/nematic",
    "crates/inker/engines/scrying-engine",
    "crates/inker/engines/graft-engine",
    "crates/inker/engines/weld-engine",
    "crates/verso-api",
    "crates/verso-serval",
    "crates/verso-scry",
    "crates/verso",
    "crates/forme/forme",
    "crates/forme/uxtree",
    "crates/domain/apparatus",
    "crates/domain/gloss",
    "crates/domain/roster",
    "crates/platen/domain/workbench",
    "crates/platen/platen",
    "crates/eidetic/eidetic-core",
    "crates/eidetic/eidetic-fjall",
    "crates/eidetic/eidetic-https-fetcher",
    "crates/eidetic/eidetic-iroh-fetcher",
    "crates/eidetic/eidetic-search",
    "crates/import",
    "crates/crawl",
    "crates/intel/embed",
    "crates/intel/infer",
    "crates/intel/signals",
    "crates/murm/murm",
    "crates/murm/murmuring",
    "crates/murm/transport",
    "crates/murm/gazette",
    "crates/moot/moothold",
    "crates/moot/mooting",
    "crates/mesh/mesh",
    "crates/script/rhai",
    "crates/script/document-host",
]
exclude = [
    "crates/probes",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/mere"

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
aether = { path = "crates/orrery/aether" }
gyre = { path = "crates/orrery/gyre" }
cartography = { path = "crates/orrery/cartography" }
# Deterministic graph arrangements (penrose / l-system / phyllotaxis /
# kanban-timeline / radial-grid / semantic), recaptured from the retired
# graph-layout; gyre owns live force physics.
arrangements = { path = "crates/orrery/arrangements" }
node-lineage = { path = "crates/graph/node-lineage" }
linked-data = { path = "crates/graph/linked-data" }
kernel = { path = "crates/graph/graph-kernel" }
graphlets = { path = "crates/graph/graphlets" }
# The orrery host content-root (was `orrery-host`); takes the bare `orrery` name.
orrery = { path = "crates/orrery/orrery" }
# Graph digest projections (djot outline, metrics) — `glossary` (was `mere-orrery`).
glossary = { path = "crates/graph/glossary" }

# The actor-kernel runtime (host-neutral): the !Send host-kernel boundary + the
# Send actor harness the constellation is built on.
armillary = { path = "crates/armillary" }
meerkat-browser-worker = { path = "crates/meerkat-browser-worker" }

fetch = { path = "crates/system/fetch" }
content-contract = { path = "crates/system/content-contract" }
shell-state = { path = "crates/system/shell-state" }
frame = { path = "crates/shell/frame" }
chrome = { path = "crates/shell/chrome" }
comms = { path = "crates/shell/comms" }
session-runtime = { path = "crates/system/session-runtime" }
ux-events = { path = "crates/system/ux-events" }
register-diagnostics = { path = "crates/system/registry/register-diagnostics" }
register-theme = { path = "crates/system/registry/register-theme" }

inker = { path = "crates/inker" }
document-canvas = { path = "crates/inker/document-canvas" }
nematic = { path = "crates/inker/engines/nematic" }
scrying-engine = { path = "crates/inker/engines/scrying-engine" }
graft-engine = { path = "crates/inker/engines/graft-engine" }
weld-engine = { path = "crates/inker/engines/weld-engine" }
verso-api = { path = "crates/verso-api" }
verso-serval = { path = "crates/verso-serval" }
verso-scry = { path = "crates/verso-scry" }
verso = { path = "crates/verso" }

forme = { path = "crates/forme/forme" }
uxtree = { path = "crates/forme/uxtree" }

platen = { path = "crates/platen/platen" }
apparatus = { path = "crates/domain/apparatus" }
gloss = { path = "crates/domain/gloss" }
roster = { path = "crates/domain/roster" }
workbench = { path = "crates/platen/domain/workbench" }

eidetic = { path = "crates/eidetic/eidetic-core" }
eidetic-fjall = { path = "crates/eidetic/eidetic-fjall" }
eidetic-https-fetcher = { path = "crates/eidetic/eidetic-https-fetcher" }
eidetic-iroh-fetcher = { path = "crates/eidetic/eidetic-iroh-fetcher" }
# Lexical search over the trail (Phase 9 producer half): tantivy index +
# BM25 recall + fast-field reports + the hybrid-fusion seam.
eidetic-search = { path = "crates/eidetic/eidetic-search" }

# Browser-data ingest (bookmarks/history/session models + parsers); consumed
# by the eidetic-recall bridge and, later, the shell's import verbs.
import = { path = "crates/import" }
crawl = { path = "crates/crawl" }

embed = { path = "crates/intel/embed" }
infer = { path = "crates/intel/infer" }
signals = { path = "crates/intel/signals" }

# Standalone spec-B misfin implementation (promoted out of this workspace
# 2026-07-03); an owned mark-ik repo, tracked by branch per convention.
misfin = { git = "https://github.com/mark-ik/misfin", branch = "main" }
murm = { path = "crates/murm/murm" }
murmuring = { path = "crates/murm/murmuring" }
transport = { path = "crates/murm/transport" }

moothold = { path = "crates/moot/moothold" }
mooting = { path = "crates/moot/mooting" }

# The personal-space compute mesh (resource-coordination M1): signed job ops
# over the tessera-proven LogSync lane + the deterministic job board.
mesh = { path = "crates/mesh/mesh" }

identity = { path = "crates/persona/identity" }

# Rhai backend for the knot block-evaluator lane (the thin BlockEvaluator
# slice, distinct from serval's full ScriptEngine seam). Pure Rust, sandboxed.
script-rhai = { path = "crates/script/rhai" }

# ─── External pins ───────────────────────────────────────────────────────────
# Linebender visual stack — one row, one wgpu, vello upstream-current.
vello = "0.9"
wgpu = "29"
kurbo = "0.13"
peniko = "0.6"
parley = "0.10"
skrifa = "0.42"
color = "0.3"


# Input + accessibility + window plumbing.
accesskit = "0.24"
accesskit_windows = "0.32"
accesskit_unix = "0.21"
accesskit_macos = "0.26"
ui-events = "0.3"
dpi = "0.1.2"
raw-window-handle = "0.6"
winit = "0.30.13"

# Cross-cutting utilities that benefit from one-version alignment.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Shared Strophos seed-palette derivation engine (OKLCH). register-theme
# derives the full ThemeTokenSet from a few seed colours via this. Published as
# `tinct` on crates.io; kept under the local alias `tincture` (Cargo `package =`)
# so consumers and every `use tincture::` stay unchanged.
tincture = { package = "tinct", version = "0.1" }

# Off-grid mesh transport probe (optional, default-off). The `reticulum` crate
# is a Rust implementation of the Reticulum Network Stack; keep the pin here so
# the probe does not silently drift.
reticulum = "0.1"

# Reticulum transport probe helpers: deterministic dual-key identity derivation
# (HKDF-SHA256), X25519 static secrets, and the RNG source for announce packets.
hkdf = "0.12"
sha2 = "0.10"
x25519-dalek = { version = "2", features = ["static_secrets"] }
rand_core = "0.6"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# ─── Cross-repo render-stack alignment (meerkat → serval) ────────────────────
# meerkat pulls serval-layout (via pelt-live) for the cascade → layout → paint
# path. serval-layout's `stylo_taffy` deps crates.io `stylo`/`stylo_atoms`, while
# serval pins the same crates from the servo/stylo git rev; `stylo` declares
# `links = "servo_style_crate"` (only one Stylo allowed per graph). Redirect the
# crates.io deps to the same git rev so they unify with serval's Stylo rather than
# conflict — a root-workspace patch applies graph-wide, including transitive deps.
# Mirrors serval's own patch (serval docs/2026-05-20_stylo_taffy_adoption_plan.md);
# touches only the new serval-layout transitive dep (mere's crates don't use stylo).
[patch.crates-io]
stylo = { git = "https://github.com/servo/stylo", rev = "8bde0e96db888b7f188830bea261e72b2006fd73" }
stylo_atoms = { git = "https://github.com/servo/stylo", rev = "8bde0e96db888b7f188830bea261e72b2006fd73" }
# serval-layout requires taffy =0.11.0-experimental-cache-fix.3 (serval's vendored
# float-layout fork, not on crates.io). serval patches it in its own workspace; mere
# does not inherit that, so redirect taffy to the fork from the owned serval repo by
# BRANCH, never a rev (owned forks track branches). A fresh checkout anywhere resolves
# it from git; a local serval checkout is picked up by the gitignored
# `.cargo/config.toml` override, which lists serval's component/port dirs but NOT
# support/patches/taffy, so it never collides with this patch. No local paths live in
# this committed manifest, so it compiles anywhere.
taffy = { git = "https://github.com/mark-ik/serval.git", branch = "main" }

# ipc-channel: in-process fork, vendored in serval at support/patches/ipc-channel
# and reached here via serval's git (exactly like the taffy patch above). Mere is
# single-process, so ipc-channel's OS IPC transport is vestigial; the fork defaults
# to its built-in force-inprocess backend and makes the OS deps optional, dropping
# the windows 0.61 pin that let gpu-allocator latch onto 0.61.3 while wgpu-hal forced
# 0.62.2, breaking the dx12 suballocator. With it gone, gpu-allocator unifies on 0.62.
ipc-channel = { git = "https://github.com/mark-ik/serval.git", branch = "main" }

# Boa JS engine, for the meerkat `scripted` render rung (the `serval.scripted` lane
# runs page JS through `ScriptedDocument` on Boa). Mirrors serval's own patch
# (`script-engine-boa` names `boa_engine`/`boa_gc` `=1.0.0-dev`, resolved to the fork).
# `script-engine-boa` is an *optional* meerkat dep, so the base build's compile graph
# stays JS-engine-free (the profile ladder's witness discipline); this patch only
# satisfies resolution. Git deps so a bare clone resolves.
boa_engine = { git = "https://github.com/mark-ik/boa.git", branch = "serval" }
boa_gc = { git = "https://github.com/mark-ik/boa.git", branch = "serval" }
