[package]
name = "scholia"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
description = "The RDF projection over a chartulary graph's semantic ring. Nodes with addresses and labels become RDF subjects with schema.org literals; edges carrying a predicate IRI become triples; app-private relations are not projected. Emits expanded JSON-LD and N-Quads. Harvested from mere's linked-data, re-seamed onto the capability traits."
repository = "https://github.com/mark-ik/scholia"
keywords = ["rdf", "json-ld", "linked-data", "graph", "semantic"]
categories = ["data-structures", "encoding"]

[dependencies]
chartulary = { path = "../chartulary" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
