[workspace]
resolver = "2"
members = [
    "crates/mere",
    "crates/canvas/canvas",
    "crates/canvas/cartography",
    "crates/canvas/arrangements",
    "crates/graph/glossary",
    "crates/graph/graphlets",
    "crates/graph/graph-kernel",
    "crates/graph/linked-data",
    "crates/shell/chrome",
    "crates/shell/comms",
    "crates/incipit",
    "crates/capability",
    "crates/system/pandect",
    "crates/system/luggage",
    "crates/system/fetch",
    "crates/system/content-contract",
    "crates/system/proofs",
    "crates/system/shell-state",
    "crates/system/notochord",
    "crates/system/registry/register-diagnostics",
    "crates/system/registry/register-input",
    "crates/system/registry/register-knowledge",
    "crates/system/registry/register-layout",
    "crates/system/registry/register-lens",
    "crates/system/registry/register-mod-loader",
    "crates/system/registry/register-protocol",
    "crates/system/registry/register-theme",
    "crates/system/registry/register-viewer",
    "crates/system/ux-events",
    "crates/forme/forme",
    "crates/forme/uxtree",
    "crates/domain/apparatus",
    "crates/domain/gloss",
    "crates/domain/roster",
    "crates/domain/trail",
    "crates/platen/domain/workbench",
    "crates/platen/platen",
    "crates/eidetic/eidetic-core",
    "crates/eidetic/eidetic-fjall",
    "crates/eidetic/eidetic-https-fetcher",
    "crates/eidetic/eidetic-iroh-fetcher",
    "crates/eidetic/eidetic-search",
    "crates/import",
    "crates/crawl",
    "crates/intel/esp",
    "crates/intel/mora-cmudict",
    "crates/intel/signals",
    "crates/stickleback",
    "crates/murm/murm",
    "crates/murm/transport",
    "crates/dramatis/chatelaine",
    "crates/dramatis/dramatis",
    "crates/dramatis/emblem",
    "crates/dramatis/gaz",
    "crates/dramatis/gazette",
    "crates/dramatis/persona-picker",
    "crates/moot/commons",
    "crates/moot/gemot",
    "crates/moot/moothold",
    "crates/moot/mooting",
    "crates/mesh/mesh",
    "crates/mesh/host",
    "crates/script/rhai",
    "crates/script/document-host",
    "crates/script/app-host",
    # ─── Absorbed 2026-07-23 (design_docs/.../2026-07-23_repo_consolidation_plan.md) ───
    # Mere is the platform; these families are its components, packaged here
    # rather than as siblings. Crate names, versions, and licenses are unchanged;
    # only their repository home moved. Products consume them from mere.git.
    "crates/dramatis/personae",
    "crates/armillary",
    "crates/eidetic/muniment",
    "crates/eidetic/codicil",
    "crates/eidetic/chartulary",
    "crates/eidetic/scholia",
    "crates/eidetic/tulpa",
    "crates/servitor",
    "crates/intel/vates",
    "crates/intel/sibylla",
    "crates/conatus/numen",
    "crates/conatus/quint",
    "crates/conatus/seiche",
    "crates/scenograph/sceno",
    "crates/scenograph/scenomise",
    "crates/scenograph/scenotime",
    "crates/scenograph/scenograph",
    "crates/chirograph",
    "crates/titulus",
    "crates/graphshell/graphshell-client",
