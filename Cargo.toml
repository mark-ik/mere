[workspace]
resolver = "2"
members = [
    "crates/mere",
    "crates/canvas/canvas",
    "crates/persona/identity",
    "crates/canvas/cartography",
    "crates/canvas/arrangements",
    "crates/graph/glossary",
    "crates/graph/graphlets",
    "crates/graph/graph-kernel",
    "crates/graph/linked-data",
    "crates/shell/chrome",
    "crates/shell/comms",
    "crates/incipit",
    "crates/system/session-runtime",
    "crates/system/fetch",
    "crates/system/content-contract",
    "crates/system/proofs",
    "crates/system/shell-state",
    "crates/system/registry/register-diagnostics",
    "crates/system/registry/register-input",
    "crates/system/registry/register-knowledge",
    "crates/system/registry/register-layout",
    "crates/system/registry/register-lens",
    "crates/system/registry/register-mod-loader",
    "crates/system/registry/register-protocol",
    "crates/system/registry/register-theme",
    "crates/system/registry/register-viewer",
    "crates/system/ux-events",
    "crates/forme/forme",
    "crates/forme/uxtree",
    "crates/domain/apparatus",
    "crates/domain/gloss",
    "crates/domain/roster",
    "crates/domain/trail",
    "crates/platen/domain/workbench",
    "crates/platen/platen",
    "crates/eidetic/eidetic-core",
    "crates/eidetic/eidetic-fjall",
    "crates/eidetic/eidetic-https-fetcher",
    "crates/eidetic/eidetic-iroh-fetcher",
    "crates/eidetic/eidetic-search",
    "crates/import",
    "crates/crawl",
    "crates/intel/embed",
    "crates/intel/infer",
    "crates/intel/signals",
    "crates/murm/murm",
    "crates/murm/replication",
    "crates/murm/transport",
    "crates/persona/gazetteer",
    "crates/moot/gemot",
    "crates/moot/moothold",
    "crates/moot/mooting",
    "crates/mesh/mesh",
    "crates/script/rhai",
    "crates/script/document-host",
]
exclude = [
    "crates/probes",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mark-ik/mere"

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
# quint + seiche extracted to sibling repos + published 2026-07-18 (portable,
# MIT/Apache); crates.io deps, local checkout via the gitignored
# `.cargo/config.toml` `[patch.crates-io]`. (numen the same, on graph-kernel.)
quint = "0.0.2"
seiche = "0.0.2"
cartography = { package = "mere-cartography", path = "crates/canvas/cartography" }
# Deterministic graph arrangements (penrose / l-system / phyllotaxis /
# kanban-timeline / radial-grid / semantic), recaptured from the retired
# graph-layout; seiche owns live force physics.
arrangements = { path = "crates/canvas/arrangements" }
linked-data = { package = "mere-linked-data", path = "crates/graph/linked-data" }
kernel = { package = "mere-kernel", path = "crates/graph/graph-kernel" }
graphlets = { path = "crates/graph/graphlets" }
# The graph-canvas content-root (was `orrery`; that name retired to the Merely
# product tier ladder, 2026-07-09 — see the boundary pass plan amendments).
canvas = { package = "mere-canvas", path = "crates/canvas/canvas" }
# Graph digest projections (djot outline, metrics) — `glossary` (was `mere-orrery`).
glossary = { package = "mere-glossary", path = "crates/graph/glossary" }

# The actor-kernel runtime (host-neutral): the !Send host-kernel boundary + the
# Send actor harness the constellation is built on. Promoted to its standalone
# repo (code-identical cutover 2026-07-09, boundary pass slice A); git sibling
# consumed one-way, local checkout via the gitignored `.cargo/config.toml` patch.
armillary = { git = "https://github.com/mark-ik/armillary.git", branch = "main" }
mere = { path = "crates/mere" }

fetch = { package = "mere-fetch", path = "crates/system/fetch" }
content-contract = { path = "crates/system/content-contract" }
proofs = { package = "mere-proofs", version = "0.1.0", path = "crates/system/proofs" }
shell-state = { path = "crates/system/shell-state" }
incipit = { path = "crates/incipit" }
chrome = { package = "mere-chrome", path = "crates/shell/chrome" }
comms = { package = "mere-comms", path = "crates/shell/comms" }
session-runtime = { path = "crates/system/session-runtime" }
ux-events = { path = "crates/system/ux-events" }
register-diagnostics = { path = "crates/system/registry/register-diagnostics" }
register-theme = { path = "crates/system/registry/register-theme" }

# The engine-management family moved to genet 2026-07-10 (genet
# docs/2026-07-09_inker_genet_adoption_plan.md); consumed as git siblings
# like the rest of the genet components. Local edit loop: the gitignored
# .cargo/config.toml patches these to the genet working copy.
inker = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
document-canvas = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
nematic = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
scrying-engine = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
graft-engine = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
weld-engine = { git = "https://github.com/mark-ik/genet.git", branch = "main" }

# Published as `mere-forme`: the crates.io name `forme` is owned by someone else
# (an HTML template engine). The `package =` alias keeps every `use forme::...`
# in the tree working, so this rename is one line, not a sweep.
forme = { package = "mere-forme", path = "crates/forme/forme" }
uxtree = { path = "crates/forme/uxtree" }

platen = { path = "crates/platen/platen" }
apparatus = { package = "mere-apparatus", path = "crates/domain/apparatus" }
gloss = { package = "mere-gloss", path = "crates/domain/gloss" }
roster = { package = "mere-roster", path = "crates/domain/roster" }
trail = { package = "mere-trail", path = "crates/domain/trail" }
workbench = { path = "crates/platen/domain/workbench" }

eidetic = { path = "crates/eidetic/eidetic-core" }
eidetic-fjall = { path = "crates/eidetic/eidetic-fjall" }
eidetic-https-fetcher = { path = "crates/eidetic/eidetic-https-fetcher" }
eidetic-iroh-fetcher = { path = "crates/eidetic/eidetic-iroh-fetcher" }
# Lexical search over the trail (Phase 9 producer half): tantivy index +
# BM25 recall + fast-field reports + the hybrid-fusion seam.
eidetic-search = { path = "crates/eidetic/eidetic-search" }

# Browser-data ingest (bookmarks/history/session models + parsers); consumed
# by the eidetic-recall bridge and, later, the shell's import verbs.
import = { path = "crates/import" }
crawl = { package = "mere-crawl", path = "crates/crawl" }

embed = { package = "mere-embed", path = "crates/intel/embed" }
infer = { package = "mere-infer", path = "crates/intel/infer" }
signals = { package = "mere-signals", path = "crates/intel/signals" }

# Standalone spec-B misfin implementation (promoted out of this workspace
# 2026-07-03); an owned mark-ik repo, tracked by branch per convention.
misfin = { git = "https://github.com/mark-ik/misfin", branch = "main", features = ["ring"] }
murm = { path = "crates/murm/murm" }
murm-replication = { version = "0.1.0", path = "crates/murm/replication" }
transport = { package = "mere-transport", path = "crates/murm/transport" }

gemot = { version = "0.1.0", path = "crates/moot/gemot" }
moothold = { version = "0.1.0", path = "crates/moot/moothold" }
mooting = { version = "0.1.0", path = "crates/moot/mooting" }

# The personal-space compute mesh (resource-coordination M1): signed job ops
# over the tessera-proven LogSync lane + the deterministic job board.
mesh = { package = "mere-mesh", path = "crates/mesh/mesh" }

identity = { package = "personae", version = "0.1.0", path = "../personae" }
muniment = { version = "0.1.0" }
# Handle-resolution index (WebFinger today; NIP-05 / atproto-did / moot
# web-of-trust to come). Incubating, promoted out of the murm supercrate
# 2026-07-08 (a gazetteer is a directory, not a broadcast gazette); no consumer
# yet, and its blocking reqwest needs an async port before one wires it.
gazetteer = { package = "mere-gazetteer", path = "crates/persona/gazetteer" }

# Rhai backend for the knot block-evaluator lane (the thin BlockEvaluator
# slice, distinct from genet's full ScriptEngine seam). Pure Rust, sandboxed.
script-rhai = { path = "crates/script/rhai" }

# ─── External pins ───────────────────────────────────────────────────────────
# Linebender visual stack — one row, one wgpu, vello upstream-current.
vello = "0.9"
wgpu = "29"
kurbo = "0.13"
peniko = "0.6"
parley = "0.10"
skrifa = "0.42"
color = "0.3"


# Input + accessibility + window plumbing.
accesskit = "0.24"
accesskit_windows = "0.32"
accesskit_unix = "0.21"
accesskit_macos = "0.26"
ui-events = "0.3"
dpi = "0.1.2"
raw-window-handle = "0.6"
winit = "0.30.13"

# Cross-cutting utilities that benefit from one-version alignment.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }
# Shared Merely seed-palette derivation engine (OKLCH). register-theme
# derives the full ThemeTokenSet from a few seed colours via this. Published as
# `tinct` on crates.io; kept under the local alias `tincture` (Cargo `package =`)
# so consumers and every `use tincture::` stay unchanged.
tincture = { package = "tinct", version = "=0.1.2" }

# Off-grid mesh transport backend (optional, default-off). `retinue` is Mark's
# own from-scratch Rust Reticulum Network Stack implementation, wire-compatible
# with RNS 1.3.x (it replaces the stale Beechat `reticulum` 0.1 crate, which
# could not parse ratcheted announces from real RNS). Sibling repo referenced by
# relative path, like `identity`/`personae`; move to a git/crates.io pin once
# retinue is published.
retinue = { path = "../retinue" }

# Reticulum identity derivation: HKDF-SHA256 stretches Mere's 32-byte master seed
# into retinue's 64-byte dual-key private identity. retinue owns the X25519/RNG
# work, so the probe no longer needs x25519-dalek or a separate rand source.
hkdf = "0.12"
sha2 = "0.10"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"

# ─── Cross-repo render-stack alignment (meerkat → genet) ────────────────────
# meerkat pulls genet-layout (via pelt-live) for the cascade → layout → paint
# path. Genet's fork family is published under distinct `genet-stylo*` names,
# and genet's vendored stylo_taffy adapter consumes those registry packages
# directly. The only remaining root redirect in this cone is the Taffy fork.
[patch.crates-io]
layout-dom-api = { git = "https://github.com/mark-ik/genet.git", branch = "main", version = "=0.1.0" }
genet-scripted-dom = { git = "https://github.com/mark-ik/genet.git", branch = "main", version = "=0.1.0" }
# genet-layout requires taffy =0.11.0-experimental-cache-fix.3 (genet's vendored
# float-layout fork, not on crates.io). genet patches it in its own workspace; mere
# does not inherit that, so redirect taffy to the fork from the owned genet repo by
# BRANCH, never a rev (owned forks track branches). A fresh checkout anywhere resolves
# it from git; a local genet checkout is picked up by the gitignored
# `.cargo/config.toml` override, which lists genet's component/port dirs but NOT
# support/patches/taffy, so it never collides with this patch. No local paths live in
# this committed manifest, so it compiles anywhere.
taffy = { git = "https://github.com/mark-ik/genet.git", branch = "main" }
# Same restatement for stylo_taffy: genet-layout deps stylo_taffy 0.3.0-beta.1,
# whose crates.io copy requires stylo ^0.19 — while our stylo fork is 0.18, and
# both `links = "servo_style_crate"`, so the registry copy is not merely wrong,
# it is unresolvable. Genet vendors a stylo_taffy patched onto the fork; mere
# does not inherit genet's patch table, so it restates it here (same rule as
# taffy above; the local `.cargo/config.toml` redirects it to a genet checkout).
stylo_taffy = { git = "https://github.com/mark-ik/genet.git", branch = "main" }

# ipc-channel: in-process fork, vendored in genet at support/patches/ipc-channel
# and reached here via genet's git (exactly like the taffy patch above). Mere is
# single-process, so ipc-channel's OS IPC transport is vestigial; the fork defaults
# to its built-in force-inprocess backend and makes the OS deps optional, dropping
# the windows 0.61 pin that let gpu-allocator latch onto 0.61.3 while wgpu-hal forced
# 0.62.2, breaking the dx12 suballocator. With it gone, gpu-allocator unifies on 0.62.
ipc-channel = { git = "https://github.com/mark-ik/genet.git", branch = "main" }

# Boa JS engine, for the meerkat `scripted` render rung (the `genet.scripted` lane
# runs page JS through `ScriptedDocument` on Boa). Mirrors genet's own patch
# (`script-engine-boa` names `boa_engine`/`boa_gc` `=1.0.0-dev`, resolved to the fork).
# `script-engine-boa` is an *optional* meerkat dep, so the base build's compile graph
# stays JS-engine-free (the profile ladder's witness discipline); this patch only
# satisfies resolution. Git deps so a bare clone resolves.
boa_engine = { git = "https://github.com/mark-ik/boa.git", branch = "genet" }
boa_gc = { git = "https://github.com/mark-ik/boa.git", branch = "genet" }
