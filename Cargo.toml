[package]
name = "sibylla"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
description = "A local-embedding and semantic-retrieval seam: the EmbeddingProvider trait, similarity metrics, a deterministic stub, a pure-Rust vector index, a SemanticSearch facade, a burn-free lexical embedder, and an affinity-pairs helper — serde-only and wasm-clean. A burn-wgpu BERT backend is the porting roadmap. Sibling to vates (generation)."
repository = "https://github.com/mark-ik/sibylla"
keywords = ["embeddings", "vector-search", "semantic", "retrieval", "rag"]
categories = ["science", "data-structures"]

[dependencies]
serde = { version = "1", features = ["derive"] }
# Burn-backed batched-cosine index kernel (the `index-burn` feature). ndarray for
# portable CPU compute; `index-burn-wgpu` adds the wgpu backend for GPU execution.
# Optional — the default build stays serde-only and wasm-clean.
burn = { version = "0.21", default-features = false, features = ["ndarray", "std"], optional = true }

[dev-dependencies]
serde_json = "1"

# The portable retrieval core (index / search / lexical / affinity), ported from
# mere's intel/embed (see design_docs/2026-07-07_sibylla_founding_proposal.md), is
# serde-only, so it ships in the default build with no feature gate. Only the
# model-backed backend rides features:
#   bert / bert-wgpu — the burn-wgpu BERT backend (MiniLM, BGE-micro, arctic-xs),
#                      pulling burn / tokenizers / safetensors / half. (Roadmap P2.)
# The default build stays wasm-clean.
[features]
default = []
# The batched-cosine index kernel: all-pairs / query-vs-all cosine as one matmul
# on burn (the heavy O(Q·N·d) work), CPU top-k over the readback. ndarray backend.
index-burn = ["dep:burn"]
# Adds burn's wgpu backend so the kernel runs on the GPU.
index-burn-wgpu = ["index-burn", "burn/wgpu"]
