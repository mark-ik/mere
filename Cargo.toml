[workspace]
resolver = "2"
members = [
    "crates/mere/host",
    "crates/mere/host-substrate",
    "crates/persona/identity",
    "crates/graphshell",
    "crates/graphshell/graph/aether",
    "crates/graphshell/graph/cartography",
    "crates/graphshell/graph/graph-canvas",
    "crates/graphshell/graph/graph-kernel",
    "crates/graphshell/graph/graph-layout",
    "crates/graphshell/graph/node-lineage",
    "crates/graphshell/graph/orrery",
    "crates/graphshell/graph/spatial-substrate",
    "crates/graphshell/shell/domain/chrome",
    "crates/graphshell/shell/domain/frame",
    "crates/graphshell/shell/host-ports",
    "crates/graphshell/shell/session-runtime",
    "crates/graphshell/shell/state",
    "crates/graphshell/shell/system/control-plane",
    "crates/graphshell/shell/system/registry/register-diagnostics",
    "crates/graphshell/shell/system/registry/register-renderer",
    "crates/graphshell/shell/system/registry/register-renderer-types",
    "crates/graphshell/shell/ux-events",
    "crates/inker",
    "crates/inker/document-canvas",
    "crates/inker/engines/nematic",
    "crates/inker/engines/scrying-engine",
    "crates/forme/forme",
    "crates/forme/uxtree",
    "crates/platen/domain/apparatus",
    "crates/platen/domain/gloss",
    "crates/platen/domain/workbench",
    "crates/platen/platen",
    "crates/verso/scrying-renderer",
    "crates/verso/tile-state",
    "crates/verso/verso-core",
    "crates/eidetic/eidetic-core",
    "crates/eidetic/eidetic-fjall",
    "crates/eidetic/eidetic-https-fetcher",
    "crates/eidetic/eidetic-iroh-fetcher",
    "crates/intel/embed",
    "crates/murm/murm",
    "crates/murm/murmuring",
    "crates/murm/transport",
    "crates/moot/moothold",
    "crates/moot/mooting",
]
exclude = [
    "crates/probes",
    "crates/verso/masonry-renderer",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MPL-2.0"
repository = "https://github.com/mark-ik/mere"

# Centralized load-bearing pins. Every crate that uses one of these declares
# it directly with `<dep>.workspace = true` rather than via transitive
# resolution through another crate's re-export. Per
# `~/.claude/.../memory/feedback_workspace_pins_drive_probes.md`: workspace
# pins canonically, probes adapt; pick once with the user, don't churn.
[workspace.dependencies]
# ─── Workspace-internal path deps ────────────────────────────────────────────
# Every workspace member listed here; consumers do `dep.workspace = true`
# so only the root Cargo.toml knows where each crate lives. Package names
# below are the *current* names — rename passes (drop mere-* prefix etc.)
# update both this list and consumer references in one shot.
aether = { path = "crates/graphshell/graph/aether" }
cartography = { path = "crates/graphshell/graph/cartography" }
graph-canvas = { path = "crates/graphshell/graph/graph-canvas" }
graph-layout = { path = "crates/graphshell/graph/graph-layout" }
node-lineage = { path = "crates/graphshell/graph/node-lineage" }
kernel = { path = "crates/graphshell/graph/graph-kernel" }
orrery = { path = "crates/graphshell/graph/orrery" }
spatial-substrate = { path = "crates/graphshell/graph/spatial-substrate" }

graphshell = { path = "crates/graphshell" }
graphshell-control-plane = { path = "crates/graphshell/shell/system/control-plane" }
graphshell-shell-state = { path = "crates/graphshell/shell/state" }
mere-frame = { path = "crates/graphshell/shell/domain/frame" }
mere-graphshell = { path = "crates/graphshell/shell/domain/chrome" }
mere-host-contract = { path = "crates/graphshell/shell/host-ports" }
mere-host-runtime = { path = "crates/graphshell/shell/session-runtime" }
mere-renderer-registry = { path = "crates/graphshell/shell/system/registry/register-renderer" }
mere-renderer-registry-types = { path = "crates/graphshell/shell/system/registry/register-renderer-types" }
mere-ux-events = { path = "crates/graphshell/shell/ux-events" }
register-diagnostics = { path = "crates/graphshell/shell/system/registry/register-diagnostics" }

inker = { path = "crates/inker" }
document-canvas = { path = "crates/inker/document-canvas" }
nematic = { path = "crates/inker/engines/nematic" }
scrying-tile-engine = { path = "crates/inker/engines/scrying-engine" }

forme = { path = "crates/forme/forme" }
uxtree = { path = "crates/forme/uxtree" }

platen = { path = "crates/platen/platen" }
mere-apparatus = { path = "crates/platen/domain/apparatus" }
mere-gloss = { path = "crates/platen/domain/gloss" }
mere-workbench = { path = "crates/platen/domain/workbench" }

verso-tile = { path = "crates/verso/verso-core" }
verso-tile-state = { path = "crates/verso/tile-state" }
scrying-embedded-renderer = { path = "crates/verso/scrying-renderer" }

eidetic = { path = "crates/eidetic/eidetic-core" }
eidetic-fjall = { path = "crates/eidetic/eidetic-fjall" }
eidetic-https-fetcher = { path = "crates/eidetic/eidetic-https-fetcher" }
eidetic-iroh-fetcher = { path = "crates/eidetic/eidetic-iroh-fetcher" }

intelligence-embeddings = { path = "crates/intel/embed" }

murm = { path = "crates/murm/murm" }
murmuring = { path = "crates/murm/murmuring" }
mere-transport = { path = "crates/murm/transport" }

moothold = { path = "crates/moot/moothold" }
mooting = { path = "crates/moot/mooting" }

mere-identity = { path = "crates/persona/identity" }

mere-host = { path = "crates/mere/host" }
mere-host-substrate = { path = "crates/mere/host-substrate" }

# ─── External pins ───────────────────────────────────────────────────────────
# Linebender visual stack — one row, one wgpu, vello upstream-current.
vello = "0.9"
wgpu = "29"
kurbo = "0.13"
peniko = "0.6"
parley = "0.9"
skrifa = "0.42"
color = "0.3"

# Input + accessibility + window plumbing.
accesskit = "0.24"
accesskit_windows = "0.32"
accesskit_unix = "0.21"
accesskit_macos = "0.26"
ui-events = "0.3"
dpi = "0.1.2"
raw-window-handle = "0.6"
winit = "0.30.13"

# Cross-cutting utilities that benefit from one-version alignment.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = "warn"
